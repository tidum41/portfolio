<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOOLA B2B Quick Order (design)</title>
<style>
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 400;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 500;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 700;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-700-normal.woff2") format("woff2");
}

:root {
  --ink: #1a1a1a;
  --muted: #5c5c66;
  --faint: #8a8a96;
  --line: #e6e8ef;
  --line-soft: rgba(112, 115, 147, 0.12);
  --band: #f4f5f7;
  --sidebar-bg: #fbfcfd;
  --wash: #eceef2;
  --blue: #2c3ee0;
  --blue-soft: rgba(44, 62, 224, 0.08);
  --page: #ffffff;
  --canvas: #ededec;
  --switcher-h: 48px;
  --sidebar-w: 220px;
  --topbar-h: 48px;
  --paid: #198754;
  --paid-bg: rgba(25, 135, 84, 0.12);
  --pending: #8a6100;
  --pending-bg: rgba(238, 186, 54, 0.18);
  --failed: #b0175f;
  --failed-bg: rgba(176, 23, 95, 0.10);
  --failed-border: rgba(208, 50, 117, 0.22);
  --col-thumb: 48px;
  --col-product: 1fr;
  --col-price: 140px;
  --col-qty: 168px;
  --col-total: 128px;
  --col-x: 36px;
  --inv-invoice: 132px;
  --inv-order: 112px;
  --inv-issued: 124px;
  --inv-due: 124px;
  --inv-amount: 120px;
  --inv-status: 108px;
  --inv-action: 140px;
  --tnum: tabular-nums;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: "FKGroteskNeue", -apple-system, "Segoe UI", sans-serif;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; border: 0; background: none; color: inherit; }
img { display: block; max-width: 100%; }
.tnum, [data-display-price], [data-unit-price], [data-line-total],
[data-order-total], [data-cart-total], [data-invoice-amount],
[data-credit-used], [data-credit-available], .qty, .amt, .price,
.cart-amount-display, .unit, .big, .total {
  font-variant-numeric: var(--tnum);
  font-feature-settings: "tnum" 1;
}

#devSwitcher {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--switcher-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 16px;
  background: #161613;
  color: #fff;
  overflow-x: auto;
}
#devSwitcher .label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-right: 8px;
  white-space: nowrap;
}
#devSwitcher .tab-btn {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
}
#devSwitcher .tab-btn.active {
  background: #fff;
  color: #161613;
}

#app {
  padding-top: var(--switcher-h);
  min-height: 100vh;
}

.screen { display: none; background: var(--page); min-height: calc(100vh - var(--switcher-h)); }
.screen.active { display: flex; flex-direction: column; min-height: calc(100vh - var(--switcher-h)); }
.screen.mobile-wrap {
  max-width: 390px;
  margin: 0 auto;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

/* —— App shell: sidebar + top bar —— */
.app-shell {
  display: flex;
  flex: 1 1 auto;
  min-height: calc(100vh - var(--switcher-h));
  background: var(--page);
}
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 16px;
}
.sidebar-brand img { width: 84px; height: auto; }
.wholesale-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--blue);
}
.wholesale-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 30px;
  padding: 0 10px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 400;
  color: var(--muted);
  text-align: left;
  width: 100%;
  transition: background-color 0.16s ease-out, color 0.16s ease-out;
}
.nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}
.nav-item:hover { background: rgba(112, 115, 147, 0.06); color: var(--ink); }
.nav-item.active {
  background: var(--blue-soft);
  color: var(--blue);
  font-weight: 500;
}
.sidebar-divider {
  height: 1px;
  background: var(--line);
  margin: 12px 8px;
}
.sidebar-section {
  font-size: 11px;
  font-weight: 500;
  color: var(--faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 4px 10px 8px;
}
.sidebar-meta {
  margin-top: auto;
  padding: 12px 10px 4px;
  font-size: 12px;
  color: var(--faint);
  line-height: 1.4;
}
.sidebar-meta .bal {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.main-column {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--page);
}
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: #fff;
}
.top-search {
  height: 32px;
  width: min(420px, 46%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--band);
  font-size: 13px;
  color: var(--faint);
}
.top-search svg {
  width: 14px; height: 14px;
  stroke: currentColor; fill: none; stroke-width: 1.5; flex-shrink: 0;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.account-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 10px 4px 4px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  height: 36px;
}
.retailer-avatar {
  width: 28px;
  height: 28px;
  min-width: 28px;
  min-height: 28px;
  max-width: 28px;
  max-height: 28px;
  border-radius: 50%;
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 4px;
}
.retailer-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.retailer-avatar.avatar-failed {
  background: var(--failed) !important;
  border-color: #8e2a20 !important;
}
.retailer-avatar.avatar-failed::after {
  content: "!";
  color: #fff;
  font-weight: 500;
  font-size: 14px;
}
.account-meta { line-height: 1.2; text-align: left; }
.account-meta .name { font-size: 13px; font-weight: 500; }
.account-meta .role { font-size: 11px; color: var(--faint); }

.cart-pill {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.cart-pill .badge {
  position: absolute;
  top: -5px; right: -5px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: var(--failed);
  border: 2px solid #fff;
  font-size: 10px;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page {
  padding: 28px 28px 100px;
  width: 100%;
  flex: 1 1 auto;
}
.page h1 {
  margin: 0;
  font-size: 28px;
  line-height: 1.2;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.page .lede {
  margin: 8px 0 0;
  max-width: 560px;
  font-size: 14px;
  color: var(--muted);
  line-height: 1.5;
  font-weight: 400;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}
.search-wrap { position: relative; width: 400px; flex-shrink: 0; }
.search-field {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--band);
  border: 1px solid var(--line);
  font-size: 14px;
  color: var(--faint);
}
.search-field .placeholder { color: var(--faint); }
.search-field .value { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.search-field.has-value .placeholder { display: none; }
.search-field:not(.has-value) .value { display: none; }
.search-results {
  position: absolute;
  top: 42px; left: 0; right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  z-index: 20;
}
.search-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  height: 46px;
}
.search-result:hover { background: var(--blue-soft); }
.search-result img {
  width: 28px; height: 28px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 2px;
}
.search-result .title { font-size: 13px; font-weight: 500; }
.search-result .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.section-title {
  margin: 24px 0 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.search-row + .section-title {
  margin-top: 108px;
}

/* Order table */
.order-table {
  display: flex;
  flex-direction: column;
  width: 100%;
  border-top: 1px solid var(--line);
}
.order-head, .order-row {
  display: grid;
  grid-template-columns: var(--col-thumb) var(--col-product) var(--col-price) var(--col-qty) var(--col-total) var(--col-x);
  column-gap: 16px;
  align-items: center;
  padding: 0 12px;
}
.order-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding-top: 0;
  padding-bottom: 0;
}
.order-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.order-head .end,
.order-row .end,
.order-head .num,
.price-block,
.line-total {
  text-align: right;
}
.order-head .qty-h,
.order-row .qty-cell { text-align: right; }
.cat-label {
  padding: 14px 12px 4px;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
}
.order-row {
  min-height: 50px;
  height: 50px;
  border-bottom: 1px solid var(--line-soft);
  transition: background-color 0.15s ease-out;
}
.order-row:hover { background: rgba(44, 62, 224, 0.03); }
.order-row.has-presets {
  height: auto;
  min-height: 50px;
  padding: 6px 12px;
  align-items: center;
}
.order-row img.thumb {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 3px;
}
.prod-name { font-size: 14px; font-weight: 500; }
.prod-sku { font-size: 12px; color: var(--muted); margin-top: 1px; }
.price-block { display: flex; flex-direction: column; gap: 1px; align-items: flex-end; }
.price-block .strike { font-size: 12px; color: var(--faint); text-decoration: line-through; }
.price-block .unit { font-size: 14px; font-variant-numeric: tabular-nums; }
.price-block .hint { font-size: 11px; color: var(--muted); }
.price-block .hint b { color: var(--ink); font-weight: 500; }
.qty-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.qty-stepper {
  display: flex;
  align-items: center;
  height: 32px;
  width: 112px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
}
.qty-stepper button {
  width: 32px; height: 100%;
  font-size: 16px;
  color: var(--muted);
  transition: color 0.15s ease-out, background-color 0.15s ease-out;
  border-radius: 7px;
}
.qty-stepper button:hover { color: var(--ink); background: var(--band); }
.qty-stepper .qty {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.qty-presets {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}
.qty-presets button {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  height: 20px;
  font-variant-numeric: tabular-nums;
}
.qty-presets button.on {
  color: var(--blue);
  border-color: transparent;
  background: var(--blue-soft);
}
.line-total {
  font-size: 19px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.order-footer {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 28px;
  background: #fff;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.order-footer .total {
  font-size: 30px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.02em;
}
.order-footer .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.btn-primary {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  transition: opacity 0.15s ease-out;
}
.btn-primary:hover { opacity: 0.92; }
.btn-outline {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  transition: background-color 0.15s ease-out;
}
.btn-outline:hover { background: var(--band); }
.btn-black { /* legacy alias → primary accent */
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
}

/* Recommended / catalog */
.rec-rail {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.rec-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 14px;
  background: #fff;
  overflow: hidden;
}
.rec-card .media,
.cat-card .media {
  height: 220px;
  background: var(--band);
  overflow: hidden;
}
.rec-card .media img,
.cat-card .media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.rec-card .chip {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin: 12px 14px 0;
  padding: 0 8px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  background: var(--band);
  border-radius: 4px;
  border: 1px solid var(--line);
}
.rec-card .title { margin: 8px 14px 0; font-size: 16px; font-weight: 500; }
.rec-card .price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 14px 0;
  font-variant-numeric: tabular-nums;
}
.rec-card .price { font-size: 16px; font-weight: 500; }
.rec-card .msrp { font-size: 13px; color: var(--faint); text-decoration: line-through; }
.rec-card .moq { margin: 4px 14px 0; font-size: 12px; color: var(--muted); }
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.cat-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 12px;
  background: #fff;
  overflow: hidden;
}
.cat-card .title { margin: 10px 12px 0; font-size: 13px; font-weight: 500; }
.cat-card .price { margin: 4px 12px 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left; }
.cat-card .moq { margin: 2px 12px 0; font-size: 12px; color: var(--muted); }

/* Invoices */
.credit-card {
  width: 380px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  margin-top: 20px;
  background: #fff;
}
.credit-card .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
}
.credit-card .row span:first-child { color: var(--muted); font-weight: 400; }
.credit-card .row span:last-child { font-variant-numeric: tabular-nums; }
.credit-bar {
  margin-top: 10px;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: var(--wash);
  overflow: hidden;
}
.credit-bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
.credit-card .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
.invoice-table {
  margin-top: 24px;
  width: max-content;
  max-width: 100%;
  border-top: 1px solid var(--line);
}
.invoice-head, .invoice-row {
  display: grid;
  grid-template-columns: var(--inv-invoice) var(--inv-order) var(--inv-issued) var(--inv-due) var(--inv-amount) var(--inv-status) var(--inv-action);
  column-gap: 16px;
  align-items: center;
  padding: 0 8px;
  width: max-content;
}
.invoice-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.invoice-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.invoice-head > div.num,
.invoice-row .amt {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.invoice-row {
  height: 50px;
  min-height: 50px;
  border-bottom: 1px solid var(--line-soft);
}
.invoice-row .id { font-size: 14px; font-weight: 500; }
.invoice-row .cell { font-size: 13px; color: var(--muted); }
.invoice-row .amt {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 20px;
  padding: 0 8px;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 400;
  line-height: 20px;
  text-transform: none;
  white-space: nowrap;
}
.status.Paid {
  background: var(--paid-bg);
  color: var(--paid);
}
.status.Processing,
.status.Due,
.status.Pending {
  background: var(--pending-bg);
  color: var(--pending);
}
.status.Overdue,
.status.Failed {
  background: var(--failed-bg);
  color: var(--failed);
  border: 1px solid var(--failed-border);
}
.invoice-row .action { justify-self: stretch; }
.invoice-row .action button {
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  width: 100%;
  background: #fff;
}

/* Messages */
.messages-layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  flex: 1 1 auto;
  min-height: 0;
}
.inbox {
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  background: var(--sidebar-bg);
}
.inbox h2 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; }
.inbox-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 0 10px;
  height: 48px;
  border-radius: 8px;
  background: var(--blue-soft);
  border: 1px solid transparent;
}
.joola-mark {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  overflow: hidden;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  flex-shrink: 0;
}
.joola-mark img {
  width: 100%;
  height: auto;
  filter: brightness(0) invert(1);
}
.bubble.sam .who {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bubble.sam .joola-mark {
  width: 22px;
  height: 22px;
  min-width: 22px;
  padding: 4px;
}
.thread {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.thread-head {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 48px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-weight: 500;
}
.thread-body {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fff;
}
.bubble {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 18px;
  line-height: 1.45;
  font-weight: 400;
}
.bubble .who { font-size: 12px; margin-bottom: 6px; }
.bubble .who b { font-weight: 500; }
.bubble .who span { color: var(--muted); font-weight: 400; }
.bubble.anna {
  align-self: flex-end;
  background: var(--ink);
  color: #fff;
}
.bubble.anna .who span { color: rgba(255,255,255,0.65); }
.bubble.sam {
  align-self: flex-start;
  background: var(--band);
  border: 1px solid var(--line);
}
.thread-compose {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.thread-compose .field {
  flex: 1;
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--band);
  color: var(--faint);
  font-size: 14px;
}
.thread-compose .btn-send {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

/* Cart */
.cart-lines { margin-top: 20px; display: flex; flex-direction: column; max-width: 720px; border-top: 1px solid var(--line); }
.cart-line {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 14px;
  align-items: center;
  height: 50px;
  min-height: 50px;
  padding: 0 4px;
  border-bottom: 1px solid var(--line-soft);
}
.cart-line img {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 3px;
}
.cart-line .line-total { text-align: right; }
.cart-summary {
  margin-top: 24px;
  max-width: 360px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
}
.cart-summary .big {
  font-size: 30px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}

.templates-list { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.template-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  height: 64px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.template-card h3 { margin: 0; font-size: 14px; font-weight: 500; }
.template-card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.mobile-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  height: 48px;
}
.screen.mobile-wrap .page h1 { font-size: 28px; }
.screen.mobile-wrap .lede { font-size: 15px; }
.screen.mobile-wrap .prod-name { font-size: 15px; }
.screen.mobile-wrap .prod-sku { font-size: 13px; }
.screen.mobile-wrap .order-footer .btn-outline,
.screen.mobile-wrap .order-footer .btn-primary { font-size: 15px; height: 44px; }
</style>
</head>
<body>
  <div id="devSwitcher">
    <span class="label">Screens</span>
    <button type="button" class="tab-btn active" data-tab="qo-desktop">Quick Order</button>
    <button type="button" class="tab-btn" data-tab="catalog">Catalog</button>
    <button type="button" class="tab-btn" data-tab="templates">Templates</button>
    <button type="button" class="tab-btn" data-tab="cart">Cart</button>
    <button type="button" class="tab-btn" data-tab="invoices">Invoices &amp; Terms</button>
    <button type="button" class="tab-btn" data-tab="messages">Messages</button>
    <button type="button" class="tab-btn" data-tab="qo-mobile">Quick Order Mobile</button>
  </div>

  <div id="app"></div>

  <script src="ledger.js"></script>
  <script>
(function () {
  var L = window.JOOLA_LEDGER;
  if (!L) throw new Error("JOOLA_LEDGER missing");

  var money = L.money;
  var NAV = [
    { id: "qo-desktop", label: "Quick order", icon: "order" },
    { id: "catalog", label: "Catalog", icon: "catalog" },
    { id: "templates", label: "Templates", icon: "templates" },
    { id: "invoices", label: "Invoices", icon: "invoices" },
    { id: "messages", label: "Messages", icon: "messages" },
  ];

  function icon(name) {
    var paths = {
      order: '<path d="M4 6h12M4 10h12M4 14h8"/>',
      catalog: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/>',
      templates: '<path d="M5 3h8l2 2v12H5z"/><path d="M13 3v3h3"/>',
      invoices: '<path d="M5 3h10v14H5z"/><path d="M8 7h4M8 10h4M8 13h2"/>',
      messages: '<path d="M3 5h14v10H7l-4 3V5z"/>',
    };
    return '<svg viewBox="0 0 20 20" aria-hidden="true">' + (paths[name] || "") + "</svg>";
  }

  function avatarHtml() {
    var size = Math.min(L.retailer.avatarSize, 28);
    return (
      '<div class="retailer-avatar" data-retailer-avatar style="width:' + size + "px;height:" + size + "px;min-width:" + size + "px;min-height:" + size + "px;max-width:" + size + "px;max-height:" + size + 'px;">' +
      '<img src="' + L.retailer.avatar + '" alt="' + L.retailer.name + '" width="' + size + '" height="' + size + '" onerror="this.closest(\'[data-retailer-avatar]\').classList.add(\'avatar-failed\'); this.remove();">' +
      "</div>"
    );
  }

  function joolaMarkHtml(cls) {
    return (
      '<div class="joola-mark' + (cls ? " " + cls : "") + '" data-joola-mark>' +
      '<img src="joola-logo.png" alt="JOOLA" width="36" height="12">' +
      "</div>"
    );
  }

  function shellOpen(activeTab) {
    var items = NAV.map(function (n) {
      return (
        '<button type="button" class="nav-item' + (n.id === activeTab ? " active" : "") + '" data-tab="' + n.id + '">' +
        icon(n.icon) +
        "<span>" + n.label + "</span>" +
        "</button>"
      );
    }).join("");
    return (
      '<div class="app-shell" data-wholesale-chrome>' +
      '<aside class="sidebar" data-sidebar>' +
      '<div class="sidebar-brand">' +
      '<img src="joola-logo.png" alt="JOOLA" width="84" height="28">' +
      "</div>" +
      '<div class="wholesale-pill" style="padding:0 10px 12px;"><span class="dot"></span>Wholesale</div>' +
      '<nav class="sidebar-nav">' + items + "</nav>" +
      '<div class="sidebar-divider"></div>' +
      '<div class="sidebar-section">Account</div>' +
      '<button type="button" class="nav-item" data-tab="cart" style="height:30px;">' +
      icon("order") +
      "<span>Open cart</span></button>" +
      '<div class="sidebar-meta">' + L.retailer.name +
      '<div class="bal">' + L.terms + " · " + money(L.credit.available) + " avail.</div></div>" +
      "</aside>" +
      '<div class="main-column">' +
      '<header class="topbar" data-topbar>' +
      '<div class="top-search"><svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>' +
      "<span>Search SKUs, orders, invoices</span></div>" +
      '<div class="topbar-right">' +
      '<button type="button" class="account-chip" data-account-chip>' +
      avatarHtml() +
      '<div class="account-meta"><div class="name">' + L.retailer.name + '</div><div class="role">' + L.retailer.buyer + " · " + L.retailer.role + "</div></div>" +
      "</button>" +
      '<button type="button" class="cart-pill" data-tab="cart" data-cart-pill aria-label="Cart, ' + money(L.cartTotal) + '">' +
      "<span>Cart</span>" +
      '<span class="cart-amount-display" data-cart-total>' + money(L.cartTotal) + "</span>" +
      '<span class="badge cart-badge-display" data-cart-count>' + L.cartCount + "</span>" +
      "</button>" +
      "</div></header>"
    );
  }

  function shellClose() {
    return "</div></div>";
  }

  function unitPriceHtml(product, qty) {
    var unit = L.priceAt(product, qty);
    var next = L.nextTier(product, qty);
    var hint = next
      ? '<div class="hint">Buy ' + next.min + '+ for <b>' + money(next.price) + " ea</b></div>"
      : '<div class="hint"><b>Best price unlocked</b></div>';
    return (
      '<div class="price-block">' +
      '<div class="strike">' + money(product.msrp) + "</div>" +
      '<div class="unit" data-unit-price="' + unit + '" data-display-price>' + money(unit) + " ea</div>" +
      hint +
      "</div>"
    );
  }

  function orderTableHtml() {
    var rows = "";
    var lastCat = "";
    L.orderLines.forEach(function (line) {
      var p = L.products[line.productId];
      if (p.category !== lastCat) {
        rows += '<div class="cat-label">' + p.category + "</div>";
        lastCat = p.category;
      }
      var amount = L.lineAmount(line);
      var presets = "";
      var rowClass = "order-row";
      if (line.productId === "perseus") {
        rowClass += " has-presets";
        presets =
          '<div class="qty-presets">' +
          [12, 24, 60, 120]
            .map(function (n) {
              return (
                '<button type="button" class="' + (n === line.qty ? "on" : "") + '" data-set-perseus="' + n + '">' + n + "</button>"
              );
            })
            .join("") +
          "</div>";
      }
      rows +=
        '<div class="' + rowClass + '" data-order-row data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '" data-product="' + p.id + '">' +
        '<img class="thumb" src="' + p.image + '" alt="' + p.name + '" width="36" height="36">' +
        '<div><div class="prod-name">' + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + " · MOQ " + p.moq + "</div></div>" +
        unitPriceHtml(p, line.qty) +
        '<div class="qty-cell"><div class="qty-stepper"><button type="button" data-action="dec" aria-label="Decrease">-</button><div class="qty" data-qty="' + line.qty + '">' + line.qty + '</div><button type="button" data-action="inc" aria-label="Increase">+</button></div>' +
        presets +
        "</div>" +
        '<div class="line-total end" data-line-total="' + amount + '">' + money(amount) + "</div>" +
        '<div aria-hidden="true"></div>' +
        "</div>";
    });

    return (
      '<div class="section-title">This order</div>' +
      '<div class="order-table" data-order-table>' +
      '<div class="order-head" data-order-head>' +
      "<div></div><div>Product</div><div class=\"end\">Price</div><div class=\"qty-h end\">Quantity</div><div class=\"end\">Line total</div><div></div>" +
      "</div>" +
      rows +
      "</div>"
    );
  }

  function footerHtml() {
    return (
      '<div class="order-footer" data-order-footer>' +
      "<div><div class=\"meta\" data-line-count>" + L.orderLines.length + (L.orderLines.length === 1 ? " line" : " lines") + " · " + L.terms + "</div>" +
      '<div class="total" id="qoFooterTotal" data-order-total>' + money(L.orderTotal) + "</div></div>" +
      '<div style="display:flex;gap:10px;">' +
      '<button type="button" class="btn-outline">Save template</button>' +
      '<button type="button" class="btn-primary" id="qoAddAllBtn">Add all to cart</button>' +
      "</div></div>"
    );
  }

  function searchHtml() {
    var p = L.products.perseus;
    var typed = "600558";
    return (
      '<div class="search-row">' +
      '<div class="search-wrap">' +
      '<div class="search-field has-value" data-search-field data-search-value="' + typed + '">' +
      '<span class="placeholder">Search by name, category, or SKU</span>' +
      '<span class="value">' + typed + "</span>" +
      "</div>" +
      '<div class="search-results" data-search-results>' +
      '<div class="search-result" data-search-result data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
      '<img src="' + p.image + '" alt="' + p.name + '" width="28" height="28">' +
      "<div><div class=\"title\">" + p.name + '</div><div class="meta">SKU ' + p.sku + " · " + money(p.buyerPrice) + " · MOQ " + p.moq + "</div></div>" +
      "</div></div></div>" +
      '<button type="button" class="btn-outline">Bulk upload</button>' +
      "</div>"
    );
  }

  function screenQuickOrder() {
    return (
      '<section class="screen active" data-screen="qo-desktop">' +
      shellOpen("qo-desktop") +
      '<div class="page">' +
      "<h1>Build a bulk order</h1>" +
      '<p class="lede">Search or upload SKUs to add multiple products and quantities in one view. Pricing reflects ' +
      L.retailer.name +
      "'s wholesale tier.</p>" +
      searchHtml() +
      orderTableHtml() +
      "</div>" +
      footerHtml() +
      shellClose() +
      "</section>"
    );
  }

  function screenCatalog() {
    var chips = ["Ordered most", "Your history", "Also due"];
    var rec = L.recommended
      .map(function (id, i) {
        var p = L.products[id];
        return (
          '<div class="rec-card" data-rec-card data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
          '<div class="media" data-product-media><img src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="chip">' + chips[i] + "</div>" +
          '<div class="title">' + p.name + "</div>" +
          '<div class="price-row"><span class="price" data-display-price>' + money(p.buyerPrice) + '</span><span class="msrp">' + money(p.msrp) + "</span></div>" +
          '<div class="moq">MOQ ' + p.moq + "</div>" +
          "</div>"
        );
      })
      .join("");

    var allIds = L.recommended.concat(L.catalogExtra);
    var grid = allIds
      .map(function (id) {
        var p = L.products[id];
        return (
          '<div class="cat-card" data-catalog-card data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
          '<div class="media" data-product-media><img src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="title">' + p.fullName + "</div>" +
          '<div class="price" data-display-price>' + money(p.buyerPrice) + "</div>" +
          '<div class="moq">MOQ ' + p.moq + "</div>" +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="catalog">' +
      shellOpen("catalog") +
      '<div class="page">' +
      "<h1>Catalog</h1>" +
      '<p class="lede">Browse everything available to ' + L.retailer.name + ", or start from Recommended for you.</p>" +
      '<div class="section-title">Recommended for you</div>' +
      '<div class="rec-rail">' + rec + "</div>" +
      '<div class="section-title">Paddles &amp; pickleball goods</div>' +
      '<div class="catalog-grid">' + grid + "</div>" +
      "</div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenTemplates() {
    return (
      '<section class="screen" data-screen="templates">' +
      shellOpen("templates") +
      '<div class="page">' +
      "<h1>Templates</h1>" +
      '<p class="lede">Shared with everyone on <strong>' + L.retailer.name + "</strong>.</p>" +
      '<div class="templates-list">' +
      '<div class="template-card"><h3>Perseus restock</h3><p>SKU 600558 · ' + L.perseusQty + " units · " + money(L.perseusOrderTotal) + "</p></div>" +
      '<div class="template-card"><h3>Match kit</h3><p>Paddles + HC-40 + Tour Elite Bag</p></div>' +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenCart() {
    var lines = L.orderLines
      .map(function (line) {
        var p = L.products[line.productId];
        var amount = L.lineAmount(line);
        return (
          '<div class="cart-line" data-cart-line data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
          '<img src="' + p.image + '" alt="' + p.name + '" width="36" height="36">' +
          "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + " · " + line.qty + " × " + money(L.priceAt(p, line.qty)) + "</div></div>" +
          '<div class="line-total" data-line-total="' + amount + '">' + money(amount) + "</div>" +
          "</div>"
        );
      })
      .join("");
    return (
      '<section class="screen" data-screen="cart">' +
      shellOpen("cart") +
      '<div class="page">' +
      "<h1>Cart</h1>" +
      '<p class="lede">Ready to place on ' + L.terms + " terms.</p>" +
      '<div class="cart-lines">' + lines + "</div>" +
      '<div class="cart-summary">' +
      '<div class="meta" style="font-size:13px;color:var(--muted);margin-bottom:6px;">Order total · ' + L.terms + "</div>" +
      '<div class="big" data-order-total data-cart-total>' + money(L.cartTotal) + "</div>" +
      '<div class="note" style="margin-top:12px;font-size:12px;color:var(--muted);">' +
      L.terms + " credit: " + money(L.credit.used) + " of " + money(L.credit.limit) + " used · " + money(L.credit.available) + " available</div>" +
      '<button type="button" class="btn-primary" style="margin-top:16px;">Place order</button>' +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function statusLabel(status) {
    if (status === "Processing" || status === "Due") return "Pending";
    if (status === "Overdue") return "Failed";
    return status;
  }

  function statusClass(status) {
    if (status === "Processing" || status === "Due") return "Pending";
    if (status === "Overdue") return "Failed";
    return status;
  }

  function screenInvoices() {
    var rows = L.invoices
      .map(function (inv) {
        return (
          '<div class="invoice-row" data-invoice-row data-invoice-id="' + inv.id + '">' +
          '<div class="id">' + inv.id + "</div>" +
          '<div class="cell">' + inv.order + "</div>" +
          '<div class="cell" data-col="issued">' + inv.issued + "</div>" +
          '<div class="cell" data-col="due">' + inv.due + "</div>" +
          '<div class="amt" data-col="amount" data-invoice-amount="' + inv.amount + '">' + money(inv.amount) + "</div>" +
          '<div data-col="status"><span class="status ' + statusClass(inv.status) + '">' + statusLabel(inv.status) + "</span></div>" +
          '<div class="action"><button type="button">Download PDF</button></div>' +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="invoices">' +
      shellOpen("invoices") +
      '<div class="page">' +
      "<h1>Invoices &amp; terms</h1>" +
      '<p class="lede">Track what has been billed to your account, what is still open, and how much of your credit line is available for Quick order.</p>' +
      '<div class="credit-card" data-credit-card>' +
      '<div class="row"><span>' + L.terms + ' credit line used</span><span data-credit-used>' + money(L.credit.used) + " of " + money(L.credit.limit) + "</span></div>" +
      '<div class="credit-bar" data-credit-bar><i style="width:' + L.credit.pct + '%" data-credit-fill></i></div>' +
      '<div class="note" data-credit-available>' + money(L.credit.available) + " available for new Quick order purchases on " + L.terms + " terms.</div>" +
      "</div>" +
      '<div class="invoice-table" data-invoice-table>' +
      '<div class="invoice-head" data-invoice-head>' +
      '<div>Invoice</div><div>Order</div><div>Issued</div><div>Due</div><div class="num">Amount</div><div>Status</div><div></div>' +
      "</div>" +
      rows +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenMessages() {
    return (
      '<section class="screen" data-screen="messages">' +
      shellOpen("messages") +
      '<div class="messages-layout">' +
      '<aside class="inbox"><h2>Inbox</h2>' +
      '<div class="inbox-item" data-inbox-joola>' + joolaMarkHtml() +
      "<div><div style=\"font-size:13px;font-weight:500;\">JOOLA Sales</div><div style=\"font-size:12px;color:var(--muted);margin-top:2px;\">Perseus Pro V restock</div></div>" +
      "</div></aside>" +
      '<div class="thread">' +
      '<div class="thread-head">Sam Ortiz · JOOLA Sales</div>' +
      '<div class="thread-body">' +
      '<div class="bubble anna" data-msg-anna><div class="who"><b>' + L.retailer.buyer + '</b> <span>· ' + L.retailer.name + "</span></div>" +
      L.messages.anna +
      "</div>" +
      '<div class="bubble sam" data-msg-sam><div class="who">' + joolaMarkHtml("sm") +
      "<span><b>Sam Ortiz</b> <span>· JOOLA Sales</span></span></div>" +
      L.messages.sam +
      "</div>" +
      "</div>" +
      '<div class="thread-compose"><div class="field">Message the sales team</div><button type="button" class="btn-send" aria-label="Send">↑</button></div>' +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenMobile() {
    var p = L.products.perseus;
    return (
      '<section class="screen mobile-wrap" data-screen="qo-mobile">' +
      '<div class="mobile-nav"><span style="color:var(--blue);">Wholesale</span><span style="color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:2px;">Quick order</span>' +
      '<span style="display:flex;align-items:center;gap:6px;">' + avatarHtml() + '<span style="font-size:11px;">' + L.retailer.name + "</span></span></div>" +
      '<div class="page" style="padding:20px 16px 100px;">' +
      "<h1 style=\"font-size:28px;\">Build a bulk order</h1>" +
      '<p class="lede">Pricing for ' + L.retailer.name + ".</p>" +
      '<div style="margin-top:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line-soft);height:50px;">' +
      '<img src="' + p.image + '" alt="" width="36" height="36" style="object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--band);padding:3px;">' +
      "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + "</div>" +
      '<div style="margin-top:2px;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;">' + money(L.perseusUnit) + " ea · qty " + L.perseusQty + "</div></div></div>" +
      '<div style="margin-top:20px;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;" data-order-total>' + money(L.orderTotal) + "</div>" +
      "</div>" +
      '<div class="order-footer" data-order-footer><button type="button" class="btn-outline" style="flex:1;justify-content:center;">Save</button><button type="button" class="btn-primary" style="flex:1;justify-content:center;">Add all to cart</button></div>' +
      "</section>"
    );
  }

  function render() {
    document.getElementById("app").innerHTML =
      screenQuickOrder() +
      screenCatalog() +
      screenTemplates() +
      screenCart() +
      screenInvoices() +
      screenMessages() +
      screenMobile();
    bind();
    show(current);
  }

  var current = "qo-desktop";

  function show(id) {
    current = id;
    document.querySelectorAll(".screen").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-screen") === id);
    });
    document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === id);
    });
  }

  function bind() {
    document.querySelectorAll("[data-tab]").forEach(function (el) {
      el.addEventListener("click", function () {
        var tab = el.getAttribute("data-tab");
        if (tab) show(tab);
      });
    });
  }

  window.__setPerseusQty = function (qty) {
    var line = L.orderLines.find(function (l) {
      return l.productId === "perseus";
    });
    if (!line) return;
    line.qty = qty;
    L.perseusQty = qty;
    L.perseusUnit = L.priceAt(L.products.perseus, qty);
    L.perseusOrderTotal = Math.round(L.perseusUnit * qty * 100) / 100;
    L.orderTotal =
      Math.round(
        L.orderLines.reduce(function (s, l) {
          return s + L.lineAmount(l);
        }, 0) * 100
      ) / 100;
    L.cartTotal = L.orderTotal;
    L.invoices[0].amount = L.orderTotal;
    L.credit.used =
      Math.round(
        L.invoices
          .filter(function (inv) {
            return inv.open;
          })
          .reduce(function (s, inv) {
            return s + inv.amount;
          }, 0) * 100
      ) / 100;
    L.credit.available = Math.round((L.credit.limit - L.credit.used) * 100) / 100;
    L.credit.pct = Math.round((L.credit.used / L.credit.limit) * 1000) / 10;
    L.messages.sam =
      "120 units of Perseus Pro V ship Friday. Invoice INV-1042 for " +
      money(L.orderTotal) +
      " is on Net 30.";
    L.figures.perseusUnit = L.perseusUnit;
    L.figures.perseusQty = qty;
    L.figures.perseusOrderTotal = L.perseusOrderTotal;
    L.figures.orderTotal = L.orderTotal;
    L.figures.cartTotal = L.cartTotal;
    L.figures.creditUsed = L.credit.used;
    L.figures.creditAvailable = L.credit.available;
    L.figures.invoiceAmounts = L.invoices.map(function (inv) {
      return inv.amount;
    });
    render();
  };

  document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      show(btn.getAttribute("data-tab"));
    });
  });

  render();
})();
  </script>
</body>
</html>
