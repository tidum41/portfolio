<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOOLA B2B Quick Order (design)</title>
<style>
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 400;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 500;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 700;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-700-normal.woff2") format("woff2");
}

:root {
  --ink: #1a1a1a;
  --muted: #595959;
  --faint: #808080;
  --line: #dedede;
  --band: #f6f6f6;
  --wash: #ececea;
  --blue: #2c3ee0;
  --page: #ffffff;
  --canvas: #ededec;
  --switcher-h: 48px;
  --col-thumb: 56px;
  --col-product: 1fr;
  --col-price: 150px;
  --col-qty: 170px;
  --col-total: 130px;
  --col-x: 40px;
  --inv-invoice: 140px;
  --inv-order: 120px;
  --inv-issued: 140px;
  --inv-due: 140px;
  --inv-amount: 140px;
  --inv-status: 140px;
  --inv-action: 1fr;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: "FKGroteskNeue", -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; }
button { cursor: pointer; border: 0; background: none; }
img { display: block; max-width: 100%; }

#devSwitcher {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--switcher-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 16px;
  background: #161613;
  color: #fff;
  overflow-x: auto;
}
#devSwitcher .label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-right: 8px;
  white-space: nowrap;
}
#devSwitcher .tab-btn {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
}
#devSwitcher .tab-btn.active {
  background: #fff;
  color: #161613;
}

#app {
  padding-top: var(--switcher-h);
  min-height: 100vh;
}

.screen { display: none; background: var(--page); min-height: calc(100vh - var(--switcher-h)); }
.screen.active { display: flex; flex-direction: column; }
.screen.mobile-wrap {
  max-width: 390px;
  margin: 0 auto;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

/* Shared wholesale chrome (no storefront promo / category nav) */
.chrome-bar {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 0 16px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  min-height: 72px;
}
.chrome-brand {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.chrome-brand img { width: 100px; height: auto; }
.wholesale-pill {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--blue);
}
.wholesale-pill .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--blue);
}
.nav-pills { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-pill {
  padding: 10px 14px;
  border-radius: 5px;
  font-size: 14px;
  font-weight: 700;
  color: var(--muted);
}
.nav-pill.active {
  color: var(--ink);
  box-shadow: inset 0 -2px 0 var(--ink);
  border-radius: 0;
}
.chrome-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 20px;
}

.account-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  background: var(--band);
}
.retailer-avatar {
  width: 36px;
  height: 36px;
  min-width: 36px;
  min-height: 36px;
  max-width: 36px;
  max-height: 36px;
  border-radius: 50%;
  overflow: hidden;
  /* Engage mark is black-on-transparent; light fill so the mark reads. */
  background: #fff;
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 6px;
}
.retailer-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.retailer-avatar.avatar-failed {
  background: #c0392b !important;
  border-color: #8e2a20 !important;
}
.retailer-avatar.avatar-failed::after {
  content: "!";
  color: #fff;
  font-weight: 700;
  font-size: 16px;
}
.account-meta { line-height: 1.25; text-align: left; }
.account-meta .name { font-size: 13px; font-weight: 600; }
.account-meta .role { font-size: 11px; color: var(--faint); }

.cart-pill {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 999px;
  background: var(--ink);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}
.cart-pill .badge {
  position: absolute;
  top: -6px; right: -6px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #c0392b;
  border: 2px solid #fff;
  font-size: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page {
  padding: 32px 16px 120px;
  width: 100%;
}
.page h1 {
  margin: 0;
  font-size: 34px;
  line-height: 1.2;
  font-weight: 700;
}
.page .lede {
  margin: 8px 0 0;
  max-width: 640px;
  font-size: 16px;
  color: var(--muted);
  line-height: 1.5;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 24px;
}
.search-wrap { position: relative; width: 420px; flex-shrink: 0; }
.search-field {
  height: 52px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-radius: 10px;
  background: var(--band);
  border: 1px solid var(--band);
  font-size: 16px;
  color: var(--faint);
}
.search-field strong { color: var(--ink); font-weight: 600; }
.search-results {
  position: absolute;
  top: 58px; left: 0; right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: 0 10px 28px rgba(20,20,18,0.14);
  padding: 6px;
  z-index: 20;
}
.search-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px;
  border-radius: 5px;
}
.search-result img {
  width: 44px; height: 44px;
  object-fit: contain;
  border-radius: 5px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 4px;
}
.search-result .title { font-size: 14px; font-weight: 700; }
.search-result .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.section-title {
  margin: 28px 0 12px;
  font-size: 18px;
  font-weight: 700;
}

/* Order table: CSS grid so headers and cells share tracks */
.order-table {
  display: flex;
  flex-direction: column;
  width: 100%;
}
.order-head, .order-row {
  display: grid;
  grid-template-columns: var(--col-thumb) var(--col-product) var(--col-price) var(--col-qty) var(--col-total) var(--col-x);
  column-gap: 16px;
  align-items: center;
  padding: 14px 8px;
}
.order-head {
  border-bottom: 1.5px solid var(--ink);
  padding-bottom: 12px;
  padding-top: 0;
}
.order-head > div {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}
.order-head .end, .order-row .end { text-align: right; }
.cat-label {
  padding: 20px 8px 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--blue);
}
.order-row { border-bottom: 1px solid var(--wash); }
.order-row img.thumb {
  width: 56px; height: 56px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 4px;
}
.prod-name { font-size: 14px; font-weight: 700; }
.prod-sku { font-size: 12px; color: var(--muted); margin-top: 2px; }
.price-block { display: flex; flex-direction: column; gap: 2px; }
.price-block .strike { font-size: 12px; color: var(--faint); text-decoration: line-through; }
.price-block .unit { font-size: 14px; font-variant-numeric: tabular-nums; }
.price-block .hint { font-size: 11px; color: var(--muted); }
.price-block .hint b { color: var(--ink); font-weight: 700; }
.qty-stepper {
  display: flex;
  align-items: center;
  height: 40px;
  width: 120px;
  border-radius: 10px;
  background: var(--band);
}
.qty-stepper button {
  width: 36px; height: 100%;
  font-size: 16px;
  color: var(--ink);
}
.qty-stepper .qty {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.qty-presets {
  display: flex;
  gap: 4px;
  margin-top: 6px;
}
.qty-presets button {
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--line);
}
.qty-presets button.on {
  color: var(--ink);
  border-color: var(--ink);
}
.line-total {
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.order-footer {
  position: sticky;
  bottom: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px;
  background: #fff;
  border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(20,20,18,0.06);
}
.order-footer .total {
  font-size: 38px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.order-footer .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.btn-black {
  height: 46px;
  display: inline-flex;
  align-items: center;
  padding: 0 20px;
  border-radius: 6px;
  background: #000;
  color: #eaeaea;
  font-size: 14px;
  font-weight: 700;
}
.btn-outline {
  height: 46px;
  display: inline-flex;
  align-items: center;
  padding: 0 20px;
  border-radius: 6px;
  border: 1px solid var(--ink);
  font-size: 14px;
  font-weight: 700;
}

/* Recommended / catalog cards */
.rec-rail {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.rec-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
  background: #fff;
}
.rec-card .media {
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--band);
  border-radius: 8px;
  padding: 16px;
}
.rec-card .media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.rec-card .chip {
  display: inline-block;
  margin-top: 12px;
  font-size: 12px;
  font-weight: 700;
  color: var(--blue);
}
.rec-card .title { margin-top: 6px; font-size: 18px; font-weight: 700; }
.rec-card .price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin-top: 6px;
  font-variant-numeric: tabular-nums;
}
.rec-card .price { font-size: 18px; font-weight: 700; }
.rec-card .msrp { font-size: 14px; color: var(--faint); text-decoration: line-through; }
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.cat-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px;
}
.cat-card .media {
  height: 160px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--band);
  border-radius: 8px;
  padding: 12px;
}
.cat-card .media img { width: 100%; height: 100%; object-fit: contain; }
.cat-card .title { margin-top: 10px; font-size: 14px; font-weight: 600; }
.cat-card .price { margin-top: 4px; font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cat-card .moq { margin-top: 2px; font-size: 12px; color: var(--muted); }

/* Invoices */
.credit-card {
  width: 400px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
  margin-top: 24px;
}
.credit-card .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 700;
}
.credit-card .row span:first-child { color: var(--muted); }
.credit-bar {
  margin-top: 10px;
  width: 100%;
  height: 8px;
  border-radius: 999px;
  background: var(--wash);
  overflow: hidden;
}
.credit-bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
.credit-card .note { margin-top: 10px; font-size: 12px; color: var(--muted); }

.invoice-table { margin-top: 32px; width: 100%; }
.invoice-head, .invoice-row {
  display: grid;
  grid-template-columns: var(--inv-invoice) var(--inv-order) var(--inv-issued) var(--inv-due) var(--inv-amount) var(--inv-status) var(--inv-action);
  column-gap: 16px;
  align-items: center;
  padding: 16px 8px;
}
.invoice-head {
  border-bottom: 1.5px solid var(--ink);
  padding-top: 0;
  padding-bottom: 12px;
}
.invoice-head > div {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--muted);
}
.invoice-row { border-bottom: 1px solid var(--wash); }
.invoice-row .id { font-size: 14px; font-weight: 700; }
.invoice-row .cell { font-size: 14px; color: var(--muted); }
.invoice-row .amt {
  font-size: 14px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.status {
  display: inline-flex;
  align-items: center;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}
.status.Processing { background: #e8ecff; color: var(--blue); }
.status.Due { background: #fff6da; color: #8a6100; }
.status.Overdue { background: #fde8e6; color: #c0392b; }
.status.Paid { background: #e7f4ee; color: #198754; }
.invoice-row .action { justify-self: end; }
.invoice-row .action button {
  height: 36px;
  padding: 0 14px;
  border-radius: 6px;
  border: 1px solid var(--ink);
  font-size: 13px;
  font-weight: 600;
}

/* Messages: full-bleed, same chrome */
.messages-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - var(--switcher-h) - 72px);
}
.inbox {
  border-right: 1px solid var(--line);
  padding: 16px;
  background: #fafaf9;
}
.inbox h2 { margin: 0 0 12px; font-size: 16px; font-weight: 700; }
.inbox-item {
  display: flex;
  gap: 10px;
  padding: 12px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid var(--line);
}
.thread {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.thread-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 16px;
  font-weight: 700;
}
.thread-body {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  background: #fafaf9;
}
.bubble {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 16px;
  line-height: 1.45;
}
.bubble .who { font-size: 12px; margin-bottom: 6px; }
.bubble .who b { font-weight: 700; }
.bubble .who span { color: var(--muted); font-weight: 500; }
.bubble.anna {
  align-self: flex-end;
  background: #111;
  color: #fff;
}
.bubble.anna .who span { color: rgba(255,255,255,0.7); }
.bubble.sam {
  align-self: flex-start;
  background: #e8ecff;
  border: 1px solid #d5dbff;
}
.thread-compose {
  display: flex;
  gap: 10px;
  padding: 14px 20px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.thread-compose .field {
  flex: 1;
  height: 46px;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-radius: 10px;
  background: var(--band);
  color: var(--faint);
  font-size: 15px;
}

/* Cart */
.cart-lines { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 720px; }
.cart-line {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--wash);
}
.cart-line img {
  width: 56px; height: 56px;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 4px;
}
.cart-summary {
  margin-top: 28px;
  max-width: 400px;
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 20px;
}
.cart-summary .big {
  font-size: 32px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.templates-list { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; max-width: 640px; }
.template-card {
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 16px;
}
.template-card h3 { margin: 0; font-size: 16px; font-weight: 700; }
.template-card p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

.mobile-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
}
</style>
</head>
<body>
  <div id="devSwitcher">
    <span class="label">Screens</span>
    <button type="button" class="tab-btn active" data-tab="qo-desktop">Quick Order</button>
    <button type="button" class="tab-btn" data-tab="catalog">Catalog</button>
    <button type="button" class="tab-btn" data-tab="templates">Templates</button>
    <button type="button" class="tab-btn" data-tab="cart">Cart</button>
    <button type="button" class="tab-btn" data-tab="invoices">Invoices &amp; Terms</button>
    <button type="button" class="tab-btn" data-tab="messages">Messages</button>
    <button type="button" class="tab-btn" data-tab="qo-mobile">Quick Order Mobile</button>
  </div>

  <div id="app"></div>

  <script src="ledger.js"></script>
  <script>
(function () {
  var L = window.JOOLA_LEDGER;
  if (!L) throw new Error("JOOLA_LEDGER missing");

  var money = L.money;
  var NAV = [
    { id: "qo-desktop", label: "Quick Order" },
    { id: "catalog", label: "Catalog" },
    { id: "templates", label: "Templates" },
    { id: "invoices", label: "Invoices & Terms" },
    { id: "messages", label: "Messages" },
  ];

  function avatarHtml() {
    var size = L.retailer.avatarSize;
    return (
      '<div class="retailer-avatar" data-retailer-avatar style="width:' + size + "px;height:" + size + "px;min-width:" + size + "px;min-height:" + size + "px;max-width:" + size + "px;max-height:" + size + 'px;">' +
      '<img src="' + L.retailer.avatar + '" alt="' + L.retailer.name + '" width="' + size + '" height="' + size + '" onerror="this.closest(\'[data-retailer-avatar]\').classList.add(\'avatar-failed\'); this.remove();">' +
      "</div>"
    );
  }

  function chrome(activeTab) {
    var pills = NAV.map(function (n) {
      return (
        '<button type="button" class="nav-pill' + (n.id === activeTab ? " active" : "") + '" data-tab="' + n.id + '">' +
        n.label +
        "</button>"
      );
    }).join("");
    return (
      '<div class="chrome-bar" data-wholesale-chrome>' +
      '<div class="chrome-brand">' +
      '<img src="joola-logo.png" alt="JOOLA" width="100" height="32">' +
      '<div class="wholesale-pill"><span class="dot"></span>Wholesale</div>' +
      "</div>" +
      '<div class="nav-pills">' + pills + "</div>" +
      '<div class="chrome-right">' +
      '<button type="button" class="account-chip" data-account-chip>' +
      avatarHtml() +
      '<div class="account-meta"><div class="name">' + L.retailer.name + '</div><div class="role">' + L.retailer.buyer + " · " + L.retailer.role + "</div></div>" +
      "</button>" +
      '<button type="button" class="cart-pill" data-tab="cart" data-cart-pill aria-label="Cart, ' + money(L.cartTotal) + '">' +
      "<span>Cart</span>" +
      '<span class="cart-amount-display" data-cart-total>' + money(L.cartTotal) + "</span>" +
      '<span class="badge cart-badge-display" data-cart-count>' + L.cartCount + "</span>" +
      "</button>" +
      "</div></div>"
    );
  }

  function unitPriceHtml(product, qty) {
    var unit = L.priceAt(product, qty);
    var next = L.nextTier(product, qty);
    var hint = next
      ? '<div class="hint">Buy ' + next.min + '+ for <b>' + money(next.price) + " ea</b></div>"
      : '<div class="hint"><b>Best price unlocked</b></div>';
    return (
      '<div class="price-block">' +
      '<div class="strike">' + money(product.msrp) + "</div>" +
      '<div class="unit" data-unit-price="' + unit + '">' + money(unit) + " ea</div>" +
      hint +
      "</div>"
    );
  }

  function orderTableHtml() {
    var rows = "";
    var lastCat = "";
    L.orderLines.forEach(function (line) {
      var p = L.products[line.productId];
      if (p.category !== lastCat) {
        rows += '<div class="cat-label">' + p.category + "</div>";
        lastCat = p.category;
      }
      var amount = L.lineAmount(line);
      var presets = "";
      if (line.productId === "perseus") {
        presets =
          '<div class="qty-presets">' +
          [12, 24, 60, 120]
            .map(function (n) {
              return (
                '<button type="button" class="' + (n === line.qty ? "on" : "") + '" data-set-perseus="' + n + '">' + n + "</button>"
              );
            })
            .join("") +
          "</div>";
      }
      rows +=
        '<div class="order-row" data-order-row data-sku="' + p.sku + '" data-product="' + p.id + '">' +
        '<img class="thumb" src="' + p.image + '" alt="' + p.name + '" width="56" height="56">' +
        '<div><div class="prod-name">' + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + " · MOQ " + p.moq + "</div></div>" +
        unitPriceHtml(p, line.qty) +
        '<div><div class="qty-stepper"><button type="button" data-action="dec" aria-label="Decrease">-</button><div class="qty" data-qty="' + line.qty + '">' + line.qty + '</div><button type="button" data-action="inc" aria-label="Increase">+</button></div>' +
        presets +
        "</div>" +
        '<div class="line-total end" data-line-total="' + amount + '">' + money(amount) + "</div>" +
        '<div aria-hidden="true"></div>' +
        "</div>";
    });

    return (
      '<div class="section-title">This order</div>' +
      '<div class="order-table" data-order-table>' +
      '<div class="order-head" data-order-head>' +
      "<div></div><div>Product</div><div>Price</div><div>Quantity</div><div class=\"end\">Line total</div><div></div>" +
      "</div>" +
      rows +
      "</div>"
    );
  }

  function footerHtml() {
    return (
      '<div class="order-footer" data-order-footer>' +
      "<div><div class=\"meta\" data-line-count>" + L.orderLines.length + (L.orderLines.length === 1 ? " line" : " lines") + " · " + L.terms + "</div>" +
      '<div class="total" id="qoFooterTotal" data-order-total>' + money(L.orderTotal) + "</div></div>" +
      '<div style="display:flex;gap:10px;">' +
      '<button type="button" class="btn-outline">Save template</button>' +
      '<button type="button" class="btn-black" id="qoAddAllBtn">Add All To Cart</button>' +
      "</div></div>"
    );
  }

  function searchHtml() {
    var p = L.products.perseus;
    var unit = L.perseusUnit;
    return (
      '<div class="search-row">' +
      '<div class="search-wrap">' +
      '<div class="search-field" data-search-field><span>Search by name, category, or SKU</span> <strong>600558</strong></div>' +
      '<div class="search-results" data-search-results>' +
      '<div class="search-result" data-search-result>' +
      '<img src="' + p.image + '" alt="' + p.name + '" width="44" height="44">' +
      "<div><div class=\"title\">" + p.name + '</div><div class="meta">SKU ' + p.sku + " · " + money(unit) + " · MOQ " + p.moq + "</div></div>" +
      "</div></div></div>" +
      '<button type="button" class="btn-outline">Bulk upload</button>' +
      "</div>"
    );
  }

  function screenQuickOrder() {
    return (
      '<section class="screen active" data-screen="qo-desktop">' +
      chrome("qo-desktop") +
      '<div class="page">' +
      "<h1>Build a bulk order</h1>" +
      '<p class="lede">Search or upload SKUs to add multiple products and quantities in one view. Pricing reflects ' +
      L.retailer.name +
      "'s wholesale tier.</p>" +
      searchHtml() +
      orderTableHtml() +
      "</div>" +
      footerHtml() +
      "</section>"
    );
  }

  function screenCatalog() {
    var chips = ["Ordered most", "Your history", "Also due"];
    var rec = L.recommended
      .map(function (id, i) {
        var p = L.products[id];
        var unit = L.priceAt(p, 24);
        return (
          '<div class="rec-card" data-rec-card>' +
          '<div class="media"><img src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="chip">' + chips[i] + "</div>" +
          '<div class="title">' + p.name + "</div>" +
          '<div class="price-row"><span class="price">' + money(unit) + '</span><span class="msrp">' + money(p.msrp) + "</span></div>" +
          '<div class="moq" style="margin-top:4px;font-size:12px;color:var(--muted);">MOQ ' + p.moq + " · as low as " + money(unit) + " at 24+</div>" +
          "</div>"
        );
      })
      .join("");

    var allIds = L.recommended.concat(L.catalogExtra);
    var grid = allIds
      .map(function (id) {
        var p = L.products[id];
        var unit = L.priceAt(p, Math.max(p.moq, 1));
        return (
          '<div class="cat-card" data-catalog-card>' +
          '<div class="media"><img src="' + p.image + '" alt="' + p.name + '"></div>' +
          '<div class="title">' + p.fullName + "</div>" +
          '<div class="price">' + money(unit) + "</div>" +
          '<div class="moq">MOQ ' + p.moq + "</div>" +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="catalog">' +
      chrome("catalog") +
      '<div class="page">' +
      "<h1>Catalog</h1>" +
      '<p class="lede">Browse everything available to ' + L.retailer.name + ", or start from Recommended For You.</p>" +
      '<div class="section-title">Recommended For You</div>' +
      '<div class="rec-rail">' + rec + "</div>" +
      '<div class="section-title">Paddles &amp; pickleball goods</div>' +
      '<div class="catalog-grid">' + grid + "</div>" +
      "</div></section>"
    );
  }

  function screenTemplates() {
    return (
      '<section class="screen" data-screen="templates">' +
      chrome("templates") +
      '<div class="page">' +
      "<h1>Templates</h1>" +
      '<p class="lede">Shared with everyone on <strong>' + L.retailer.name + "</strong>.</p>" +
      '<div class="templates-list">' +
      '<div class="template-card"><h3>Perseus restock</h3><p>SKU 600558 · ' + L.perseusQty + " units · " + money(L.perseusOrderTotal) + "</p></div>" +
      '<div class="template-card"><h3>Match kit</h3><p>Paddles + HC-40 + Tour Elite Bag</p></div>' +
      "</div></div></section>"
    );
  }

  function screenCart() {
    var lines = L.orderLines
      .map(function (line) {
        var p = L.products[line.productId];
        var amount = L.lineAmount(line);
        return (
          '<div class="cart-line" data-cart-line>' +
          '<img src="' + p.image + '" alt="' + p.name + '" width="56" height="56">' +
          "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">' + line.qty + " × " + money(L.priceAt(p, line.qty)) + "</div></div>" +
          '<div class="line-total" data-line-total="' + amount + '">' + money(amount) + "</div>" +
          "</div>"
        );
      })
      .join("");
    return (
      '<section class="screen" data-screen="cart">' +
      chrome("cart") +
      '<div class="page">' +
      "<h1>Cart</h1>" +
      '<p class="lede">Ready to place on ' + L.terms + " terms.</p>" +
      '<div class="cart-lines">' + lines + "</div>" +
      '<div class="cart-summary">' +
      '<div class="meta" style="font-size:13px;color:var(--muted);margin-bottom:6px;">Order total · ' + L.terms + "</div>" +
      '<div class="big" data-order-total data-cart-total>' + money(L.cartTotal) + "</div>" +
      '<div class="note" style="margin-top:12px;font-size:12px;color:var(--muted);">' +
      L.terms + " credit: " + money(L.credit.used) + " of " + money(L.credit.limit) + " used · " + money(L.credit.available) + " available</div>" +
      '<button type="button" class="btn-black" style="margin-top:16px;">Place order</button>' +
      "</div></div></section>"
    );
  }

  function screenInvoices() {
    var rows = L.invoices
      .map(function (inv) {
        return (
          '<div class="invoice-row" data-invoice-row data-invoice-id="' + inv.id + '">' +
          '<div class="id">' + inv.id + "</div>" +
          '<div class="cell">' + inv.order + "</div>" +
          '<div class="cell" data-col="issued">' + inv.issued + "</div>" +
          '<div class="cell" data-col="due">' + inv.due + "</div>" +
          '<div class="amt" data-col="amount" data-invoice-amount="' + inv.amount + '">' + money(inv.amount) + "</div>" +
          '<div data-col="status"><span class="status ' + inv.status + '">' + inv.status + "</span></div>" +
          '<div class="action"><button type="button">Download PDF</button></div>' +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="invoices">' +
      chrome("invoices") +
      '<div class="page">' +
      "<h1>Invoices &amp; Terms</h1>" +
      '<p class="lede">Track what has been billed to your account, what is still open, and how much of your credit line is available for Quick Order.</p>' +
      '<div class="credit-card" data-credit-card>' +
      '<div class="row"><span>' + L.terms + ' credit line used</span><span data-credit-used>' + money(L.credit.used) + " of " + money(L.credit.limit) + "</span></div>" +
      '<div class="credit-bar" data-credit-bar><i style="width:' + L.credit.pct + '%" data-credit-fill></i></div>' +
      '<div class="note" data-credit-available>' + money(L.credit.available) + " available for new Quick Order purchases on " + L.terms + " terms.</div>" +
      "</div>" +
      '<div class="invoice-table" data-invoice-table>' +
      '<div class="invoice-head" data-invoice-head>' +
      "<div>Invoice</div><div>Order</div><div>Issued</div><div>Due</div><div>Amount</div><div>Status</div><div></div>" +
      "</div>" +
      rows +
      "</div></div></section>"
    );
  }

  function screenMessages() {
    return (
      '<section class="screen" data-screen="messages">' +
      chrome("messages") +
      '<div class="messages-layout">' +
      '<aside class="inbox"><h2>Inbox</h2>' +
      '<div class="inbox-item">' + avatarHtml() +
      "<div><div style=\"font-size:13px;font-weight:700;\">JOOLA Sales</div><div style=\"font-size:12px;color:var(--muted);margin-top:2px;\">Perseus Pro V restock</div></div>" +
      "</div></aside>" +
      '<div class="thread">' +
      '<div class="thread-head">Sam Ortiz · JOOLA Sales</div>' +
      '<div class="thread-body">' +
      '<div class="bubble anna" data-msg-anna><div class="who"><b>' + L.retailer.buyer + '</b> <span>· ' + L.retailer.name + "</span></div>" +
      L.messages.anna +
      "</div>" +
      '<div class="bubble sam" data-msg-sam><div class="who"><b>Sam Ortiz</b> <span>· JOOLA Sales</span></div>' +
      L.messages.sam +
      "</div>" +
      "</div>" +
      '<div class="thread-compose"><div class="field">Message the sales team</div><button type="button" class="btn-black" style="border-radius:999px;width:46px;padding:0;justify-content:center;">↑</button></div>' +
      "</div></div></section>"
    );
  }

  function screenMobile() {
    var p = L.products.perseus;
    return (
      '<section class="screen mobile-wrap" data-screen="qo-mobile">' +
      '<div class="mobile-nav"><span style="color:var(--blue);">Wholesale</span><span style="box-shadow:inset 0 -2px 0 #1a1a1a;padding-bottom:2px;">Quick Order</span>' +
      '<span style="display:flex;align-items:center;gap:6px;">' + avatarHtml() + '<span style="font-size:11px;">' + L.retailer.name + "</span></span></div>" +
      '<div class="page" style="padding:20px 16px 100px;">' +
      "<h1 style=\"font-size:28px;\">Build a bulk order</h1>" +
      '<p class="lede">Pricing for ' + L.retailer.name + ".</p>" +
      '<div style="margin-top:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--wash);padding-bottom:14px;">' +
      '<img src="' + p.image + '" alt="" width="56" height="56" style="object-fit:contain;border:1px solid var(--line);border-radius:10px;background:var(--band);padding:4px;">' +
      "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + "</div>" +
      '<div style="margin-top:4px;font-weight:700;font-variant-numeric:tabular-nums;">' + money(L.perseusUnit) + " ea · qty " + L.perseusQty + "</div></div></div>" +
      '<div style="margin-top:20px;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;" data-order-total>' + money(L.orderTotal) + "</div>" +
      "</div>" +
      '<div class="order-footer"><button type="button" class="btn-outline" style="flex:1;justify-content:center;">Save</button><button type="button" class="btn-black" style="flex:1;justify-content:center;">Add All To Cart</button></div>' +
      "</section>"
    );
  }

  function render() {
    document.getElementById("app").innerHTML =
      screenQuickOrder() +
      screenCatalog() +
      screenTemplates() +
      screenCart() +
      screenInvoices() +
      screenMessages() +
      screenMobile();
    bind();
    show(current);
  }

  var current = "qo-desktop";

  function show(id) {
    current = id;
    document.querySelectorAll(".screen").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-screen") === id);
    });
    document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === id);
    });
  }

  function bind() {
    document.querySelectorAll("[data-tab]").forEach(function (el) {
      el.addEventListener("click", function () {
        var tab = el.getAttribute("data-tab");
        if (tab) show(tab);
      });
    });
  }

  window.__setPerseusQty = function (qty) {
    var line = L.orderLines.find(function (l) {
      return l.productId === "perseus";
    });
    if (!line) return;
    line.qty = qty;
    L.perseusQty = qty;
    L.perseusUnit = L.priceAt(L.products.perseus, qty);
    L.perseusOrderTotal = Math.round(L.perseusUnit * qty * 100) / 100;
    L.orderTotal =
      Math.round(
        L.orderLines.reduce(function (s, l) {
          return s + L.lineAmount(l);
        }, 0) * 100
      ) / 100;
    L.cartTotal = L.orderTotal;
    L.invoices[0].amount = L.orderTotal;
    L.credit.used =
      Math.round(
        L.invoices
          .filter(function (inv) {
            return inv.open;
          })
          .reduce(function (s, inv) {
            return s + inv.amount;
          }, 0) * 100
      ) / 100;
    L.credit.available = Math.round((L.credit.limit - L.credit.used) * 100) / 100;
    L.credit.pct = Math.round((L.credit.used / L.credit.limit) * 1000) / 10;
    L.messages.sam =
      "120 units of Perseus Pro V ship Friday. Invoice INV-1042 for " +
      money(L.orderTotal) +
      " is on Net 30.";
    L.figures.perseusUnit = L.perseusUnit;
    L.figures.perseusQty = qty;
    L.figures.perseusOrderTotal = L.perseusOrderTotal;
    L.figures.orderTotal = L.orderTotal;
    L.figures.cartTotal = L.cartTotal;
    L.figures.creditUsed = L.credit.used;
    L.figures.creditAvailable = L.credit.available;
    L.figures.invoiceAmounts = L.invoices.map(function (inv) {
      return inv.amount;
    });
    render();
  };

  document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      show(btn.getAttribute("data-tab"));
    });
  });

  render();
})();
  </script>
</body>
</html>
