<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOOLA B2B Quick Order (design)</title>
<style>
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 400;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 500;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 700;
  font-style: normal;
  src: url("fonts/FKGroteskNeue-700-normal.woff2") format("woff2");
}

:root {
  /* Colour */
  --ink: #1a1a1a;
  --muted: #5c5c66;
  --faint: #8a8a96;
  --line: #e6e8ef;
  --line-soft: rgba(112, 115, 147, 0.12);
  --band: #f4f5f7;
  --sidebar-bg: #fbfcfd;
  --wash: #eceef2;
  --blue: #2c3ee0;
  --blue-soft: rgba(44, 62, 224, 0.08);
  --page: #ffffff;
  --canvas: #ededec;
  --paid: #198754;
  --paid-bg: rgba(25, 135, 84, 0.12);
  --pending: #8a6100;
  --pending-bg: rgba(238, 186, 54, 0.18);
  --failed: #b0175f;
  --failed-bg: rgba(176, 23, 95, 0.10);
  --failed-border: rgba(208, 50, 117, 0.22);
  --best: #198754;
  /* Type (FK Grotesk Neue only — brand mark is the logo image) */
  --font-ui: "FKGroteskNeue", -apple-system, "Segoe UI", sans-serif;
  --text-title: 28px;
  --text-body: 14px;
  --text-ui: 13px;
  --text-meta: 12px;
  --text-micro: 11px;
  /* Radii */
  --radius-pill: 999px;
  --radius-control: 8px;
  --radius-panel: 12px;
  --radius-status: 4px;
  /* Spacing / sizes */
  --switcher-h: 48px;
  --sidebar-w: 220px;
  --topbar-h: 48px;
  --pill-h: 32px;
  --avatar: 24px;
  --icon-slot: 20px;
  --icon-size: 16px;
  --row-h: 50px;
  --head-h: 40px;
  --control-h: 40px;
  --col-thumb: 48px;
  --col-product: minmax(220px, 1.4fr);
  --col-price: 120px;
  --col-qty: 172px;
  --col-total: 120px;
  --col-x: 28px;
  --rail-w: 240px;
  --inv-invoice: 132px;
  --inv-order: 112px;
  --inv-issued: 124px;
  --inv-due: 124px;
  --inv-amount: 120px;
  --inv-status: 108px;
  --inv-action: 140px;
  --tnum: tabular-nums;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-ui);
  font-size: var(--text-body);
  font-weight: 400;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; font-family: var(--font-ui); }
button { cursor: pointer; border: 0; background: none; color: inherit; }
img { display: block; max-width: 100%; }
.tnum, [data-display-price], [data-unit-price], [data-line-total],
[data-order-total], [data-cart-total], [data-invoice-amount],
[data-credit-used], [data-credit-available], .qty, .amt, .price,
.cart-amount-display, .unit, .big, .total {
  font-variant-numeric: var(--tnum);
  font-feature-settings: "tnum" 1;
}

#devSwitcher {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--switcher-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 16px;
  background: #161613;
  color: #fff;
  overflow-x: auto;
}
#devSwitcher .label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-right: 8px;
  white-space: nowrap;
}
#devSwitcher .tab-btn {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
}
#devSwitcher .tab-btn.active {
  background: #fff;
  color: #161613;
}

#app {
  padding-top: var(--switcher-h);
  min-height: 100vh;
}

.screen { display: none; background: var(--page); min-height: calc(100vh - var(--switcher-h)); }
.screen.active { display: flex; flex-direction: column; min-height: calc(100vh - var(--switcher-h)); }
.screen.mobile-wrap {
  max-width: 390px;
  margin: 0 auto;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

/* App shell: sidebar + top bar */
.app-shell {
  display: flex;
  flex: 1 1 auto;
  min-height: calc(100vh - var(--switcher-h));
  background: var(--page);
}
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
}
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 16px;
}
.sidebar-brand img { width: 84px; height: auto; }
.wholesale-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 500;
  color: var(--blue);
}
.wholesale-pill .dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--blue);
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 32px;
  padding: 0 10px;
  border-radius: var(--radius-control);
  font-size: var(--text-ui);
  font-weight: 400;
  color: var(--muted);
  text-align: left;
  width: 100%;
  transition: background-color 0.16s ease-out, color 0.16s ease-out;
}
.nav-item .icon-slot,
.icon-slot {
  width: var(--icon-slot);
  height: var(--icon-slot);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nav-item .icon-slot svg,
.icon-slot svg {
  width: var(--icon-size);
  height: var(--icon-size);
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
  display: block;
}
.nav-item:hover { background: rgba(112, 115, 147, 0.06); color: var(--ink); }
.nav-item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}
.nav-item:active { background: rgba(112, 115, 147, 0.12); }
.nav-item:disabled, .nav-item.is-disabled {
  opacity: 0.4;
  pointer-events: none;
  cursor: not-allowed;
}
.nav-item.active {
  background: var(--blue-soft);
  color: var(--blue);
  font-weight: 500;
}
.sidebar-divider {
  height: 1px;
  background: var(--line);
  margin: 12px 8px;
}
.sidebar-section {
  font-size: 11px;
  font-weight: 500;
  color: var(--faint);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 4px 10px 8px;
}
.sidebar-meta,
.account-panel {
  margin-top: auto;
  padding: 12px 10px 4px;
  font-size: 12px;
  color: var(--faint);
  line-height: 1.4;
}
.account-panel .org {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
}
.account-panel .credit-line {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-top: 6px;
  line-height: 1.45;
}
.account-panel .credit-line span { color: var(--ink); font-weight: 500; }
.sidebar-meta .bal {
  font-size: 13px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.main-column {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--page);
}
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: #fff;
  overflow: visible;
}
.top-search {
  height: var(--pill-h);
  width: min(420px, 46%);
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px 0 10px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: var(--band);
  font-size: var(--text-ui);
  color: var(--faint);
}
.top-search .icon-slot svg {
  width: 14px;
  height: 14px;
  stroke: currentColor;
  fill: none;
  stroke-width: 1.5;
}
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  overflow: visible;
  padding-right: 4px; /* room for cart badge */
}
/* Matched pills: account chip + cart share height, radius, border */
.account-chip,
.cart-pill {
  box-sizing: border-box;
  height: var(--pill-h);
  min-height: var(--pill-h);
  max-height: var(--pill-h);
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: var(--text-ui);
  font-weight: 500;
  line-height: 1;
}
.account-chip {
  gap: 8px;
  padding: 0 12px 0 4px;
}
.account-chip:hover { background: var(--band); }
.account-chip:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.retailer-avatar {
  width: var(--avatar);
  height: var(--avatar);
  min-width: var(--avatar);
  min-height: var(--avatar);
  max-width: var(--avatar);
  max-height: var(--avatar);
  border-radius: 50%;
  overflow: hidden;
  background: var(--band);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 2px;
}
.retailer-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
}
.retailer-avatar.avatar-failed {
  background: var(--failed) !important;
  border-color: #8e2a20 !important;
}
.retailer-avatar.avatar-failed::after {
  content: "!";
  color: #fff;
  font-weight: 500;
  font-size: 12px;
  line-height: 1;
}
.account-meta {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  text-align: left;
  min-width: 0;
  padding: 0;
  /* Optical vertical center of the two-line stack inside 32px pill */
  margin-top: 0;
}
.account-meta .name {
  font-size: var(--text-ui);
  font-weight: 500;
  line-height: 14px;
  height: 14px;
  color: var(--ink);
}
.account-meta .role {
  font-size: var(--text-micro);
  font-weight: 400;
  line-height: 12px;
  height: 12px;
  color: var(--faint);
}

.cart-pill {
  position: relative;
  gap: 8px;
  padding: 0 12px;
  font-variant-numeric: tabular-nums;
  overflow: visible;
  transition: background-color 0.15s ease-out, border-color 0.15s ease-out, transform 0.15s ease-out;
}
.cart-pill:hover { background: var(--band); }
.cart-pill:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.cart-pill:active { transform: scale(0.98); }
.cart-pill:disabled { opacity: 0.45; cursor: not-allowed; }
.cart-pill .badge {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--failed);
  border: 2px solid #fff;
  box-sizing: border-box;
  font-size: 10px;
  font-weight: 500;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  pointer-events: none;
}
.cart-pill .badge.is-zero { background: var(--faint); }
.cart-pill.bump .cart-amount-display,
.cart-pill.bump .badge {
  animation: typeBump 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes typeBump {
  0% { transform: scale(1); }
  35% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.toast {
  position: fixed;
  bottom: 88px;
  right: 28px;
  z-index: 80;
  min-width: 240px;
  max-width: 360px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: 0 8px 24px rgba(26, 26, 26, 0.08);
  font-size: 13px;
  color: var(--ink);
  display: none;
}
.toast.show { display: block; animation: toastIn 0.28s ease-out; }
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast .toast-title { font-weight: 500; margin-bottom: 2px; }
.toast .toast-body { color: var(--muted); font-variant-numeric: tabular-nums; }
.inline-success {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--paid);
  font-weight: 500;
}
.inline-success.show { display: inline-flex; }
.inline-success::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--paid);
}

.page {
  padding: 28px 28px 100px;
  width: 100%;
  flex: 1 1 auto;
}
.page h1 {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--text-title);
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.02em;
}
.page .lede {
  margin: 8px 0 0;
  max-width: 560px;
  font-size: var(--text-body);
  color: var(--muted);
  line-height: 1.5;
  font-weight: 400;
}

.search-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 20px;
}
.search-wrap { position: relative; width: 400px; flex-shrink: 0; }
.search-field {
  height: 36px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--band);
  border: 1px solid var(--line);
  font-size: 14px;
  color: var(--faint);
}
.search-field .placeholder { color: var(--faint); }
.search-field .value { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.search-field.has-value .placeholder { display: none; }
.search-field:not(.has-value) .value { display: none; }
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  right: 0;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  z-index: 40;
  box-shadow: 0 12px 32px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.06);
}
.search-results[hidden],
.search-results.is-closed {
  display: none;
}
.search-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  height: 46px;
}
.search-result:hover { background: var(--blue-soft); }
.search-result img {
  width: 28px; height: 28px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 2px;
}
.search-result .title { font-size: 13px; font-weight: 500; }
.search-result .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

.section-title {
  margin: 24px 0 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.search-row + .qo-layout {
  margin-top: 28px;
}
.qo-main .section-title:first-child {
  margin-top: 0;
}

/* Order table */
.order-table {
  display: flex;
  flex-direction: column;
  width: 100%;
  border-top: 1px solid var(--line);
}
.order-head, .order-row {
  display: grid;
  grid-template-columns: var(--col-thumb) var(--col-product) var(--col-price) var(--col-qty) var(--col-total) var(--col-x);
  column-gap: 16px;
  align-items: center;
  padding: 0 12px;
}
.order-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding-top: 0;
  padding-bottom: 0;
}
.order-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.order-head .end,
.order-row .end,
.order-head .num,
.price-block,
.line-total {
  text-align: right;
}
.order-head .qty-h,
.order-row .qty-cell { text-align: right; }
.order-row {
  min-height: 50px;
  height: 50px;
  border-bottom: 1px solid var(--line-soft);
  transition: background-color 0.15s ease-out;
}
.order-row:hover { background: rgba(44, 62, 224, 0.03); }
.order-row.has-presets {
  height: auto;
  min-height: 50px;
  padding: 6px 12px;
  align-items: center;
}
.order-row img.thumb {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 3px;
}
.order-row > div:nth-child(2),
.cart-line > div:nth-child(2) {
  min-width: 0;
  overflow: hidden;
}
.prod-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prod-sku {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.price-block { display: flex; flex-direction: column; gap: 1px; align-items: flex-end; }
.price-block .strike { font-size: 12px; color: var(--faint); text-decoration: line-through; }
.price-block .unit { font-size: 14px; font-variant-numeric: tabular-nums; }
.price-block .hint { font-size: 11px; color: var(--muted); }
.price-block .hint b { color: var(--ink); font-weight: 500; }
.qty-presets button .best-tag {
  display: block;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.02em;
  color: var(--best);
  line-height: 1;
  margin-top: -2px;
}
.qty-group .qty-presets button.has-best {
  height: 32px;
  line-height: 1.05;
  padding-top: 3px;
}
.qty-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.qty-group {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  width: 148px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.qty-group .qty-stepper {
  display: flex;
  align-items: center;
  height: 40px;
  width: 100%;
  border: 0;
  border-radius: 0;
  background: #fff;
}
.qty-stepper {
  display: flex;
  align-items: center;
  height: 40px;
  width: 112px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
}
.qty-stepper button {
  width: 36px; height: 100%;
  font-size: 18px;
  color: var(--muted);
  transition: color 0.15s ease-out, background-color 0.15s ease-out;
}
.qty-stepper button:hover { color: var(--ink); background: var(--band); }
.qty-stepper button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
  z-index: 1;
}
.qty-stepper button:active { background: var(--wash); }
.qty-stepper button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: transparent;
}
.qty-stepper .qty {
  flex: 1;
  text-align: center;
  font-size: 17px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.qty-group .qty-presets {
  display: flex;
  gap: 0;
  justify-content: stretch;
  border-top: 1px solid var(--line);
  background: var(--band);
}
.qty-presets {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}
.qty-group .qty-presets button {
  flex: 1;
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 0;
  border-radius: 0;
  border: 0;
  border-right: 1px solid var(--line);
  height: 28px;
  font-variant-numeric: tabular-nums;
  background: transparent;
}
.qty-group .qty-presets button:last-child { border-right: 0; }
.qty-group .qty-presets button:hover { background: rgba(44, 62, 224, 0.06); color: var(--ink); }
.qty-group .qty-presets button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
.qty-group .qty-presets button:active { background: var(--blue-soft); }
.qty-group .qty-presets button.on {
  color: var(--blue);
  background: var(--blue-soft);
  font-weight: 500;
}
.qty-presets button {
  font-size: 11px;
  font-weight: 500;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  height: 20px;
  font-variant-numeric: tabular-nums;
}
.qty-presets button.on {
  color: var(--blue);
  border-color: transparent;
  background: var(--blue-soft);
}
.line-total {
  font-size: 19px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.order-footer {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 28px;
  background: #fff;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.order-footer .total {
  font-size: 30px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  line-height: 1;
  letter-spacing: -0.02em;
}
.order-footer .meta { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
.btn-primary {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  transition: opacity 0.15s ease-out, transform 0.12s ease-out;
}
.btn-primary:hover { opacity: 0.92; }
.btn-primary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.btn-primary:active { transform: scale(0.98); opacity: 0.88; }
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-outline {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  transition: background-color 0.15s ease-out, transform 0.12s ease-out;
}
.btn-outline:hover { background: var(--band); }
.btn-outline:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.btn-outline:active { transform: scale(0.98); background: var(--wash); }
.btn-outline:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-black { /* legacy alias → primary accent */
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 18px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
}

/* Recommended / catalog */
.rec-rail {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.rec-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 14px;
  background: #fff;
  overflow: hidden;
}
.rec-card .media,
.cat-card .media {
  height: 220px;
  background: var(--band);
  overflow: hidden;
}
.rec-card .media img,
.cat-card .media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.rec-card .chip {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin: 12px 14px 0;
  padding: 0 8px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  background: var(--band);
  border-radius: 4px;
  border: 1px solid var(--line);
}
.rec-card .why {
  margin: 6px 14px 0;
  font-size: 12px;
  color: var(--faint);
  line-height: 1.4;
}
.rec-card .title { margin: 8px 14px 0; font-size: 16px; font-weight: 500; }
.rec-card .price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 14px 0;
  font-variant-numeric: tabular-nums;
}
.rec-card .price { font-size: 16px; font-weight: 500; }
.rec-card .msrp { font-size: 13px; color: var(--faint); text-decoration: line-through; }
.rec-card .moq { margin: 4px 14px 0; font-size: 12px; color: var(--muted); }
.catalog-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
}
.catalog-toolbar .section-title { margin: 0; }
.view-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.view-toggle button {
  height: 32px;
  padding: 0 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  background: #fff;
  transition: background-color 0.15s ease-out, color 0.15s ease-out;
}
.view-toggle button:hover { background: var(--band); color: var(--ink); }
.view-toggle button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
.view-toggle button:active { background: var(--wash); }
.view-toggle button.on {
  background: var(--blue-soft);
  color: var(--blue);
}
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.catalog-grid.is-list {
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}
.catalog-grid.is-list .cat-card {
  display: grid;
  grid-template-columns: 56px 1fr 120px 80px;
  align-items: center;
  gap: 14px;
  border-radius: 0;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 4px;
  min-height: 56px;
}
.catalog-grid.is-list .cat-card .media {
  height: 48px;
  width: 48px;
  border-radius: 6px;
  border: 1px solid var(--line);
}
.catalog-grid.is-list .cat-card .title { margin: 0; font-size: 14px; }
.catalog-grid.is-list .cat-card .price { margin: 0; text-align: right; }
.catalog-grid.is-list .cat-card .moq { margin: 0; text-align: right; }
.cat-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 12px;
  background: #fff;
  overflow: hidden;
}
.cat-card .title { margin: 10px 12px 0; font-size: 13px; font-weight: 500; }
.cat-card .price { margin: 4px 12px 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left; }
.cat-card .moq { margin: 2px 12px 0; font-size: 12px; color: var(--muted); }

/* Invoices */
.credit-card {
  width: 380px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  margin-top: 20px;
  background: #fff;
}
.credit-card .row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  font-weight: 500;
}
.credit-card .row span:first-child { color: var(--muted); font-weight: 400; }
.credit-card .row span:last-child { font-variant-numeric: tabular-nums; }
.credit-bar {
  margin-top: 10px;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: var(--wash);
  overflow: hidden;
}
.credit-bar > i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: var(--blue);
}
.credit-card .note { margin-top: 10px; font-size: 12px; color: var(--muted); }
.invoice-table {
  margin-top: 24px;
  width: max-content;
  max-width: 100%;
  border-top: 1px solid var(--line);
}
.invoice-head, .invoice-row {
  display: grid;
  grid-template-columns: var(--inv-invoice) var(--inv-order) var(--inv-issued) var(--inv-due) var(--inv-amount) var(--inv-status) var(--inv-action);
  column-gap: 16px;
  align-items: center;
  padding: 0 8px;
  width: max-content;
}
.invoice-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.invoice-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.invoice-head > div.num,
.invoice-row .amt {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.invoice-row {
  height: 50px;
  min-height: 50px;
  border-bottom: 1px solid var(--line-soft);
}
.invoice-row .id { font-size: 14px; font-weight: 500; }
.invoice-row .cell { font-size: 13px; color: var(--muted); }
.invoice-row .amt {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  height: 20px;
  min-height: 20px;
  max-height: 20px;
  padding: 0 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 400;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
}
.status.Paid {
  background: var(--paid-bg);
  color: var(--paid);
  border-color: rgba(25, 135, 84, 0.22);
}
.status.Processing,
.status.Due,
.status.Pending,
.status.PendingFulfillment,
.status.PendingApproval {
  background: var(--pending-bg);
  color: var(--pending);
  border-color: rgba(138, 97, 0, 0.22);
}
.status.Billed {
  background: var(--paid-bg);
  color: var(--paid);
  border-color: rgba(25, 135, 84, 0.22);
}
.status.Overdue,
.status.Failed {
  background: var(--failed-bg);
  color: var(--failed);
  border-color: var(--failed-border);
}
.invoice-row .action { justify-self: stretch; }
.invoice-row .action button {
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  width: 100%;
  background: #fff;
}

/* Quick Order layout + rail */
.qo-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--rail-w);
  gap: 28px;
  align-items: start;
  margin-top: 8px;
}
.qo-main { min-width: 0; }
.qo-rail {
  width: var(--rail-w);
  position: sticky;
  top: calc(var(--switcher-h) + 12px);
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 420px;
}
.rail-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  padding: 14px;
  flex: 1 1 auto;
}
.rail-card h3 {
  margin: 0 0 10px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
}
.rail-item {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 0;
  border-top: 1px solid var(--line-soft);
}
.rail-item:first-of-type { border-top: 0; padding-top: 0; }
.rail-item .name { font-size: 13px; font-weight: 500; color: var(--ink); }
.rail-item .meta {
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.4;
}

/* Messages */
.messages-layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 260px;
  flex: 1 1 auto;
  min-height: 0;
}
.inbox {
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  background: var(--sidebar-bg);
}
.inbox h2 { margin: 0 0 10px; font-size: 13px; font-weight: 500; color: var(--faint); letter-spacing: 0.04em; text-transform: uppercase; }
.inbox-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 0 10px;
  height: 48px;
  border-radius: 8px;
  background: var(--blue-soft);
  border: 1px solid transparent;
}
.joola-mark {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;
  overflow: hidden;
  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  flex-shrink: 0;
}
.joola-mark img {
  width: 100%;
  height: auto;
  filter: brightness(0) invert(1);
}
.bubble.sam .who {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bubble.sam .joola-mark {
  width: 22px;
  height: 22px;
  min-width: 22px;
  padding: 4px;
}
.thread {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.thread-head {
  display: flex;
  align-items: center;
  gap: 12px;
  height: 48px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-weight: 500;
}
.thread-body {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fff;
}
.bubble {
  max-width: 70%;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 18px;
  line-height: 1.45;
  font-weight: 400;
}
.bubble .who { font-size: 12px; margin-bottom: 6px; }
.bubble .who b { font-weight: 500; }
.bubble .who span { color: var(--muted); font-weight: 400; }
.bubble.anna {
  align-self: flex-end;
  background: var(--ink);
  color: #fff;
}
.bubble.anna .who span { color: rgba(255,255,255,0.65); }
.bubble.sam {
  align-self: flex-start;
  background: var(--band);
  border: 1px solid var(--line);
}
.thread-compose {
  display: flex;
  gap: 10px;
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  background: #fff;
}
.thread-compose .field {
  flex: 1;
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--band);
  color: var(--faint);
  font-size: 14px;
}
.thread-compose .btn-send {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: opacity 0.15s ease-out, transform 0.12s ease-out;
}
.thread-compose .btn-send:hover { opacity: 0.92; }
.thread-compose .btn-send:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.thread-compose .btn-send:active { transform: scale(0.96); }
.thread-compose .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
.order-context {
  margin: 0 20px 4px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--band);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 16px;
}
.order-context .oc-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
}
.order-context .oc-value {
  font-size: 13px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  margin-top: 2px;
}
.msg-details {
  border-left: 1px solid var(--line);
  background: var(--sidebar-bg);
  padding: 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.msg-details h2 {
  margin: 0;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--faint);
}
.msg-details .detail-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.msg-details .detail-row .k {
  font-size: 11px;
  color: var(--faint);
  font-weight: 500;
  letter-spacing: 0.03em;
  text-transform: uppercase;
}
.msg-details .detail-row .v {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

/* Templates empty + skeleton */
.templates-empty {
  display: none;
  margin-top: 20px;
  max-width: 560px;
  padding: 28px 20px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.templates-skeleton {
  display: none;
  margin-top: 20px;
  max-width: 560px;
  flex-direction: column;
  gap: 8px;
}
.skel-card {
  height: 64px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--band) 0%, var(--wash) 50%, var(--band) 100%);
  background-size: 200% 100%;
  animation: skel 1.2s ease-in-out infinite;
}
@keyframes skel {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* States screen */
.state-sheet {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  max-width: 960px;
}
.state-block {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  background: #fff;
}
.state-block h3 {
  margin: 0 0 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
}
.state-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.state-row:last-child { margin-bottom: 0; }
.state-label {
  font-size: 11px;
  color: var(--faint);
  width: 72px;
  flex-shrink: 0;
}

/* Cart */
.cart-lines { margin-top: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cart-main .cart-checkout { margin-top: 20px; max-width: none; }
.cart-line {
  display: grid;
  grid-template-columns: 40px 1fr auto;
  gap: 14px;
  align-items: center;
  height: 50px;
  min-height: 50px;
  padding: 0 4px;
  border-bottom: 1px solid var(--line-soft);
}
.cart-line img {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 3px;
}
.cart-line .line-total { text-align: right; }
.cart-checkout {
  margin-top: 20px;
  max-width: 720px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.cart-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 6px;
}
.cart-field .control,
.cart-field select,
.cart-field input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 0 12px;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  font-family: inherit;
}
.cart-field .control {
  display: flex;
  align-items: center;
  color: var(--ink);
}
.cart-field.span-2 { grid-column: 1 / -1; }
.cart-field .addr {
  margin-top: 6px;
  font-size: var(--text-meta);
  color: var(--muted);
  line-height: 1.4;
}
.need-by {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
}
.need-by-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-ui);
  color: var(--ink);
  font-weight: 500;
}
.need-by-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--blue);
  margin: 0;
  flex-shrink: 0;
}
.need-by .hint {
  font-size: var(--text-meta);
  color: var(--muted);
  font-weight: 400;
  line-height: 1.4;
  padding-left: 26px;
}
.need-by .date-control {
  margin-left: 26px;
  max-width: 220px;
  height: var(--control-h);
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: #fff;
  padding: 0 12px;
  display: flex;
  align-items: center;
  font-size: var(--text-ui);
  color: var(--ink);
}
.cart-returns {
  grid-column: 1 / -1;
  margin-top: 2px;
  font-size: 13px;
  color: var(--muted);
}
.cart-returns a {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-weight: 500;
}
.cart-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 32px;
  align-items: start;
  margin-top: 20px;
}
.cart-main { min-width: 0; }
.cart-summary {
  position: sticky;
  top: calc(var(--switcher-h) + 16px);
  margin-top: 0;
  max-width: none;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  background: #fff;
}
.cart-summary .sum-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.cart-summary .sum-row:first-child { margin-top: 0; }
.cart-summary .sum-row span:last-child { color: var(--ink); font-weight: 500; }
.cart-summary .sum-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}
.cart-summary .sum-total .big {
  font-size: 28px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.cart-summary .credit-note {
  margin-top: 12px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.4;
}
.cart-summary .btn-primary {
  width: 100%;
  justify-content: center;
  margin-top: 16px;
}
.ready-chip {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  margin-left: 8px;
  border-radius: var(--radius-status);
  font-size: var(--text-micro);
  font-weight: 500;
  color: var(--muted);
  background: var(--band);
  border: 1px solid var(--line);
  vertical-align: middle;
}
.btn-text {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 4px;
  background: transparent;
  border: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 0.15s ease-out;
}
.btn-text:hover { color: var(--ink); }
.btn-text:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 4px;
}
.rail-link {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
}
.rail-link:hover { color: var(--ink); }

.templates-list { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.template-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  height: 64px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.template-card h3 { margin: 0; font-size: 14px; font-weight: 500; }
.template-card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.mobile-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  height: 48px;
}
.screen.mobile-wrap .page h1 { font-size: 28px; }
.screen.mobile-wrap .lede { font-size: 15px; }
.screen.mobile-wrap .prod-name { font-size: 15px; }
.screen.mobile-wrap .prod-sku { font-size: 13px; }
.screen.mobile-wrap .order-footer .btn-outline,
.screen.mobile-wrap .order-footer .btn-primary { font-size: 15px; height: 44px; }

.line-total.bump,
[data-order-total].bump {
  animation: typeBump 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}
</style>
</head>
<body>
  <div id="devSwitcher">
    <span class="label">Screens</span>
    <button type="button" class="tab-btn active" data-tab="qo-desktop">Quick Order</button>
    <button type="button" class="tab-btn" data-tab="catalog">Catalog</button>
    <button type="button" class="tab-btn" data-tab="templates">Templates</button>
    <button type="button" class="tab-btn" data-tab="cart">Cart</button>
    <button type="button" class="tab-btn" data-tab="invoices">Invoices &amp; Terms</button>
    <button type="button" class="tab-btn" data-tab="messages">Messages</button>
    <button type="button" class="tab-btn" data-tab="qo-mobile">Quick Order Mobile</button>
    <button type="button" class="tab-btn" data-tab="states">States</button>
  </div>

  <div id="app"></div>
  <div class="toast" data-toast hidden aria-live="polite">
    <div class="toast-title">Added to cart</div>
    <div class="toast-body" data-toast-body></div>
  </div>

  <script src="ledger.js"></script>
  <script>
(function () {
  var L = window.JOOLA_LEDGER;
  if (!L) throw new Error("JOOLA_LEDGER missing");

  var money = L.money;
  var cartUi = {
    count: L.cartCount,
    total: 0,
    added: false,
  };
  var catalogView = "cards";
  var NAV = [
    { id: "qo-desktop", label: "Quick order", icon: "order" },
    { id: "catalog", label: "Catalog", icon: "catalog" },
    { id: "templates", label: "Templates", icon: "templates" },
    { id: "invoices", label: "Invoices", icon: "invoices" },
    { id: "messages", label: "Messages", icon: "messages" },
  ];

  function icon(name) {
    var paths = {
      order: '<path d="M4 6h12M4 10h12M4 14h8"/>',
      catalog: '<rect x="3" y="3" width="6" height="6" rx="1"/><rect x="11" y="3" width="6" height="6" rx="1"/><rect x="3" y="11" width="6" height="6" rx="1"/><rect x="11" y="11" width="6" height="6" rx="1"/>',
      templates: '<path d="M5 3h8l2 2v12H5z"/><path d="M13 3v3h3"/>',
      invoices: '<path d="M5 3h10v14H5z"/><path d="M8 7h4M8 10h4M8 13h2"/>',
      messages: '<path d="M3 5h14v10H7l-4 3V5z"/>',
      search: '<circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/>',
    };
    return (
      '<span class="icon-slot" aria-hidden="true">' +
      '<svg viewBox="0 0 20 20">' +
      (paths[name] || "") +
      "</svg></span>"
    );
  }

  function avatarHtml() {
    var size = 24;
    return (
      '<div class="retailer-avatar" data-retailer-avatar style="width:' + size + "px;height:" + size + "px;min-width:" + size + "px;min-height:" + size + "px;max-width:" + size + "px;max-height:" + size + 'px;">' +
      '<img src="' + L.retailer.avatar + '" alt="' + L.retailer.name + '" width="' + size + '" height="' + size + '" onerror="this.closest(\'[data-retailer-avatar]\').classList.add(\'avatar-failed\'); this.remove();">' +
      "</div>"
    );
  }

  function joolaMarkHtml(cls) {
    return (
      '<div class="joola-mark' + (cls ? " " + cls : "") + '" data-joola-mark>' +
      '<img src="joola-logo.png" alt="JOOLA" width="36" height="12">' +
      "</div>"
    );
  }

  function shellOpen(activeTab, cartOverride) {
    var count = cartOverride ? cartOverride.count : cartUi.count;
    var total = cartOverride ? cartOverride.total : cartUi.total;
    var items = NAV.map(function (n) {
      return (
        '<button type="button" class="nav-item' + (n.id === activeTab ? " active" : "") + '" data-tab="' + n.id + '">' +
        icon(n.icon) +
        "<span>" + n.label + "</span>" +
        "</button>"
      );
    }).join("");
    return (
      '<div class="app-shell" data-wholesale-chrome>' +
      '<aside class="sidebar" data-sidebar>' +
      '<div class="sidebar-brand">' +
      '<img src="joola-logo.png" alt="JOOLA" width="84" height="28">' +
      "</div>" +
      '<div class="wholesale-pill" style="padding:0 10px 12px;"><span class="dot"></span>Wholesale</div>' +
      '<nav class="sidebar-nav">' + items + "</nav>" +
      '<div class="sidebar-divider"></div>' +
      '<div class="account-panel" data-account-panel>' +
      '<div class="org">' + L.retailer.name + "</div>" +
      '<div class="credit-line">' + L.terms + ' · used <span data-credit-used>' + money(L.credit.used) + "</span></div>" +
      '<div class="credit-line">Available <span data-credit-available>' + money(L.credit.available) + "</span></div>" +
      "</div>" +
      "</aside>" +
      '<div class="main-column">' +
      '<header class="topbar" data-topbar>' +
      '<div class="top-search">' +
      icon("search") +
      "<span>Search SKUs, orders, invoices</span></div>" +
      '<div class="topbar-right">' +
      '<button type="button" class="account-chip" data-account-chip>' +
      avatarHtml() +
      '<div class="account-meta"><div class="name">' + L.retailer.name + '</div><div class="role">' + L.retailer.buyer + " · " + L.retailer.role + "</div></div>" +
      "</button>" +
      '<button type="button" class="cart-pill" data-tab="cart" data-cart-pill aria-label="Cart, ' + money(total) + '">' +
      "<span>Cart</span>" +
      '<span class="cart-amount-display" data-cart-total>' + money(total) + "</span>" +
      '<span class="badge cart-badge-display' + (count === 0 ? " is-zero" : "") + '" data-cart-count>' + count + "</span>" +
      "</button>" +
      "</div></header>"
    );
  }

  /** Cart / invoices / messages show the open order in chrome; QO starts empty until Add all. */
  function filledCart() {
    return { count: L.cartCountAfterAdd, total: L.orderTotal };
  }

  function shellClose() {
    return "</div></div>";
  }

  function unitPriceHtml(product, qty) {
    var unit = L.priceAt(product, qty);
    var next = L.nextTier(product, qty);
    /** Buyer sees wholesale unit + next-break hint only — no MSRP strikethrough noise. */
    var hint = next
      ? '<div class="hint">Buy ' + next.min + '+ for <b>' + money(next.price) + " ea</b></div>"
      : "";
    return (
      '<div class="price-block">' +
      '<div class="unit" data-unit-price="' + unit + '" data-display-price>' + money(unit) + " ea</div>" +
      hint +
      "</div>"
    );
  }

  function qtyGroupHtml(line) {
    var presets = "";
    if (line.productId === "perseus") {
      var p = L.products.perseus;
      var bestMin = p.tiers[p.tiers.length - 1].min;
      presets =
        '<div class="qty-presets">' +
        [12, 24, 60, 120]
          .map(function (n) {
            return (
              '<button type="button" class="' +
              (n === line.qty ? "on" : "") +
              '" data-set-perseus="' +
              n +
              '" title="' +
              (n === bestMin ? "Best unit price from " + n + "+" : "") +
              '">' +
              n +
              "</button>"
            );
          })
          .join("") +
        "</div>";
    }
    return (
      '<div class="qty-group" data-qty-group data-product="' +
      line.productId +
      '">' +
      '<div class="qty-stepper">' +
      '<button type="button" data-action="dec" aria-label="Decrease">-</button>' +
      '<div class="qty" data-qty="' +
      line.qty +
      '">' +
      line.qty +
      "</div>" +
      '<button type="button" data-action="inc" aria-label="Increase">+</button>' +
      "</div>" +
      presets +
      "</div>"
    );
  }

  function orderTableHtml() {
    var rows = "";
    L.orderLines.forEach(function (line) {
      var p = L.products[line.productId];
      var amount = L.lineAmount(line);
      var fulfill = L.lineFulfillment[line.productId] || { warehouse: "CA", availability: "In stock" };
      var rowClass = "order-row" + (line.productId === "perseus" ? " has-presets" : "");
      rows +=
        '<div class="' +
        rowClass +
        '" data-order-row data-sku="' +
        p.sku +
        '" data-buyer-price="' +
        p.buyerPrice +
        '" data-product="' +
        p.id +
        '">' +
        '<img class="thumb" src="' +
        p.image +
        '" alt="' +
        p.name +
        '" width="36" height="36" data-product-media>' +
        '<div><div class="prod-name">' +
        p.fullName +
        '</div><div class="prod-sku">SKU ' +
        p.sku +
        " · " +
        fulfill.availability +
        "</div></div>" +
        unitPriceHtml(p, line.qty) +
        '<div class="qty-cell">' +
        qtyGroupHtml(line) +
        "</div>" +
        '<div class="line-total end" data-line-total="' +
        amount +
        '">' +
        money(amount) +
        "</div>" +
        '<div aria-hidden="true"></div>' +
        "</div>";
    });

    return (
      '<div class="section-title">Lines</div>' +
      '<div class="order-table" data-order-table>' +
      '<div class="order-head" data-order-head>' +
      "<div></div><div>Product</div><div class=\"end\">Price</div><div class=\"qty-h end\">Quantity</div><div class=\"end\">Line total</div><div></div>" +
      "</div>" +
      rows +
      "</div>"
    );
  }

  function qoRailHtml() {
    var tpl = L.templates
      .map(function (t) {
        return (
          '<div class="rail-item"><div class="name">' +
          t.name +
          '</div><div class="meta">' +
          t.detail +
          "</div></div>"
        );
      })
      .join("");
    var recent = L.recentOrders
      .map(function (o) {
        return (
          '<div class="rail-item"><div class="name">' +
          o.id +
          " · " +
          o.label +
          '</div><div class="meta">' +
          o.when +
          " · " +
          o.lines +
          " lines · " +
          money(o.total) +
          "</div></div>"
        );
      })
      .join("");
    return (
      '<aside class="qo-rail" data-qo-rail>' +
      '<div class="rail-card"><h3>Templates</h3>' +
      tpl +
      "</div>" +
      '<div class="rail-card"><h3>Reorder</h3>' +
      recent +
      "</div>" +
      "</aside>"
    );
  }

  function footerHtml() {
    var ready = !cartUi.added;
    return (
      '<div class="order-footer" data-order-footer>' +
      "<div><div class=\"meta\" data-line-count>" +
      (ready ? "Ready · " : "In cart · ") +
      L.orderLines.length +
      (L.orderLines.length === 1 ? " line" : " lines") +
      (ready ? '<span class="ready-chip">Not in cart yet</span>' : "") +
      '</div><div class="total" id="qoFooterTotal" data-order-total>' +
      money(L.orderTotal) +
      '</div><div class="inline-success' +
      (cartUi.added ? " show" : "") +
      '" data-inline-success>' +
      (cartUi.added ? "Added to cart" : "") +
      "</div></div>" +
      '<div style="display:flex;gap:14px;align-items:center;">' +
      '<button type="button" class="btn-text">Save as template</button>' +
      '<button type="button" class="btn-primary" id="qoAddAllBtn" data-add-all' +
      (cartUi.added ? " disabled" : "") +
      ">" +
      (cartUi.added ? "Added" : "Add all to cart") +
      "</button>" +
      "</div></div>"
    );
  }

  function searchHtml() {
    var p = L.products.perseus;
    var typed = "600558";
    var alreadyInOrder = L.orderLines.some(function (line) {
      return line.productId === "perseus";
    });
    /** Dropdown closed once the SKU is already a line — avoids covering the table head. */
    return (
      '<div class="search-row">' +
      '<div class="search-wrap">' +
      '<div class="search-field has-value" data-search-field data-search-value="' + typed + '">' +
      '<span class="placeholder">Search by name or SKU</span>' +
      '<span class="value">' + typed + "</span>" +
      "</div>" +
      (alreadyInOrder
        ? '<div class="search-results is-closed" data-search-results hidden></div>'
        : '<div class="search-results" data-search-results>' +
          '<div class="search-result" data-search-result data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
          '<img src="' + p.image + '" alt="' + p.name + '" width="28" height="28">' +
          "<div><div class=\"title\">" + p.name + '</div><div class="meta">SKU ' + p.sku + " · " + money(p.buyerPrice) + "</div></div>" +
          "</div></div>") +
      "</div></div>"
    );
  }

  function screenQuickOrder() {
    return (
      '<section class="screen active" data-screen="qo-desktop">' +
      shellOpen("qo-desktop") +
      '<div class="page">' +
      "<h1>Quick order</h1>" +
      '<p class="lede">Add SKUs and quantities. Prices are for ' +
      L.retailer.name +
      ".</p>" +
      searchHtml() +
      '<div class="qo-layout">' +
      '<div class="qo-main">' +
      orderTableHtml() +
      "</div>" +
      qoRailHtml() +
      "</div>" +
      "</div>" +
      footerHtml() +
      shellClose() +
      "</section>"
    );
  }

  function screenCatalog() {
    var rec = L.recommended
      .map(function (id) {
        var p = L.products[id];
        var meta = L.recommendedMeta[id] || { reason: "Recommended", detail: "" };
        return (
          '<div class="rec-card" data-rec-card data-sku="' +
          p.sku +
          '" data-buyer-price="' +
          p.buyerPrice +
          '">' +
          '<div class="media" data-product-media><img src="' +
          p.image +
          '" alt="' +
          p.name +
          '"></div>' +
          '<div class="chip">' +
          meta.reason +
          "</div>" +
          (meta.detail ? '<div class="why">' + meta.detail + "</div>" : "") +
          '<div class="title">' +
          p.name +
          "</div>" +
          '<div class="price-row"><span class="price" data-display-price>' +
          money(p.buyerPrice) +
          '</span><span class="msrp">' +
          money(p.msrp) +
          "</span></div>" +
          '<div class="moq">MOQ ' +
          p.moq +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    var allIds = L.recommended.concat(L.catalogExtra);
    var grid = allIds
      .map(function (id) {
        var p = L.products[id];
        return (
          '<div class="cat-card" data-catalog-card data-sku="' +
          p.sku +
          '" data-buyer-price="' +
          p.buyerPrice +
          '">' +
          '<div class="media" data-product-media><img src="' +
          p.image +
          '" alt="' +
          p.name +
          '"></div>' +
          '<div class="title">' +
          p.fullName +
          "</div>" +
          '<div class="price" data-display-price>' +
          money(p.buyerPrice) +
          "</div>" +
          '<div class="moq">MOQ ' +
          p.moq +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="catalog">' +
      shellOpen("catalog") +
      '<div class="page">' +
      "<h1>Catalog</h1>" +
      '<p class="lede">Products available to ' +
      L.retailer.name +
      ".</p>" +
      '<div class="section-title">Recommended</div>' +
      '<div class="rec-rail">' +
      rec +
      "</div>" +
      '<div class="catalog-toolbar">' +
      '<div class="section-title">All products</div>' +
      '<div class="view-toggle" data-view-toggle>' +
      '<button type="button" data-view="cards" class="' +
      (catalogView === "cards" ? "on" : "") +
      '">Cards</button>' +
      '<button type="button" data-view="list" class="' +
      (catalogView === "list" ? "on" : "") +
      '">List</button>' +
      "</div></div>" +
      '<div class="catalog-grid' +
      (catalogView === "list" ? " is-list" : "") +
      '" data-catalog-grid>' +
      grid +
      "</div>" +
      "</div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenTemplates() {
    var cards = L.templates
      .map(function (t) {
        return (
          '<div class="template-card"><h3>' +
          t.name +
          "</h3><p>" +
          t.detail +
          "</p></div>"
        );
      })
      .join("");
    return (
      '<section class="screen" data-screen="templates">' +
      shellOpen("templates") +
      '<div class="page">' +
      "<h1>Templates</h1>" +
      '<p class="lede">Saved orders for ' +
      L.retailer.name +
      ".</p>" +
      '<div class="templates-list" data-templates-list>' +
      cards +
      "</div>" +
      '<div class="templates-empty" data-templates-empty hidden>No saved templates yet. Save a Quick order to create one.</div>' +
      '<div class="templates-skeleton" data-templates-skeleton hidden aria-hidden="true">' +
      '<div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div>' +
      "</div>" +
      "</div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenCart() {
    var lines = L.orderLines
      .map(function (line) {
        var p = L.products[line.productId];
        var amount = L.lineAmount(line);
        var fulfill = L.lineFulfillment[line.productId] || { warehouse: "CA", availability: "In stock" };
        return (
          '<div class="cart-line" data-cart-line data-sku="' + p.sku + '" data-buyer-price="' + p.buyerPrice + '">' +
          '<img src="' + p.image + '" alt="' + p.name + '" width="36" height="36">' +
          "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + " · " + line.qty + " × " + money(L.priceAt(p, line.qty)) + " · " + fulfill.availability + "</div></div>" +
          '<div class="line-total" data-line-total="' + amount + '">' + money(amount) + "</div>" +
          "</div>"
        );
      })
      .join("");
    var selectedShip =
      L.shipTos.find(function (a) {
        return a.id === L.shipToId;
      }) || L.shipTos[0];
    var shipOptions = L.shipTos
      .map(function (a) {
        return (
          '<option value="' +
          a.id +
          '"' +
          (a.id === L.shipToId ? " selected" : "") +
          ">" +
          a.label +
          "</option>"
        );
      })
      .join("");
    return (
      '<section class="screen" data-screen="cart">' +
      shellOpen("cart", filledCart()) +
      '<div class="page">' +
      "<h1>Cart</h1>" +
      '<p class="lede">Review lines, then place the order.</p>' +
      '<div class="cart-layout" data-cart-layout>' +
      '<div class="cart-main">' +
      '<div class="cart-lines">' + lines + "</div>" +
      '<div class="cart-checkout" data-cart-checkout>' +
      '<div class="cart-field" data-field="po">' +
      '<label for="cart-po">Your PO # <span style="font-weight:400;color:var(--faint)">(optional)</span></label>' +
      '<input id="cart-po" type="text" placeholder="e.g. ENG-9812" value="' +
      (L.customerPo || "") +
      '" autocomplete="off">' +
      "</div>" +
      '<div class="cart-field span-2" data-field="ship-to">' +
      '<label for="cart-ship-to">Ship to</label>' +
      '<select id="cart-ship-to">' +
      shipOptions +
      "</select>" +
      '<div class="addr" data-ship-address>' +
      selectedShip.detail +
      "</div>" +
      "</div>" +
      '<div class="need-by" data-field="need-by" data-need-by>' +
      '<label class="need-by-row">' +
      '<input type="checkbox" id="need-by-check">' +
      "<span>Need it by a certain date</span>" +
      "</label>" +
      '<div class="date-control" id="need-by-date">' +
      L.shipDate +
      "</div>" +
      '<div class="hint">Optional rush request. Your JOOLA rep will confirm timing. This does not schedule a ship date.</div>' +
      "</div>" +
      '<div class="cart-returns" data-returns-link>Need a replacement or warranty? <a href="#returns">Request a return</a></div>' +
      "</div></div>" +
      '<aside class="cart-summary" data-cart-summary>' +
      '<div class="sum-row"><span>Subtotal</span><span data-order-total data-cart-total>' +
      money(L.cartTotal) +
      "</span></div>" +
      '<div class="sum-row"><span>Shipping</span><span>Confirmed on invoice</span></div>' +
      '<div class="sum-row"><span>Tax</span><span>Calculated at invoice</span></div>' +
      '<div class="sum-total"><span>Total</span><span class="big" data-order-total>' +
      money(L.cartTotal) +
      "</span></div>" +
      '<div class="credit-note" data-credit-after>' +
      "After placing · " +
      money(L.credit.afterOrder) +
      " left on " +
      L.terms +
      " (" +
      money(L.credit.limit) +
      " limit)</div>" +
      '<button type="button" class="btn-primary">Place order</button>' +
      "</aside></div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function statusLabel(status) {
    if (status === "Processing" || status === "Due") return "Pending";
    return status;
  }

  function statusClass(status) {
    if (status === "Processing" || status === "Due") return "Pending";
    return status;
  }

  function screenInvoices() {
    var rows = L.invoices
      .map(function (inv) {
        return (
          '<div class="invoice-row" data-invoice-row data-invoice-id="' + inv.id + '">' +
          '<div class="id">' + inv.id + "</div>" +
          '<div class="cell">' + inv.order + "</div>" +
          '<div class="cell" data-col="issued">' + inv.issued + "</div>" +
          '<div class="cell" data-col="due">' + inv.due + "</div>" +
          '<div class="amt" data-col="amount" data-invoice-amount="' + inv.amount + '">' + money(inv.amount) + "</div>" +
          '<div data-col="status"><span class="status ' + statusClass(inv.status) + '">' + statusLabel(inv.status) + "</span></div>" +
          '<div class="action"><button type="button">Download PDF</button></div>' +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="invoices">' +
      shellOpen("invoices", filledCart()) +
      '<div class="page">' +
      "<h1>Invoices</h1>" +
      '<p class="lede">Open balances and credit on ' + L.terms + ".</p>" +
      '<div class="credit-card" data-credit-card>' +
      '<div class="row"><span>' + L.terms + ' used</span><span data-credit-used>' + money(L.credit.used) + " of " + money(L.credit.limit) + "</span></div>" +
      '<div class="credit-bar" data-credit-bar><i style="width:' + L.credit.pct + '%" data-credit-fill></i></div>' +
      '<div class="note" data-credit-available>' + money(L.credit.available) + " available</div>" +
      "</div>" +
      '<div class="invoice-table" data-invoice-table>' +
      '<div class="invoice-head" data-invoice-head>' +
      '<div>Invoice</div><div>Order</div><div>Issued</div><div>Due</div><div class="num">Amount</div><div>Status</div><div></div>' +
      "</div>" +
      rows +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenMessages() {
    var inv = L.invoices[0];
    return (
      '<section class="screen" data-screen="messages">' +
      shellOpen("messages", filledCart()) +
      '<div class="messages-layout">' +
      '<aside class="inbox"><h2>Inbox</h2>' +
      '<div class="inbox-item" data-inbox-joola>' +
      joolaMarkHtml() +
      '<div><div style="font-size:13px;font-weight:500;">JOOLA Sales</div><div style="font-size:12px;color:var(--muted);margin-top:2px;">Perseus Pro V restock</div></div>' +
      "</div></aside>" +
      '<div class="thread">' +
      '<div class="thread-head">Sam Ortiz · JOOLA Sales</div>' +
      '<div class="order-context" data-order-context>' +
      '<div><div class="oc-label">Order</div><div class="oc-value">' +
      L.orderId +
      '</div></div>' +
      '<div><div class="oc-label">Amount</div><div class="oc-value" data-order-total>' +
      money(L.orderTotal) +
      "</div></div>" +
      "</div>" +
      '<div class="thread-body">' +
      '<div class="bubble anna" data-msg-anna><div class="who"><b>' +
      L.retailer.buyer +
      "</b> <span>· " +
      L.retailer.name +
      "</span></div>" +
      L.messages.anna +
      "</div>" +
      '<div class="bubble sam" data-msg-sam><div class="who">' +
      joolaMarkHtml("sm") +
      "<span><b>Sam Ortiz</b> <span>· JOOLA Sales</span></span></div>" +
      L.messages.sam +
      "</div>" +
      "</div>" +
      '<div class="thread-compose"><div class="field">Message the sales team</div><button type="button" class="btn-send" aria-label="Send">↑</button></div>' +
      "</div>" +
      '<aside class="msg-details" data-msg-details>' +
      "<h2>Order details</h2>" +
      '<div class="detail-row"><div class="k">Status</div><div class="v"><span class="status PendingFulfillment">' +
      L.orderStatus +
      "</span></div></div>" +
      '<div class="detail-row"><div class="k">Ship date</div><div class="v">' +
      L.shipDate +
      "</div></div>" +
      '<div class="detail-row"><div class="k">Invoice</div><div class="v">' +
      inv.id +
      "</div></div>" +
      '<div class="detail-row"><div class="k">Amount</div><div class="v" data-order-total>' +
      money(L.orderTotal) +
      "</div></div>" +
      '<div class="detail-row"><div class="k">Terms</div><div class="v">' +
      L.terms +
      "</div></div>" +
      "</aside>" +
      "</div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenStates() {
    return (
      '<section class="screen" data-screen="states">' +
      shellOpen("qo-desktop") +
      '<div class="page">' +
      "<h1>Interaction states</h1>" +
      '<p class="lede">Reference sheet for buttons, nav, stepper, cart, toast, empty, and loading.</p>' +
      '<div class="state-sheet" data-state-sheet>' +
      '<div class="state-block"><h3>Primary button</h3>' +
      '<div class="state-row"><span class="state-label">Default</span><button type="button" class="btn-primary">Add all to cart</button></div>' +
      '<div class="state-row"><span class="state-label">Hover</span><button type="button" class="btn-primary" style="opacity:0.92">Add all to cart</button></div>' +
      '<div class="state-row"><span class="state-label">Disabled</span><button type="button" class="btn-primary" disabled>Added</button></div>' +
      "</div>" +
      '<div class="state-block"><h3>Outline + nav</h3>' +
      '<div class="state-row"><span class="state-label">Secondary</span><button type="button" class="btn-text">Save as template</button></div>' +
      '<div class="state-row"><span class="state-label">Nav</span><button type="button" class="nav-item active" style="width:auto">' +
      icon("order") +
      "<span>Quick order</span></button>" +
      '<button type="button" class="nav-item" style="width:auto">' +
      icon("catalog") +
      "<span>Catalog</span></button></div>" +
      '<div class="state-row"><span class="state-label">Disabled</span><button type="button" class="nav-item is-disabled" style="width:auto" disabled>' +
      icon("templates") +
      "<span>Templates</span></button></div>" +
      "</div>" +
      '<div class="state-block"><h3>Qty group</h3>' +
      '<div class="state-row">' +
      qtyGroupHtml({ productId: "perseus", qty: L.perseusQty }) +
      "</div>" +
      '<div class="state-row"><span class="state-label">Disabled</span>' +
      '<div class="qty-group" data-qty-group><div class="qty-stepper">' +
      '<button type="button" disabled>-</button><div class="qty">12</div><button type="button" disabled>+</button>' +
      '</div><div class="qty-presets"><button type="button" disabled>12</button><button type="button" disabled>24</button><button type="button" disabled>60</button><button type="button" disabled>120</button></div></div>' +
      "</div></div>" +
      '<div class="state-block"><h3>Cart + status</h3>' +
      '<div class="state-row"><span class="state-label">Empty</span><button type="button" class="cart-pill"><span>Cart</span><span class="cart-amount-display" data-cart-total>$0.00</span><span class="badge is-zero" data-cart-count>0</span></button></div>' +
      '<div class="state-row"><span class="state-label">Filled</span><button type="button" class="cart-pill"><span>Cart</span><span class="cart-amount-display">' +
      money(L.orderTotal) +
      '</span><span class="badge">' +
      L.cartCountAfterAdd +
      "</span></button></div>" +
      '<div class="state-row"><span class="state-label">Pills</span><span class="status Paid">Paid</span><span class="status Pending">Pending</span><span class="status Overdue">Overdue</span></div>' +
      "</div>" +
      '<div class="state-block"><h3>Toast</h3>' +
      '<div class="toast show" style="position:relative;bottom:auto;right:auto;" data-toast-demo><div class="toast-title">Added to cart</div><div class="toast-body">' +
      L.orderLines.length +
      " lines · " +
      money(L.orderTotal) +
      "</div></div></div>" +
      '<div class="state-block"><h3>Templates empty / loading</h3>' +
      '<div class="templates-empty" style="display:block;margin-top:0;">No saved templates yet.</div>' +
      '<div class="templates-skeleton" style="display:flex;margin-top:12px;"><div class="skel-card"></div><div class="skel-card"></div></div>' +
      "</div>" +
      "</div></div>" +
      shellClose() +
      "</section>"
    );
  }

  function screenMobile() {
    var p = L.products.perseus;
    return (
      '<section class="screen mobile-wrap" data-screen="qo-mobile">' +
      '<div class="mobile-nav"><span style="color:var(--blue);">Wholesale</span><span style="color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:2px;">Quick order</span>' +
      '<span style="display:flex;align-items:center;gap:6px;">' + avatarHtml() + '<span style="font-size:11px;">' + L.retailer.name + "</span></span></div>" +
      '<div class="page" style="padding:20px 16px 100px;">' +
      "<h1 style=\"font-size:28px;\">Quick order</h1>" +
      '<p class="lede">Prices for ' + L.retailer.name + ".</p>" +
      '<div style="margin-top:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line-soft);height:50px;">' +
      '<img src="' + p.image + '" alt="" width="36" height="36" style="object-fit:contain;border:1px solid var(--line);border-radius:6px;background:var(--band);padding:3px;">' +
      "<div><div class=\"prod-name\">" + p.fullName + '</div><div class="prod-sku">SKU ' + p.sku + "</div>" +
      '<div style="margin-top:2px;font-weight:500;font-size:15px;font-variant-numeric:tabular-nums;">' + money(L.perseusUnit) + " ea · qty " + L.perseusQty + "</div></div></div>" +
      '<div style="margin-top:20px;font-size:30px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;" data-order-total>' + money(L.orderTotal) + "</div>" +
      "</div>" +
      '<div class="order-footer" data-order-footer><button type="button" class="btn-primary" style="flex:1;justify-content:center;">Add all to cart</button></div>' +
      "</section>"
    );
  }

  function render() {
    document.getElementById("app").innerHTML =
      screenQuickOrder() +
      screenCatalog() +
      screenTemplates() +
      screenCart() +
      screenInvoices() +
      screenMessages() +
      screenMobile() +
      screenStates();
    bind();
    show(current);
    syncToastHidden();
  }

  var current = "qo-desktop";

  function show(id) {
    current = id;
    document.querySelectorAll(".screen").forEach(function (el) {
      el.classList.toggle("active", el.getAttribute("data-screen") === id);
    });
    document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
      btn.classList.toggle("active", btn.getAttribute("data-tab") === id);
    });
  }

  function syncToastHidden() {
    var toast = document.querySelector("[data-toast]");
    if (!toast) return;
    if (!toast.classList.contains("show")) toast.setAttribute("hidden", "");
  }

  function showToast(body) {
    var toast = document.querySelector("[data-toast]");
    if (!toast) return;
    var bodyEl = toast.querySelector("[data-toast-body]");
    if (bodyEl) bodyEl.textContent = body;
    toast.removeAttribute("hidden");
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function () {
      toast.classList.remove("show");
      toast.setAttribute("hidden", "");
    }, 3200);
  }

  function bumpCartPills() {
    document.querySelectorAll("[data-cart-pill]").forEach(function (pill) {
      pill.classList.remove("bump");
      void pill.offsetWidth;
      pill.classList.add("bump");
    });
  }

  function applyAddAll() {
    cartUi.count = L.cartCountAfterAdd;
    cartUi.total = L.orderTotal;
    cartUi.added = true;
    L.cartCount = cartUi.count;
    document.querySelectorAll("[data-cart-count]").forEach(function (el) {
      el.textContent = String(cartUi.count);
      el.classList.toggle("is-zero", cartUi.count === 0);
    });
    document.querySelectorAll("[data-cart-pill] [data-cart-total]").forEach(function (el) {
      el.textContent = money(cartUi.total);
    });
    document.querySelectorAll("[data-cart-pill]").forEach(function (el) {
      el.setAttribute("aria-label", "Cart, " + money(cartUi.total));
    });
    document.querySelectorAll("[data-inline-success]").forEach(function (el) {
      el.textContent = "Added to cart";
      el.classList.add("show");
    });
    document.querySelectorAll("[data-add-all]").forEach(function (btn) {
      btn.disabled = true;
      btn.textContent = "Added";
    });
    document.querySelectorAll("[data-order-footer] [data-line-count]").forEach(function (el) {
      el.innerHTML =
        "In cart · " +
        L.orderLines.length +
        (L.orderLines.length === 1 ? " line" : " lines");
    });
    bumpCartPills();
    showToast(L.orderLines.length + " lines · " + money(L.orderTotal));
  }

  function bind() {
    document.querySelectorAll("[data-tab]").forEach(function (el) {
      el.addEventListener("click", function () {
        var tab = el.getAttribute("data-tab");
        if (tab) show(tab);
      });
    });

    document.querySelectorAll("[data-set-perseus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var n = parseInt(btn.getAttribute("data-set-perseus"), 10);
        if (n) window.__setPerseusQty(n);
      });
    });

    document.querySelectorAll("[data-qty-group] [data-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var group = btn.closest("[data-qty-group]");
        if (!group || group.getAttribute("data-product") !== "perseus") return;
        var action = btn.getAttribute("data-action");
        var next = L.perseusQty + (action === "inc" ? 1 : -1);
        if (next < 1) next = 1;
        window.__setPerseusQty(next);
      });
    });

    document.querySelectorAll("[data-add-all]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        applyAddAll();
      });
    });

    document.querySelectorAll("[data-view-toggle] [data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        catalogView = btn.getAttribute("data-view") || "cards";
        var grid = document.querySelector('[data-screen="catalog"] [data-catalog-grid]');
        var toggle = document.querySelector('[data-screen="catalog"] [data-view-toggle]');
        if (grid) grid.classList.toggle("is-list", catalogView === "list");
        if (toggle) {
          toggle.querySelectorAll("[data-view]").forEach(function (b) {
            b.classList.toggle("on", b.getAttribute("data-view") === catalogView);
          });
        }
      });
    });
  }

  window.__setPerseusQty = function (qty) {
    var line = L.orderLines.find(function (l) {
      return l.productId === "perseus";
    });
    if (!line) return;
    line.qty = qty;
    L.perseusQty = qty;
    L.perseusUnit = L.priceAt(L.products.perseus, qty);
    L.perseusOrderTotal = Math.round(L.perseusUnit * qty * 100) / 100;
    L.orderTotal =
      Math.round(
        L.orderLines.reduce(function (s, l) {
          return s + L.lineAmount(l);
        }, 0) * 100
      ) / 100;
    L.cartTotal = L.orderTotal;
    if (cartUi.added) cartUi.total = L.orderTotal;
    L.invoices[0].amount = L.orderTotal;
    L.credit.used =
      Math.round(
        L.invoices
          .filter(function (inv) {
            return inv.open;
          })
          .reduce(function (s, inv) {
            return s + inv.amount;
          }, 0) * 100
      ) / 100;
    L.credit.available = Math.round((L.credit.limit - L.credit.used) * 100) / 100;
    L.credit.afterOrder = L.credit.available;
    L.credit.pct = Math.round((L.credit.used / L.credit.limit) * 1000) / 10;
    L.messages.sam =
      "120 units of Perseus Pro V ship " +
      L.shipDate +
      ". Invoice INV-1042 for " +
      money(L.orderTotal) +
      " covers the full restock on Net 30.";
    L.figures.perseusUnit = L.perseusUnit;
    L.figures.perseusQty = qty;
    L.figures.perseusOrderTotal = L.perseusOrderTotal;
    L.figures.orderTotal = L.orderTotal;
    L.figures.cartTotal = L.cartTotal;
    L.figures.creditUsed = L.credit.used;
    L.figures.creditAvailable = L.credit.available;
    L.figures.invoiceAmounts = L.invoices.map(function (inv) {
      return inv.amount;
    });
    L.figures.lineAmounts = L.orderLines.map(L.lineAmount);
    L.figures.unitPrices = L.orderLines.map(function (l) {
      return L.priceAt(L.products[l.productId], l.qty);
    });
    render();
  };

  document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      show(btn.getAttribute("data-tab"));
    });
  });

  render();
})();
  </script>
</body>
</html>
