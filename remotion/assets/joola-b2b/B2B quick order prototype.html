<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOOLA B2B Quick Order (design)</title>
<style>
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 400;
  font-style: normal;
  font-display: block;
  ascent-override: 100%;
  descent-override: 28%;
  line-gap-override: 0%;
  src: url("fonts/FKGroteskNeue-400-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 500;
  font-style: normal;
  font-display: block;
  ascent-override: 100%;
  descent-override: 28%;
  line-gap-override: 0%;
  src: url("fonts/FKGroteskNeue-500-normal.woff2") format("woff2");
}
@font-face {
  font-family: "FKGroteskNeue";
  font-weight: 700;
  font-style: normal;
  font-display: block;
  ascent-override: 100%;
  descent-override: 28%;
  line-gap-override: 0%;
  src: url("fonts/FKGroteskNeue-700-normal.woff2") format("woff2");
}

:root {
  /* Colour — 3 greys + one accent */
  --ink: #1a1a1a;
  --muted: #5c5c66;
  --faint: #8a8a96;
  --line: #e6e8ef;
  --line-soft: rgba(112, 115, 147, 0.12);
  --band: #f4f5f7;
  --sidebar-bg: #fbfcfd;
  --wash: #eceef2;
  --blue: #2c3ee0;
  --blue-soft: rgba(44, 62, 224, 0.08);
  --credit-used: var(--faint); /* used segment = faint grey, not a 4th grey */
  --page: #ffffff;
  --canvas: #ededec;
  --paid: #198754;
  --paid-bg: rgba(25, 135, 84, 0.12);
  --pending: #8a6100;
  --pending-bg: rgba(238, 186, 54, 0.18);
  --failed: #b0175f;
  --failed-bg: rgba(176, 23, 95, 0.10);
  --failed-border: rgba(208, 50, 117, 0.22);
  --best: #198754;
  --success: #12824a; /* order-placed check and button */
  /* Type — FK Grotesk Neue only; 4 sizes, 2 weights */
  --font-ui: "FKGroteskNeue", "FK Grotesk Neue", sans-serif;
  --text-title: 24px;
  --text-body: 14px;
  --text-ui: 13px;
  --text-meta: 12px;
  --text-micro: 12px; /* alias → meta; do not introduce a 5th size */
  /* Radii */
  --radius-pill: 999px;
  --radius-control: 8px;
  --radius-panel: 12px;
  --radius-status: 4px;
  /* Spacing / sizes */
  --switcher-h: 48px;
  --sidebar-w: 220px;
  --topbar-h: 48px;
  --pill-h: 36px;
  --avatar: 28px;
  --icon-slot: 16px;
  --icon-size: 16px;
  --icon-stroke: 1.5;
  --chip-gap: 12px;
  --row-h: 52px;
  --head-h: 40px;
  --control-h: 40px;
  --col-thumb: 48px;
  --col-product: minmax(220px, 1.4fr);
  --col-price: 120px;
  --col-qty: 172px;
  --col-total: 120px;
  --col-x: 28px;
  --rail-w: 240px;
  --content-max: 1120px;
  --content-pad-x: 28px;
  --inv-invoice: 132px;
  --inv-order: 112px;
  --inv-issued: 124px;
  --inv-due: 124px;
  --inv-amount: 120px;
  --inv-status: 108px;
  --inv-action: 140px;
  --tnum: tabular-nums;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-ui);
  font-size: var(--text-body);
  font-weight: 400;
  color: var(--ink);
  background: var(--canvas);
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; font-family: var(--font-ui); }
button { cursor: pointer; border: 0; background: none; color: inherit; }
img { display: block; max-width: 100%; }
.tnum, [data-display-price], [data-unit-price], [data-line-total],
[data-order-total], [data-cart-total], [data-invoice-amount],
[data-credit-used], [data-credit-available], .qty, .amt, .price,
.cart-amount-display, .unit, .big, .total {
  font-variant-numeric: var(--tnum);
  font-feature-settings: "tnum" 1;
}

#devSwitcher {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: var(--switcher-h);
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 16px;
  background: #161613;
  color: #fff;
  overflow-x: auto;
}
#devSwitcher .label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.45);
  margin-right: 8px;
  white-space: nowrap;
}
#devSwitcher .tab-btn {
  flex-shrink: 0;
  font-size: 13px;
  font-weight: 500;
  padding: 6px 12px;
  border-radius: 6px;
  color: rgba(255,255,255,0.7);
}
#devSwitcher .tab-btn.active {
  background: #fff;
  color: #161613;
}

#app {
  padding-top: var(--switcher-h);
  min-height: 100vh;
}

.screen { display: none; background: var(--page); min-height: calc(100vh - var(--switcher-h)); }
.screen.active { display: flex; flex-direction: column; min-height: calc(100vh - var(--switcher-h)); }
.screen.mobile-wrap {
  max-width: 390px;
  margin: 0 auto;
  border-left: 1px solid var(--line);
  border-right: 1px solid var(--line);
}

/* App shell: sidebar + top bar */
.app-shell {
  display: flex;
  flex: 1 1 auto;
  min-height: calc(100vh - var(--switcher-h));
  background: var(--page);
}
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
}
.sidebar-brand {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 4px 8px 16px;
}
.sidebar-brand img { width: 120px; height: auto; }
/* Wholesale as a tidy text chip under the logo — no blue dot */
.wholesale-chip {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--radius-status);
  background: var(--blue-soft);
  color: var(--blue);
  font-size: var(--text-meta);
  font-weight: 500;
  line-height: 1;
  letter-spacing: 0.01em;
}
.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 32px;
  padding: 0 8px;
  border-radius: var(--radius-control);
  font-size: var(--text-ui);
  font-weight: 400;
  color: var(--muted);
  text-align: left;
  width: 100%;
  transition: background-color 0.16s ease-out, color 0.16s ease-out;
}
.nav-item .icon-slot,
.icon-slot {
  width: var(--icon-slot);
  height: var(--icon-slot);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.nav-item .icon-slot svg,
.icon-slot svg {
  width: var(--icon-size);
  height: var(--icon-size);
  stroke: currentColor;
  fill: none;
  stroke-width: var(--icon-stroke);
  stroke-linecap: round;
  stroke-linejoin: round;
  display: block;
}
.nav-item:hover { background: rgba(112, 115, 147, 0.06); color: var(--ink); }
.nav-item:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 1px;
}
.nav-item:active { background: rgba(112, 115, 147, 0.12); }
.nav-item:disabled, .nav-item.is-disabled {
  opacity: 0.4;
  pointer-events: none;
  cursor: not-allowed;
}
.nav-item.active {
  background: var(--blue-soft);
  color: var(--blue);
  font-weight: 500;
  /* Same padding as default/hover — no layout jump */
  padding: 0 8px;
}
.sidebar-divider {
  height: 1px;
  background: var(--line);
  margin: 12px 8px;
}
.sidebar-footer {
  margin-top: auto;
  padding: 8px 0 4px; /* match nav: no extra horizontal pad so link x = icon x */
  display: flex;
  flex-direction: column;
  gap: 8px;
}
/* Store link = nav row (same height, pad, gap, icon slot) */
.sidebar-store {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 8px;
  height: 32px;
  font-size: var(--text-ui);
  font-weight: 400;
  color: var(--muted);
  text-decoration: none;
  border-radius: var(--radius-control);
  width: 100%;
  box-sizing: border-box;
}
.sidebar-store:hover { color: var(--ink); background: rgba(112, 115, 147, 0.06); }
.sidebar-store .icon-slot svg {
  width: var(--icon-size);
  height: var(--icon-size);
  stroke: currentColor;
  fill: none;
  stroke-width: var(--icon-stroke);
  stroke-linecap: round;
  stroke-linejoin: round;
}

.main-column {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--page);
}
.topbar {
  height: var(--topbar-h);
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 12px;
  padding: 0 var(--content-pad-x);
  border-bottom: 1px solid var(--line);
  background: #fff;
  overflow: visible;
  box-sizing: border-box;
  width: 100%;
}
/* Full-bleed topbar rule; right pad so account/cart align with 1120 content edge */
[data-screen="qo-desktop"] .topbar,
[data-screen="qo-search"] .topbar,
[data-screen="cart"] .topbar {
  padding-right: max(
    var(--content-pad-x),
    calc(100% - var(--content-max) + var(--content-pad-x))
  );
}
/* Global search removed — Quick Order owns product search (see design-spec) */
.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow: visible;
}
/* Matched pills: account chip + cart share height, radius, border */
.account-chip,
.cart-pill {
  box-sizing: border-box;
  height: var(--pill-h);
  min-height: var(--pill-h);
  max-height: var(--pill-h);
  display: inline-flex;
  align-items: center;
  border-radius: var(--radius-pill);
  border: 1px solid var(--line);
  background: #fff;
  color: var(--ink);
  font-size: var(--text-ui);
  font-weight: 500;
  line-height: 1;
}
.account-chip {
  gap: var(--chip-gap);
  /* 12px content pad; +2px on the right so long name clears the curve optically */
  padding: 0 14px 0 12px;
}
.account-chip:hover { background: var(--band); }
.account-chip:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.retailer-avatar {
  width: var(--avatar);
  height: var(--avatar);
  min-width: var(--avatar);
  min-height: var(--avatar);
  border-radius: 6px;
  overflow: hidden;
  background: var(--band);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  padding: 0;
}
.retailer-avatar img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}
.account-meta {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  text-align: left;
  min-width: 0;
  padding: 0;
  /* Two lines: 15 + 13 = 28 → optically centres with 28px logo tile inside 36px pill */
  height: 28px;
}
.account-meta .name {
  font-family: var(--font-ui);
  font-size: var(--text-ui);
  font-weight: 500;
  line-height: 15px;
  height: 15px;
  color: var(--ink);
  letter-spacing: 0;
}
.account-meta .role {
  font-family: var(--font-ui);
  font-size: var(--text-meta);
  font-weight: 400;
  line-height: 13px;
  height: 13px;
  color: var(--faint);
  letter-spacing: 0;
}
/* Buyer name only — no "· Buyer" punctuation belt */

.cart-pill {
  position: relative;
  gap: 8px;
  padding: 0 12px;
  font-variant-numeric: tabular-nums;
  overflow: visible;
  transition: background-color 0.15s ease-out, border-color 0.15s ease-out, transform 0.15s ease-out;
}
.cart-pill:hover { background: var(--band); }
.cart-pill:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.cart-pill:active { transform: scale(0.98); }
.cart-pill:disabled { opacity: 0.45; cursor: not-allowed; }
/* Text spans share a fixed line box so badge centres on cap-height centre */
.cart-pill > span:not(.count-chip) {
  display: inline-flex;
  align-items: center;
  height: 18px;
  line-height: 1;
}
/* Count chip: 18px circle, 11/500 tnum, flex-centred digit — no baseline tricks */
.cart-pill .count-chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  width: 18px;
  height: 18px;
  min-width: 18px;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  text-align: center;
}
.cart-pill .count-chip.is-wide {
  width: auto;
  min-width: 22px;
  padding: 0 6px;
  border-radius: var(--radius-pill);
}
.cart-pill .count-chip[hidden] { display: none !important; }
.cart-pill.bump .cart-amount-display,
.cart-pill.bump .count-chip {
  animation: typeBump 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes typeBump {
  0% { transform: scale(1); }
  35% { transform: scale(1.12); }
  100% { transform: scale(1); }
}
.toast {
  position: fixed;
  bottom: 88px;
  right: 28px;
  z-index: 80;
  min-width: 240px;
  max-width: 360px;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: 0 8px 24px rgba(26, 26, 26, 0.08);
  font-size: 13px;
  color: var(--ink);
  display: none;
  align-items: flex-start;
  gap: 12px;
}
.toast.show {
  display: flex;
  animation: toastIn 0.28s ease-out;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast .toast-copy { flex: 1; min-width: 0; }
.toast .toast-title { font-weight: 500; margin-bottom: 2px; }
.toast .toast-body { color: var(--muted); font-variant-numeric: tabular-nums; }
.toast .toast-undo {
  flex-shrink: 0;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--blue);
  line-height: 1;
  padding: 2px 0;
  border: 0;
  background: none;
}
.toast .toast-undo[hidden] { display: none !important; }
.toast .toast-undo:hover { color: var(--ink); }
.inline-success {
  display: none;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
  font-size: 13px;
  color: var(--paid);
  font-weight: 500;
}
.inline-success.show { display: inline-flex; }
.inline-success::before {
  content: "";
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--paid);
}

.page {
  padding: 28px var(--content-pad-x) 100px;
  width: 100%;
  flex: 1 1 auto;
  box-sizing: border-box;
}
/* Same content width for QO + cart — table/rail fill ~1120, footer matches edges */
[data-screen="qo-desktop"] .page,
[data-screen="qo-search"] .page,
[data-screen="cart"] .page {
  max-width: var(--content-max);
}
[data-screen="qo-desktop"] .order-footer,
[data-screen="qo-search"] .order-footer {
  max-width: var(--content-max);
  width: 100%;
  box-sizing: border-box;
  padding-left: var(--content-pad-x);
  padding-right: var(--content-pad-x);
}
.page h1 {
  margin: 0;
  font-family: var(--font-ui);
  font-size: var(--text-title);
  line-height: 1.15;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.page .lede {
  margin: 8px 0 0;
  max-width: 560px;
  font-size: var(--text-body);
  color: var(--muted);
  line-height: 1.5;
  font-weight: 400;
}

.search-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin-top: 20px;
  /* Fixed band height — dropdown overlays below and never grows the row */
  height: 36px;
  position: relative;
  z-index: 30;
}
.search-wrap {
  position: relative;
  width: 400px;
  height: 36px;
  flex-shrink: 0;
  overflow: visible;
}
.search-field {
  height: 36px;
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--band);
  border: 1px solid var(--line);
  font-size: 14px;
  color: var(--faint);
  box-sizing: border-box;
}
.search-field .placeholder { color: var(--faint); }
.search-field .value { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
.search-field.has-value .placeholder { display: none; }
.search-field:not(.has-value) .value { display: none; }
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0;
  width: 400px;
  box-sizing: border-box;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 6px;
  z-index: 50;
  box-shadow: 0 12px 32px rgba(16, 24, 40, 0.14), 0 2px 6px rgba(16, 24, 40, 0.06);
  /* Overlay only — never participate in layout */
  margin: 0;
  pointer-events: auto;
}
.search-results[hidden],
.search-results.is-closed {
  display: none !important;
}
.search-result {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 8px;
  height: 46px;
}
.search-result:hover { background: var(--band); }
.search-result:active { background: var(--wash); }
.search-result img {
  width: 28px; height: 28px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 2px;
}
.search-result .title { font-size: 13px; font-weight: 500; }
.search-result .meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.search-result .meta .meta-price {
  font-weight: 500;
  color: var(--ink);
}

.section-title {
  margin: 24px 0 10px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.search-row + .qo-layout {
  margin-top: 28px;
}
.qo-main .section-title:first-child {
  margin-top: 0;
}

/* Order table */
.order-table {
  display: flex;
  flex-direction: column;
  width: 100%;
  border-top: 1px solid var(--line);
}
.order-head, .order-row {
  display: grid;
  grid-template-columns: var(--col-thumb) var(--col-product) var(--col-price) var(--col-qty) var(--col-total) var(--col-x);
  column-gap: 16px;
  align-items: center;
  padding: 0 12px;
}
.order-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding-top: 0;
  padding-bottom: 0;
}
.order-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.order-head .end,
.order-row .end,
.order-head .num,
.price-block,
.line-total {
  text-align: right;
}
.order-head .qty-h,
.order-row .qty-cell { text-align: right; }
.order-row {
  min-height: var(--row-h);
  height: var(--row-h);
  border-bottom: 1px solid var(--line-soft);
  transition: background-color 0.15s ease-out;
}
.order-row:hover { background: var(--band); }
/* p19: no blue just-added / press tint — cursor press is the only feedback */
.order-row.is-just-added,
.order-row.is-just-added:hover {
  background: transparent;
  animation: none;
}
.order-row.has-presets,
.order-row.has-avail {
  height: auto;
  min-height: var(--row-h);
  padding: 8px 12px;
  align-items: center;
}
.avail-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin-top: 4px;
  padding: 0 8px;
  border-radius: var(--radius-status);
  background: var(--wash);
  color: var(--muted);
  font-size: var(--text-meta);
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}
.order-row img.thumb {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 4px;
}
.order-row > div:nth-child(2),
.cart-line > div:nth-child(2) {
  min-width: 0;
  overflow: hidden;
}
.prod-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.prod-sku {
  font-size: 12px;
  color: var(--muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.price-block { display: flex; flex-direction: column; gap: 1px; align-items: flex-end; width: 100%; }
.price-block .strike { font-size: 12px; color: var(--faint); text-decoration: line-through; }
.price-block .unit {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.price-block .ea {
  font-size: var(--text-meta);
  font-weight: 400;
  color: var(--faint);
  margin-left: 3px;
}
.price-block .hint { font-size: var(--text-meta); color: var(--muted); }
.price-block .hint b { color: var(--ink); font-weight: 500; }
.qty-presets button .best-tag {
  display: none; /* cut: presets already signal pack size */
}
.qty-group .qty-presets button.has-best {
  height: 32px;
  line-height: 1.05;
  padding-top: 3px;
}
.qty-cell { display: flex; flex-direction: column; align-items: flex-end; gap: 0; }
.qty-group {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  width: 148px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: #fff;
  overflow: hidden;
}
.qty-group .qty-stepper {
  display: flex;
  align-items: center;
  height: 40px;
  width: 100%;
  border: 0;
  border-radius: 0;
  background: #fff;
}
.qty-stepper {
  display: flex;
  align-items: center;
  height: 40px;
  width: 112px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
}
.qty-stepper button {
  width: 36px;
  min-width: 36px;
  height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--muted);
  transition: color 0.15s ease-out, background-color 0.15s ease-out;
  padding: 0;
}
.qty-stepper button .step-icon {
  width: 12px;
  height: 12px;
  fill: currentColor;
  stroke: none;
  display: block;
}
.qty-stepper button:hover { color: var(--ink); background: var(--band); }
.qty-stepper button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
  z-index: 1;
}
.qty-stepper button:active { background: var(--wash); }
.qty-stepper button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  background: transparent;
}
.qty-stepper .qty {
  flex: 1;
  text-align: center;
  font-size: var(--text-body);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.qty-group .qty-presets {
  display: flex;
  gap: 0;
  justify-content: stretch;
  border-top: 1px solid var(--line);
  background: var(--band);
}
.qty-presets {
  display: flex;
  gap: 4px;
  justify-content: flex-end;
}
.qty-group .qty-presets button {
  flex: 1;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--muted);
  padding: 0;
  border-radius: 0;
  border: 0;
  border-right: 1px solid var(--line);
  height: 28px;
  font-variant-numeric: tabular-nums;
  background: transparent;
}
.qty-group .qty-presets button:last-child { border-right: 0; }
.qty-group .qty-presets button:hover { background: var(--band); color: var(--ink); }
.qty-group .qty-presets button:focus-visible {
  outline: 2px solid var(--line);
  outline-offset: -2px;
}
.qty-group .qty-presets button:active { background: var(--wash); }
.qty-group .qty-presets button.on {
  color: var(--ink);
  background: var(--wash);
  font-weight: 500;
}
.qty-presets button {
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--muted);
  padding: 2px 6px;
  border-radius: 999px;
  border: 1px solid var(--line);
  height: 20px;
  font-variant-numeric: tabular-nums;
}
.qty-presets button.on {
  color: var(--ink);
  border-color: var(--line);
  background: var(--wash);
}
.line-total {
  font-size: var(--text-body);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}

.order-footer {
  position: sticky;
  bottom: 0;
  margin-top: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 28px;
  background: #fff;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.order-footer .footer-stack {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
}
.order-footer .total {
  font-family: var(--font-ui);
  font-size: var(--text-title);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  font-feature-settings: "tnum" 1;
  line-height: 1.15;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.order-footer .meta {
  font-family: var(--font-ui);
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--faint);
  line-height: 1.3;
  letter-spacing: normal;
  text-transform: none;
}
.btn-primary {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 16px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  transition: opacity 0.15s ease-out, transform 0.12s ease-out;
}
.btn-primary:hover { opacity: 0.92; }
.btn-primary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.btn-primary:active { transform: scale(0.98); opacity: 0.88; }
.btn-primary:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-outline {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 16px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  transition: background-color 0.15s ease-out, transform 0.12s ease-out;
}
.btn-outline:hover { background: var(--band); }
.btn-outline:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.btn-outline:active { transform: scale(0.98); background: var(--wash); }
.btn-outline:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
}
.btn-black { /* legacy alias → primary accent */
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 16px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
}

/* Recommended / catalog */
.rec-rail {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.rec-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 14px;
  background: #fff;
  overflow: hidden;
}
.rec-card .media,
.cat-card .media {
  height: 220px;
  background: var(--band);
  overflow: hidden;
}
.rec-card .media img,
.cat-card .media img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center;
  display: block;
}
.rec-card .chip {
  display: inline-flex;
  align-items: center;
  height: 20px;
  margin: 12px 14px 0;
  padding: 0 8px;
  font-size: 12px;
  font-weight: 400;
  color: var(--muted);
  background: var(--band);
  border-radius: 4px;
  border: 1px solid var(--line);
}
.rec-card .why {
  margin: 6px 14px 0;
  font-size: 12px;
  color: var(--faint);
  line-height: 1.4;
}
.rec-card .title { margin: 8px 14px 0; font-size: 16px; font-weight: 500; }
.rec-card .price-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  margin: 6px 14px 0;
  font-variant-numeric: tabular-nums;
}
.rec-card .price { font-size: 16px; font-weight: 500; }
.rec-card .msrp { font-size: 13px; color: var(--faint); text-decoration: line-through; }
.rec-card .moq { margin: 4px 14px 0; font-size: 12px; color: var(--muted); }
.catalog-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-top: 24px;
}
.catalog-toolbar .section-title { margin: 0; }
.view-toggle {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
  background: #fff;
}
.view-toggle button {
  height: 32px;
  padding: 0 12px;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  background: #fff;
  transition: background-color 0.15s ease-out, color 0.15s ease-out;
}
.view-toggle button:hover { background: var(--band); color: var(--ink); }
.view-toggle button:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -2px;
}
.view-toggle button:active { background: var(--wash); }
.view-toggle button.on {
  background: var(--blue-soft);
  color: var(--blue);
}
.catalog-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.catalog-grid.is-list {
  grid-template-columns: 1fr;
  gap: 0;
  border-top: 1px solid var(--line);
}
.catalog-grid.is-list .cat-card {
  display: grid;
  grid-template-columns: 56px 1fr 120px 80px;
  align-items: center;
  gap: 16px;
  border-radius: 0;
  border: 0;
  border-bottom: 1px solid var(--line-soft);
  padding: 8px 0;
  min-height: 56px;
}
.catalog-grid.is-list .cat-card .media {
  height: 48px;
  width: 48px;
  border-radius: 6px;
  border: 1px solid var(--line);
}
.catalog-grid.is-list .cat-card .title { margin: 0; font-size: 14px; }
.catalog-grid.is-list .cat-card .price { margin: 0; text-align: right; }
.catalog-grid.is-list .cat-card .moq { margin: 0; text-align: right; }
.cat-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 0 0 12px;
  background: #fff;
  overflow: hidden;
}
.cat-card .title { margin: 10px 12px 0; font-size: 13px; font-weight: 500; }
.cat-card .price { margin: 4px 12px 0; font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; text-align: left; }
.cat-card .moq { margin: 2px 12px 0; font-size: 12px; color: var(--muted); }

/* Credit meter — one 6px track: used | this order | remaining (flush, no gaps) */
.credit-meter {
  margin-top: 16px;
  position: relative;
}
.credit-meter-label {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.credit-meter-label .avail {
  color: var(--muted);
  font-weight: 400;
  text-align: left;
  white-space: nowrap;
}
.credit-bar {
  margin-top: 8px;
  width: 100%;
  height: 6px;
  border-radius: 999px;
  background: var(--wash); /* remaining track */
  overflow: hidden;
  position: relative;
}
/* Single flush fill via gradient stops — no per-segment radius/gaps/stubs */
.credit-bar[data-credit-bar] {
  background-image: linear-gradient(
    to right,
    var(--credit-used) 0,
    var(--credit-used) var(--credit-used-end, 0%),
    var(--blue) var(--credit-used-end, 0%),
    var(--blue) var(--credit-order-end, 0%),
    var(--wash) var(--credit-order-end, 0%),
    var(--wash) 100%
  );
  background-color: var(--wash);
  cursor: default;
}
.credit-bar > i { display: none; } /* segments encoded in gradient */
.credit-tip {
  position: absolute;
  left: 50%;
  bottom: calc(100% + 8px);
  transform: translateX(-50%);
  min-width: 200px;
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #fff;
  box-shadow: 0 8px 20px rgba(26, 26, 26, 0.08);
  font-size: var(--text-meta);
  font-weight: 400;
  color: var(--muted);
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease-out;
  z-index: 4;
}
.credit-tip strong {
  color: var(--ink);
  font-weight: 500;
}
.credit-meter:hover .credit-tip,
.credit-meter:focus-within .credit-tip {
  opacity: 1;
}
.credit-card {
  width: 380px;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  margin-top: 20px;
  background: #fff;
}
.credit-card .credit-meter { margin-top: 0; }
.cart-notice {
  margin-top: 12px;
  font-size: var(--text-meta);
  color: var(--muted);
  line-height: 1.35;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.cart-notice.is-warn {
  color: var(--ink);
  padding: 8px 10px;
  border-radius: var(--radius-control);
  background: var(--band);
  border: 1px solid var(--line);
  white-space: normal;
}
.cart-field .po-warn {
  margin-top: 6px;
  font-size: var(--text-meta);
  color: var(--muted);
  display: none;
}
.cart-field .po-warn.show { display: block; }
/* Confirmation: page/card hug content — never stretch to viewport height */
[data-screen="confirmation"] .page.page-confirm {
  flex: 0 0 auto;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding-top: 24px;
  padding-bottom: 48px;
  min-height: 0;
}
.confirm-panel {
  margin-top: 0;
  width: 100%;
  max-width: 480px;
  height: auto;
  align-self: flex-start;
  flex: 0 0 auto;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  padding: 24px;
  background: #fff;
}
.confirm-panel .confirm-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}
/* 22px disc. translateY is the cap-height correction, set after measurement. */
.confirm-check {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--success);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: 0 0 auto;
  /* Cap centre of the 24px title sits 0.8px above the flex line-box centre. */
  transform: translateY(-0.8px);
}
.confirm-check svg { display: block; }
.confirm-panel h1 { margin: 0; }
.confirm-lede .inline-link {
  display: inline;
  margin: 0;
  padding: 0;
  border: 0;
  background: none;
  font: inherit;
  color: inherit;
  line-height: inherit;
  text-decoration: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 2px;
  cursor: pointer;
}
.confirm-lede .inline-link:hover { color: var(--blue); }
.orders-table { margin-top: 24px; border-top: 1px solid var(--line); width: 100%; max-width: 100%; }
.orders-head, .orders-row {
  display: grid;
  grid-template-columns: 140px 160px minmax(180px, 1fr) 140px;
  column-gap: 16px;
  align-items: center;
  padding: 0 8px;
}
.orders-head {
  height: 40px;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.orders-row {
  height: 48px;
  border-bottom: 1px solid var(--line-soft);
  font-size: 13px;
}
.orders-row .amt, .orders-head .num { text-align: right; font-variant-numeric: tabular-nums; }
.orders-row .amt { font-weight: 500; color: var(--ink); }
.confirm-panel .confirm-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--radius-status);
  background: var(--blue-soft);
  color: var(--blue);
  font-size: var(--text-meta);
  font-weight: 500;
  line-height: 1;
}
.confirm-panel .confirm-lede {
  margin: 8px 0 0;
  font-size: var(--text-body);
  font-weight: 400;
  color: var(--muted);
  line-height: 1.45;
}
.confirm-rows {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.confirm-rows .row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  font-size: var(--text-ui);
}
.confirm-rows .row[hidden] { display: none !important; }
.confirm-rows .row .k { color: var(--faint); font-weight: 500; }
.confirm-rows .row .v {
  color: var(--ink);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
}
.confirm-actions {
  margin-top: 20px;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.invoice-table {
  margin-top: 24px;
  width: max-content;
  max-width: 100%;
  border-top: 1px solid var(--line);
}
.invoice-head, .invoice-row {
  display: grid;
  grid-template-columns: var(--inv-invoice) var(--inv-order) var(--inv-issued) var(--inv-due) var(--inv-amount) var(--inv-status) var(--inv-action);
  column-gap: 16px;
  align-items: center;
  padding: 0 8px;
  width: max-content;
}
.invoice-head {
  position: sticky;
  top: var(--switcher-h);
  z-index: 5;
  height: 40px;
  background: #fff;
  border-bottom: 1px solid var(--line);
}
.invoice-head > div {
  font-size: 12px;
  font-weight: 500;
  color: var(--faint);
}
.invoice-head > div.num,
.invoice-row .amt {
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.invoice-row {
  height: 50px;
  min-height: 50px;
  border-bottom: 1px solid var(--line-soft);
}
.invoice-row .id { font-size: 14px; font-weight: 500; }
.invoice-row .cell { font-size: 13px; color: var(--muted); }
.invoice-row .amt {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  height: 20px;
  min-height: 20px;
  max-height: 20px;
  padding: 0 8px;
  border-radius: 4px;
  border: 1px solid transparent;
  font-size: 12px;
  font-weight: 400;
  line-height: 1;
  text-transform: none;
  white-space: nowrap;
}
.status.Paid {
  background: var(--paid-bg);
  color: var(--paid);
  border-color: rgba(25, 135, 84, 0.22);
}
.status.Processing,
.status.Due,
.status.Pending,
.status.PendingFulfillment,
.status.PendingApproval {
  background: var(--pending-bg);
  color: var(--pending);
  border-color: rgba(138, 97, 0, 0.22);
}
.status.Billed {
  background: var(--paid-bg);
  color: var(--paid);
  border-color: rgba(25, 135, 84, 0.22);
}
.status.Overdue,
.status.Failed {
  background: var(--failed-bg);
  color: var(--failed);
  border-color: var(--failed-border);
}
.invoice-row .action { justify-self: stretch; }
.invoice-row .action button {
  height: 32px;
  padding: 0 12px;
  border-radius: 8px;
  border: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  width: 100%;
  background: #fff;
}

/* Quick Order layout + single Reorder rail */
.qo-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--rail-w);
  gap: 28px;
  align-items: start;
  margin-top: 20px;
}
.qo-main { min-width: 0; }
.qo-rail {
  width: var(--rail-w);
  position: sticky;
  top: calc(var(--switcher-h) + 12px);
}
.rail-card {
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: #fff;
  padding: 16px;
}
.rail-card h3,
.label-quiet {
  margin: 0 0 12px;
  font-size: var(--text-meta);
  font-weight: 500;
  letter-spacing: normal;
  text-transform: none;
  color: var(--faint);
}
.rail-item {
  position: relative;
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  border-top: 1px solid var(--line-soft);
  border-radius: 6px;
  margin: 0 -6px;
  padding: 10px 6px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  overflow: hidden; /* clip Add fade to the row */
  transition: background-color 0.12s ease-out;
}
.rail-item:first-of-type { border-top: 0; }
.rail-item:hover { background: var(--band); }
.rail-item:focus,
.rail-item:focus-visible {
  /* Inset ring: an outside outline-offset was scrolling the row ~1px into view */
  outline: 2px solid var(--blue);
  outline-offset: -3px;
}
.rail-item .rail-copy {
  display: flex;
  flex-direction: column;
  gap: 2px;
  /* Full width at rest — Add overlays and reserves no space */
  width: 100%;
  min-width: 0;
  padding-right: 0;
}
.rail-item .rail-id {
  display: block;
  font-size: var(--text-meta);
  font-weight: 400;
  color: var(--faint);
  line-height: 1.25;
  white-space: nowrap;
}
.rail-item .name {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
  white-space: nowrap;
  overflow: visible;
}
.rail-item .meta {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  line-height: 1.35;
  white-space: nowrap;
}
.rail-item .meta .meta-left { min-width: 0; color: var(--muted); }
.rail-item .meta .meta-amt {
  flex-shrink: 0;
  font-weight: 500;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
/* Add overlays the right edge on hover — no reserved column */
.rail-item .rail-action {
  position: absolute;
  top: 50%;
  right: 4px;
  transform: translateY(-50%);
  z-index: 2;
  height: 24px;
  padding: 0 8px;
  border-radius: 6px;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--blue);
  background: var(--band);
  box-shadow: -12px 0 10px 4px var(--band);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease-out;
}
.rail-item:hover .rail-action,
.rail-item:focus-within .rail-action {
  opacity: 1;
}
.rail-item:hover .rail-action {
  background: var(--band);
  box-shadow: -12px 0 10px 4px var(--band);
}

/* Messages */
.messages-layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr) 260px;
  flex: 1 1 auto;
  min-height: 0;
}
.inbox {
  border-right: 1px solid var(--line);
  padding: 16px 12px;
  background: var(--sidebar-bg);
}
.inbox h2 {
  margin: 0 0 10px;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--faint);
  letter-spacing: normal;
  text-transform: none;
}
.inbox-item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 0 10px;
  height: 48px;
  border-radius: 8px;
  background: var(--blue-soft);
  border: 1px solid transparent;
}
.joola-mark {
  width: 32px;
  height: 32px;
  min-width: 32px;
  border-radius: 50%;

  background: #111;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 6px;
  flex-shrink: 0;
}
.joola-mark img {
  width: 100%;

  filter: brightness(0) invert(1);
}
.bubble.sam .who {
  display: flex;
  align-items: center;
  gap: 8px;
}
.bubble.sam .joola-mark {
  width: 22px;
  height: 22px;
  min-width: 22px;
  padding: 4px;
}
.thread {
  display: flex;
  flex-direction: column;
  min-height: 100%;
}
.thread-head {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 0;
  min-height: 48px;
  height: auto;
  padding: 8px 20px;
  border-bottom: 1px solid var(--line);
  font-size: 14px;
  font-weight: 500;
}
.thread-body {
  flex: 1;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #fff;
}
.bubble {
  max-width: 70%;

  border-radius: 12px;
  font-size: 18px;

}
.bubble .who { font-size: 12px; margin-bottom: 6px; }
.bubble .who b { font-weight: 500; }
.bubble .who span,
.bubble .who div { color: var(--muted); font-weight: 400; }
.bubble.anna {
  align-self: flex-end;
  background: var(--ink);
  color: #fff;
}
.bubble.anna .who span,
.bubble.anna .who div { color: rgba(255, 255, 255, 0.65); }
.bubble.anna .who span { color: rgba(255,255,255,0.65); }
.bubble.sam {
  align-self: flex-start;
  background: var(--band);

}
.thread-compose {
  display: flex;

  border-top: 1px solid var(--line);

}
.thread-compose .field {
  flex: 1;
  height: 40px;
  display: flex;
  align-items: center;
  padding: 0 14px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--band);
  color: var(--faint);
  font-size: 14px;
}
.thread-compose .btn-send {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  background: var(--blue);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
  transition: opacity 0.15s ease-out, transform 0.12s ease-out;
}
.thread-compose .btn-send:hover { opacity: 0.92; }
.thread-compose .btn-send:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.thread-compose .btn-send:active { transform: scale(0.96); }
.thread-compose .btn-send:disabled { opacity: 0.4; cursor: not-allowed; }
.order-context {
  margin: 0 20px 4px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--band);

  grid-template-columns: 1fr 1fr;

}
.order-context .oc-label {

  font-weight: 500;

  text-transform: none;

}
.order-context .oc-value {

  font-weight: 500;
  font-variant-numeric: tabular-nums;

}
.msg-details {

}
.msg-details h2 {
  margin: 0;
  font-size: var(--text-meta);
  font-weight: 500;
  letter-spacing: normal;
  text-transform: none;
  color: var(--faint);
}
.msg-details .detail-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.msg-details .detail-row .k {
  font-size: var(--text-meta);
  color: var(--faint);
  font-weight: 500;
  letter-spacing: normal;
  text-transform: none;
}
.msg-details .detail-row .v {
  font-size: 14px;
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}

/* Templates empty + skeleton */
.templates-empty {
  display: none;
  margin-top: 20px;
  max-width: 560px;
  padding: 28px 20px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  text-align: center;
  color: var(--muted);
  font-size: 14px;
}
.templates-skeleton {
  display: none;
  margin-top: 20px;
  max-width: 560px;
  flex-direction: column;
  gap: 8px;
}
.skel-card {
  height: 64px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: linear-gradient(90deg, var(--band) 0%, var(--wash) 50%, var(--band) 100%);

}
@keyframes skel {
  0% { background-position: 100% 0; }
  100% { background-position: -100% 0; }
}

/* States screen */
.state-sheet {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));

}

}
.state-block h3 {

}
.state-row {

  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.state-row:last-child { margin-bottom: 0; }
.state-label {
  font-size: 11px;
  color: var(--faint);

/* Cart */
.cart-lines { margin-top: 0; display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.cart-main .cart-checkout { margin-top: 20px; max-width: none; }
.cart-line {
  display: grid;
  /* thumb | product | money (qty×price + total) | remove */
  grid-template-columns: 40px minmax(0, 1fr) auto 32px;
  column-gap: 12px;
  align-items: center;
  min-height: var(--row-h);
  height: auto;
  padding: 8px 0;
  border-bottom: 1px solid var(--line-soft);
}
.cart-line.is-removed { display: none; }
.cart-line .line-remove {
  justify-self: end;
  box-sizing: border-box;
  width: 28px;
  height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: none;
  color: var(--faint);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease-out, color 0.12s ease-out, background-color 0.12s ease-out;
}
.cart-line .line-remove svg {
  width: 16px;
  height: 16px;
  stroke: currentColor;
  stroke-width: 1.5;
  fill: none;
  stroke-linecap: round;
}
.cart-line:hover .line-remove,
.cart-line:focus-within .line-remove {
  opacity: 1;
  pointer-events: auto;
}
.cart-line .line-remove:hover { color: var(--ink); background: var(--band); }
.cart-line .line-remove:focus-visible {
  opacity: 1;
  pointer-events: auto;
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  color: var(--ink);
}
@media (hover: none) {
  .cart-line .line-remove {
    opacity: 1;
    pointer-events: auto;
  }
}
.cart-line.has-avail { min-height: 60px; }
.cart-line img {
  width: 36px; height: 36px;
  object-fit: contain;
  border-radius: 6px;
  border: 1px solid var(--line);
  background: var(--band);
  padding: 4px;
}
.cart-line .cart-prod { min-width: 0; }
.cart-line .cart-money {
  display: grid;
  grid-template-columns: 132px 112px;
  column-gap: 16px;
  align-items: baseline;
  justify-items: end;
}
.cart-line .cart-unit {
  width: 132px;
  font-size: var(--text-body);
  font-weight: 400;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
  line-height: 1.2;
}
.cart-line .line-total {
  width: 112px;
  font-size: var(--text-body);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
  line-height: 1.2;
  color: var(--ink);
}
.cart-checkout {
  margin-top: 20px;
  max-width: 720px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px 16px;
}
.cart-field label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 8px;
}
.cart-field .control,
.cart-field select,
.cart-field input {
  width: 100%;
  height: 40px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
  padding: 0 12px;
  font-size: 14px;
  font-weight: 400;
  color: var(--ink);
  font-family: inherit;
}
.cart-field .control {
  display: flex;
  align-items: center;
  color: var(--ink);
}
.cart-field.span-2 { grid-column: 1 / -1; }
.cart-field .addr {
  margin-top: 8px;
  font-size: var(--text-meta);
  color: var(--muted);
  line-height: 1.4;
}
/* Ship-to: selectable address card (no native select) */
.ship-card {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
  max-width: 420px;
  padding: 12px 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: #fff;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.15s ease-out, background-color 0.15s ease-out;
}
.ship-card:hover { background: var(--band); }
.ship-card:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
}
.ship-card.is-open { border-color: var(--blue); }
.ship-card-body { min-width: 0; flex: 1 1 auto; }
.ship-card .ship-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: var(--text-ui);
  font-weight: 500;
  color: var(--ink);
  line-height: 1.3;
}
.ship-card .ship-tag,
.ship-option .ship-tag {
  display: inline-flex;
  align-items: center;
  height: 20px;
  padding: 0 8px;
  border-radius: var(--radius-status);
  background: var(--wash);
  color: var(--muted);
  font-size: var(--text-meta);
  font-weight: 500;
  line-height: 1;
}
.ship-card .ship-addr {
  margin-top: 4px;
  font-size: var(--text-meta);
  font-weight: 400;
  color: var(--faint);
  line-height: 1.4;
}
.ship-card .ship-change {
  flex-shrink: 0;
  font-size: var(--text-meta);
  font-weight: 500;
  color: var(--blue);
  padding: 2px 0 0;
  line-height: 1.3;
}
.ship-menu {
  margin-top: 8px;
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: #fff;
  overflow: hidden;
  max-width: 420px;
}
.ship-menu[hidden] { display: none !important; }
.ship-option {
  display: block;
  width: 100%;
  text-align: left;
  padding: 10px 14px;
  border: 0;
  border-top: 1px solid var(--line-soft);
  background: #fff;
  cursor: pointer;
}
.ship-option:first-child { border-top: 0; }
.ship-option:hover { background: var(--band); }
.ship-option.is-selected { background: var(--blue-soft); }
.ship-option .ship-name {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  font-size: var(--text-ui);
  font-weight: 500;
  color: var(--ink);
}
.ship-option .ship-addr { margin-top: 4px; font-size: var(--text-meta); color: var(--faint); }
.need-by {
  grid-column: 1 / -1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-top: 4px;
}
.need-by-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: var(--text-ui);
  color: var(--ink);
  font-weight: 500;
  cursor: pointer;
  width: fit-content;
}
.need-by-row input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--blue);
  margin: 0;
  flex-shrink: 0;
}
.need-by .hint {
  font-size: var(--text-meta);
  color: var(--muted);
  font-weight: 400;
  line-height: 1.4;
  padding-left: 26px;
}
.need-by .date-control {
  margin-left: 26px;
  max-width: 220px;
  height: var(--control-h);
  border: 1px solid var(--line);
  border-radius: var(--radius-control);
  background: #fff;
  padding: 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--text-ui);
  color: var(--ink);
}
.need-by .date-control[hidden] { display: none !important; }
.need-by .date-control .cal-icon {
  width: 14px;
  height: 14px;
  flex-shrink: 0;
  stroke: var(--muted);
  fill: none;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.need-by .date-control .date-value {
  flex: 1;
  min-width: 0;
}
.cart-returns {
  grid-column: 1 / -1;
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
}
.cart-returns a {
  color: var(--ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  font-weight: 500;
}
.cart-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 32px;
  align-items: start;
  margin-top: 20px;
}
.cart-main { min-width: 0; }
.cart-summary {
  position: sticky;
  top: calc(var(--switcher-h) + 16px);
  margin-top: 0;
  max-width: none;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 16px;
  background: #fff;
}
.cart-summary .sum-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}
.cart-summary .sum-row:first-child { margin-top: 0; }
.cart-summary .sum-row span:last-child { color: var(--ink); font-weight: 500; }
.cart-summary .sum-total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin-top: 16px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 13px;
  color: var(--muted);
}
.cart-summary .sum-total .big {
  font-size: var(--text-title);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
  color: var(--ink);
}
.cart-summary .credit-meter { margin-top: 16px; }
.cart-summary .btn-primary {
  width: 100%;
  justify-content: center;
  margin-top: 16px;
}
/* ready-chip removed — footer is a clean label/value stack */
.btn-text {
  height: 40px;
  display: inline-flex;
  align-items: center;
  padding: 0 4px;
  background: transparent;
  border: 0;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  transition: color 0.15s ease-out;
}
.btn-text:hover { color: var(--ink); }
.btn-text:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: 2px;
  border-radius: 4px;
}
.rail-link {
  display: inline-block;
  margin-top: 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
  font-family: inherit;
}
.rail-link:hover { color: var(--ink); }

.templates-list { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.template-card {
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 16px;
  height: 64px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.template-card h3 { margin: 0; font-size: 14px; font-weight: 500; }
.template-card p { margin: 4px 0 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

.mobile-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  font-weight: 500;
  height: 48px;
}
.screen.mobile-wrap .page h1 { font-size: 28px; }
.screen.mobile-wrap .lede { font-size: 15px; }
.screen.mobile-wrap .prod-name { font-size: 15px; }
.screen.mobile-wrap .prod-sku { font-size: 13px; }
.screen.mobile-wrap .order-footer .btn-outline,
.screen.mobile-wrap .order-footer .btn-primary { font-size: 15px; height: 44px; }

.line-total.bump,
[data-order-total].bump {
  animation: typeBump 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}

/* (r14 below) */
/* ================= r13 polish layer ================= */
:root {
  --content-max: 1360px;
  --card-bg: #f2f3f5;   /* matches product photo backdrop: one tile colour */
}
@media (min-width: 1800px) { :root { --content-max: 1520px; } }
#devSwitcher .label { text-transform: none; letter-spacing: 0; font-size: 12px; }

/* One content width on every desktop screen; topbar pills align to it */
.screen:not(.mobile-wrap) .page:not(.page-confirm) { max-width: var(--content-max); }
.screen .topbar {
  padding-right: max(var(--content-pad-x), calc(100% - var(--content-max) + var(--content-pad-x)));
}
.screen:not(.mobile-wrap) .order-footer { max-width: var(--content-max); }
[data-screen="messages"] .topbar { padding-right: var(--content-pad-x); }

/* Dividers: keep only structural ones (topbar, sticky footer, table head) */
.order-row, .invoice-row, .cart-line, .rail-item, .ship-option,
.catalog-grid.is-list .cat-card { border-bottom: 0 !important; border-top: 0 !important; }
.cart-lines, .order-table, .invoice-table, .catalog-grid.is-list { border-top: 0 !important; }
.cart-summary .sum-total { border-top: 0 !important; padding-top: 12px; margin-top: 8px; }
.sidebar-footer { border-top: 0 !important; }
.order-row, .invoice-row { border-radius: 8px; }
.order-row:hover, .invoice-row:hover { background: var(--band); }
.order-row.is-just-added,
.order-row.is-just-added:hover {
  /* p19: no blue tint on the inserted row */
  background-color: transparent;
}
.invoice-head, .order-head { border-bottom: 1px solid var(--line) !important; }
.cart-line { padding-top: 10px; padding-bottom: 10px; }
.rail-item { padding-top: 10px; padding-bottom: 10px; }
.confirm-rows .row { border: 0 !important; }

/* Invoices: fluid columns that use the width */
.invoice-head, .invoice-row {
  grid-template-columns: minmax(120px,1.1fr) minmax(100px,1fr) minmax(110px,1fr) minmax(110px,1fr) minmax(120px,1fr) minmax(110px,0.9fr) 140px !important;

.catalog-toolbar { margin-top: 48px; }

.catalog-grid.is-list .cat-card .media { background: var(--card-bg); border: 0; aspect-ratio: 1/1; }

/* Same tile treatment on every thumbnail */
.order-row img.thumb, .cart-line img, .search-result img {

}

/* ---------- Templates ---------- */
.templates-list { display: flex; flex-direction: column; gap: 12px; margin-top: 24px; max-width: none; }
.tpl-card { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; }
.tpl-head {

  padding: 16px 20px; text-align: left; border-radius: 12px;
}
.tpl-head:hover { background: var(--band); }
.tpl-head:focus-visible { outline: 2px solid var(--blue); outline-offset: -2px; }
.tpl-title { display: flex; flex-direction: column; gap: 4px; }
.tpl-title .name { font-size: 14px; font-weight: 500; }
.tpl-title .meta { font-size: 13px; color: var(--muted); }
.tpl-total { font-size: 14px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chev { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s ease; justify-self: end; }

.tpl-thumb { width: 44px; height: 44px; border-radius: 6px; background: var(--card-bg); display: flex; align-items: center; justify-content: center; }
.tpl-thumb img { width: 84%; height: 84%; object-fit: contain;  }
.tpl-unit { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.tpl-amt { font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.tpl-actions { display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding-top: 12px; }
.template-card { display: none; }

/* ---------- Messages ---------- */
.messages-layout { grid-template-columns: 280px minmax(0, 1fr) 280px; }
.inbox { border-right: 0 !important; padding: 20px 12px; }
.inbox h2 { font-size: 14px !important; color: var(--ink) !important; margin: 0 8px 12px !important; }
.inbox-item {
