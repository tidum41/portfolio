  border-radius: 10px; text-align: left; align-items: center;
}
.inbox-item:hover { background: var(--band) !important; }
.inbox-item.is-active { background: var(--blue-soft) !important; }
.mark { display: inline-flex; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
.mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ib-copy { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ib-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ib-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.ib-time { font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ib-prev { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread { background: #fff; }
.thread-head {
  flex-direction: row !important; align-items: center !important; justify-content: flex-start !important; gap: 12px !important;
  padding: 20px 32px 0 !important; border-bottom: 0 !important; min-height: 0 !important;
}
.th-name { font-size: 14px; font-weight: 500; }
.th-role { font-size: 12px; color: var(--muted); margin-top: 2px; }
.order-context {
  margin: 20px 32px 0 !important; border: 0 !important; background: var(--band) !important;
  grid-template-columns: repeat(3, 1fr) !important; padding: 14px 16px !important; border-radius: 10px !important;
}
.order-context .oc-value { font-size: 14px !important; }
.thread-body { padding: 24px 32px !important; gap: 20px !important; }
.day { align-self: center; font-size: 12px; color: var(--faint); }
.msg { display: flex; flex-direction: column; gap: 6px; max-width: 64%; }
.msg.me { align-self: flex-end; align-items: flex-end; }
.msg.them { align-self: flex-start; flex-direction: row; align-items: flex-end; gap: 10px; }
.msg.them > div { display: flex; flex-direction: column; gap: 6px; }
.msg-meta { font-size: 12px; font-weight: 500; color: var(--ink); display: flex; gap: 8px; align-items: baseline; padding: 0 4px; }
.msg-meta .t { font-weight: 400; color: var(--faint); font-variant-numeric: tabular-nums; }
.bubble { max-width: none !important; font-size: 14px !important; line-height: 1.5 !important; padding: 10px 14px !important; border: 0 !important; }
.bubble.anna { border-radius: 16px 16px 4px 16px !important; background: var(--ink) !important; }
.bubble.sam { border-radius: 16px 16px 16px 4px !important; background: var(--band) !important; }
.thread-compose { border-top: 0 !important; padding: 12px 32px 24px !important; }
.composer {
  flex: 1; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 6px 0 18px;
  border: 1px solid var(--line); border-radius: 999px; background: #fff;
}
.composer .field { flex: 1; border: 0 !important; background: none !important; padding: 0 !important; height: auto !important; color: var(--faint); font-size: 14px; }
.composer .btn-send { width: 36px !important; height: 36px !important; border-radius: 50% !important; }
.composer .btn-send svg { width: 16px; height: 16px; fill: none; stroke: #fff; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.msg-details { border-left: 0 !important; padding: 20px !important; gap: 16px !important; }
.msg-details h2 { font-size: 14px !important; color: var(--ink) !important; }

/* Badges + pills: one height, optically centred text */
.status, .confirm-tag, .ship-tag, .avail-tag {
  display: inline-flex !important; align-items: center; justify-content: center;
  height: 22px !important; padding: 0 8px !important; line-height: 1 !important;
  font-size: 12px !important; font-weight: 500 !important; border-radius: 999px !important;
  border: 0 !important; box-sizing: border-box; white-space: nowrap;
}
.wholesale-chip { border-radius: 999px !important; }

/* ================= r14 ================= */
/* Cart + account pill: one optical centre line. Font metrics are trimmed in
   @font-face (ascent 100% / descent 28%) so cap + digit centre = line-box centre. */
.cart-pill {
  display: inline-flex !important; align-items: center !important; gap: 8px !important;
  height: 36px; padding: 0 8px 0 12px !important; line-height: 1 !important;
}
.cart-pill:has(.count-chip[hidden]) { padding-right: 12px !important; }
.cart-pill > span:not(.count-chip) {
  display: block !important; height: auto !important; line-height: 1 !important;
  text-box: trim-both cap alphabetic;
}
.cart-pill .count-chip, .cart-pill .count-chip.is-wide {
  display: grid !important; place-items: center !important;
  width: 20px !important; min-width: 20px !important; height: 20px !important;
  padding: 0 !important; margin: 0 !important; border-radius: 10px !important;
  font-size: 12px !important; line-height: 1 !important;
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  text-box: trim-both cap alphabetic;
}
.cart-pill .count-chip.is-wide { width: 26px !important; }
.cart-pill .count-chip[hidden], .cart-pill > span[hidden]:not(.count-chip) { display: none !important; }
.account-meta .name, .account-meta .role { line-height: 1 !important; height: auto !important; text-box: trim-both cap alphabetic; }
.cart-pill .count-chip { box-sizing: border-box !important; }
/* Measured at 400%: two-digit counts sit 0.5px high because '2' overshoots; 1px top pad recentres the ink */
.cart-pill .count-chip.is-wide { padding-top: 1px !important; }
.account-meta { gap: 6px !important; height: auto !important; }
.status, .confirm-tag, .ship-tag, .avail-tag { padding-top: 0 !important; }
.mobile-nav .cart-pill { height: 36px; }
/* Integer pixel positions so glyphs don't snap off the box centre */
.topbar { align-items: flex-start !important; padding-top: 5px !important; }
.mobile-nav { align-items: center !important; padding-top: 0 !important; padding-bottom: 0 !important; height: 49px !important; box-sizing: border-box; }

/* Nav icons: optical size + alignment with 13px label */
.nav-item .icon-slot { display: grid; place-items: center; }

/* Clickable affordances */
.link-btn { font-size: 13px; font-weight: 500; color: var(--blue); padding: 0; border-radius: 4px; }
.link-btn:hover { text-decoration: underline; text-underline-offset: 3px; }
.link-btn:focus-visible, .inbox-item:focus-visible, .rec-card:focus-visible, .cat-card:focus-visible,
.btn-text:focus-visible, .composer .btn-send:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.inv-link-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.rec-card .title, .cat-card .title, .prod-name { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

/* Recommended: 4 across, same card size as All products at every width */
.rec-rail, .catalog-grid:not(.is-list) { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; gap: 32px 20px !important; }

/* 4px grid clean-up in r13 layer */
.inbox-item { padding: 12px !important; }
.bubble { padding: 12px 16px !important; }
.order-context { padding: 16px !important; }
.card-body { padding: 12px 0 0 !important; }

/* Template edit */
.tpl-qty-edit { display: none; align-items: center; gap: 4px; justify-content: flex-end; }
.tpl-card.is-editing .tpl-qty-read { display: none; }
.tpl-card.is-editing .tpl-qty-edit { display: inline-flex; }
.tpl-qty-edit button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); color: var(--ink); }
.tpl-qty-edit button:hover { background: var(--band); }
.tpl-qty-edit .n { min-width: 40px; text-align: center; color: var(--ink); font-weight: 500; }

/* Composer input */
.composer input.field { outline: none; color: var(--ink); }
.composer input.field::placeholder { color: var(--faint); }
.composer:focus-within { border-color: var(--blue); }
.msg.me.is-new .bubble { animation: toastIn .2s ease-out; }

/* Invoice modal */
.inv-modal { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; }
.inv-modal[hidden] { display: none; }
.im-scrim { position: absolute; inset: 0; background: rgba(26,26,26,.32); }
.im-panel {
  position: relative; width: min(720px, calc(100vw - 48px)); max-height: calc(100vh - 96px); overflow: auto;
  background: #fff; border-radius: 16px; padding: 24px 28px; box-shadow: 0 24px 64px rgba(26,26,26,.18);
}
.im-head { display: flex; align-items: center; gap: 12px; }
.im-head > div { flex: 1; }
.im-head h2 { margin: 0; font-size: 24px; font-weight: 500; }
.im-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
.im-close { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.im-close:hover { background: var(--band); }
.im-close svg { width: 16px; height: 16px; fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.im-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 24px; padding: 16px; background: var(--band); border-radius: 12px; }
.im-meta .k { font-size: 12px; color: var(--faint); }
.im-meta .v { font-size: 13px; font-weight: 500; margin-top: 4px; }
.im-meta .s { font-size: 12px; color: var(--muted); margin-top: 4px; }
.im-lines { margin-top: 16px; }
.im-line { display: grid; grid-template-columns: 44px 1fr 140px 112px; gap: 16px; align-items: center; padding: 8px 0; }
.im-q { font-size: 13px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.im-a { font-size: 14px; font-weight: 500; text-align: right; font-variant-numeric: tabular-nums; }
.im-sum { margin-top: 12px; padding-top: 12px; display: flex; flex-direction: column; gap: 8px; margin-left: auto; width: 280px; font-size: 13px; color: var(--muted); }
.im-sum > div { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.im-sum .im-total { color: var(--ink); font-size: 14px; font-weight: 500; padding-top: 8px; }
.im-actions { display: flex; justify-content: flex-end; align-items: center; gap: 16px; margin-top: 24px; }

/* ================= r15 (film pass 10) ================= */
/* Primary hover: plain background darken; no opacity/scale so label and box never shift */
.btn-primary { white-space: nowrap; justify-content: center; transition: background-color 0.15s ease-out; }
.btn-primary:hover { opacity: 1; background: #2433c4; }
.btn-primary:active { transform: none; opacity: 1; background: #1a2599; }
.btn-primary:disabled:hover { background: var(--blue); }
#qoAddAllBtn { min-width: 121px; }
/* Cart pill: Lucide shopping-cart, 16px, optically centred on the label */
.cart-pill .cart-icon { flex-shrink: 0; margin-right: -2px; transform: translateY(-0.5px); color: var(--ink); }
/* Net 30 meter: one track, one fill (used credit incl. this order) */
.credit-bar[data-credit-bar] {
  background-image: linear-gradient(to right, var(--blue) 0, var(--blue) var(--credit-order-end, 0%), var(--wash) var(--credit-order-end, 0%), var(--wash) 100%);
}
/* Upload CSV: quiet secondary next to search */
.search-row .btn-upload { height: 36px; padding: 0 14px; font-size: 13px; color: var(--muted); font-weight: 500; }
.search-row .btn-upload:hover { color: var(--ink); }

/* ================= r16 (film pass 13) ================= */
/* Saved template: choose Add to order or Replace order (popover under the template card, overlays; no reflow) */
.rail-card { position: relative; overflow: visible; }
.qo-rail { overflow: visible; }
.rail-item.is-open { background: var(--band); }
.rail-item.is-open .rail-action { opacity: 0; } /* p14: while the Add to order / Replace order popover is open, it is the only action */
.tpl-pop {
  /* p18: fixed overlay so opening never grows rail scrollHeight or shifts siblings */
  position: fixed; z-index: 80;
  display: flex; flex-direction: column; gap: 6px; padding: 8px;
  box-sizing: border-box;
  background: #fff; border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 8px 20px rgba(26, 26, 26, 0.08);
  transform: none !important;
}
.tpl-pop[hidden] { display: none !important; }
.tpl-pop .tpl-choice {
  height: 32px; width: 100%; padding: 0 12px; font-size: 13px; justify-content: center;
  box-sizing: border-box; transform: none !important;
  transition: background-color 0.15s ease-out, border-color 0.15s ease-out, color 0.15s ease-out !important;
}
.tpl-pop .tpl-choice:hover,
.tpl-pop .tpl-choice:active,
.tpl-pop .btn-primary:active,
.tpl-pop .btn-outline:active {
  transform: none !important;
  opacity: 1 !important;
}
.order-row[hidden] { display: none !important; }
/* Press feedback by colour only (no scale / no blue tint), so nothing moves on click */
.cart-pill:active, .account-chip:active, .rail-item:active, .btn-outline:active, .btn-primary:active { transform: none; }
.cart-pill:active { background: var(--wash); }
.rail-item:active { background: var(--wash); }
.btn-outline:active { background: var(--wash); }
.search-result:active { background: var(--wash); }
/* Shift fixes: "Added to cart" overlays left of the button (footer height + button position never change) */
.order-footer .inline-success { position: absolute; right: 165px; top: 50%; transform: translateY(-50%); margin: 0; white-space: nowrap; }

/* ================= r18 (film pass 18) ================= */
/* Cart pill: icon + total only; hugs content; width eases when the total/badge change */
.cart-pill {
  width: max-content !important;
  min-width: 0 !important;
  max-width: none !important;
  padding: 0 12px !important;
  gap: 8px !important;
  transition: background-color 0.15s ease-out, border-color 0.15s ease-out, width 0.3s ease-out !important;
  will-change: width;
}
.cart-pill:has(.count-chip[hidden]) { padding-right: 12px !important; }
.cart-pill .cart-amount-display {
  min-width: 0 !important;
  justify-content: flex-start;
  display: inline-flex !important;
  visibility: visible !important;
}
.cart-pill .cart-amount-display[hidden] {
  display: inline-flex !important;
  visibility: visible !important; /* empty state still shows $0.00 */
}
.cart-pill .count-chip[hidden] { display: none !important; }
.cart-pill .count-chip {
  transform-origin: center;
  transition: transform 0.16s ease-out, opacity 0.16s ease-out;
}
.cart-pill .count-chip.chip-in {
  animation: chipIn 0.16s ease-out;
}
@keyframes chipIn {
  from { transform: scale(0.6); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
.topbar-right { transition: none; }
/* Place order → Order placed shared-element morph */
[data-confirm-panel].is-morphing {
  will-change: transform;
  transform-origin: top left;
}
[data-cart-summary].is-morph-exit {
  opacity: 0;
  transition: opacity 0.2s ease-in;
}

/* ================= r20 (film pass 20) ================= */
/* Template row must not move when Add/Replace opens.
   Cause that still could: focus outline-offset outside the row (scroll-into-view),
   a popover that participates in flow, scroll anchoring, or a border/transform on :active.
   The ring is inset, the popover is fixed, and the row's box is locked. */
.rail-item {
  /* keep margin: 0 -6px from the row rule — zeroing it slides the row 6px right */
  border: 0 !important;
  transform: none !important;
  scroll-margin: 0;
  overflow-anchor: none;
}
.rail-card, .qo-rail { overflow-anchor: none; }
.tpl-pop {
  position: fixed !important;
  margin: 0 !important;
  transform: none !important;
}
/* Cart pill and Place order: colour only. Background does not transition,
   so a hover/active class cannot restart a fade. Width may ease once. */
.cart-pill,
.cart-pill:hover,
.cart-pill:active,
.cart-pill:focus,
.cart-pill:focus-visible {
  transform: none !important;
  transition: width 0.3s ease-out !important;
}
.cart-pill:hover { background: var(--band) !important; }
.cart-pill:active { background: var(--wash) !important; }
.cart-pill .count-chip,
.cart-pill.bump .cart-amount-display,
.cart-pill.bump .count-chip {
  transition: none !important;
  animation: none !important;
}
.btn-primary,
.btn-primary:hover,
.btn-primary:active,
.btn-primary:focus,
.btn-primary:focus-visible {
  transform: none !important;
  opacity: 1 !important;
  transition: none !important;
}
.btn-primary:hover { background: #2433c4 !important; }
.btn-primary:active { background: #1a2599 !important; }
.btn-primary:focus-visible {
  outline: 2px solid var(--blue);
  outline-offset: -3px;
}

/* ================= r21 (film pass 21) ================= */
/* Match kit was 72.078px tall (fractional line boxes). The popover is placed
   at the row's bottom, so that fraction sat on a device-pixel boundary and the
   whole menu jumped 1px. Integer line boxes lock the row at 72px. */
.rail-item {
  box-sizing: border-box;
  height: 72px;
}
.rail-item .rail-id,
.rail-item .name,
.rail-item .meta { line-height: 16px; }
/* Add / Replace: colour only. Border width and weight stay put, so hover
   cannot change the button's box or the menu's edges. */
.tpl-pop .tpl-choice,
.tpl-pop .tpl-choice:hover,
.tpl-pop .tpl-choice:active {
  height: 32px !important;
  box-sizing: border-box !important;
  font-weight: 500 !important;
  border-width: 1px !important;
  transform: none !important;
  transition: none !important;
  opacity: 1 !important;
}
.tpl-pop .btn-primary,
.tpl-pop .btn-primary:hover,
.tpl-pop .btn-primary:active { border-color: transparent !important; }

/* ================= r22 (film pass 22) ================= */
/* Place order and Order placed are one card: same box, padding, and radius
   so a hard cut between them reads as the same chrome. The summary is the
   shorter card; the shared height is the confirmation's box, and the extra
   space stays below Place order. */
.cart-layout {
  grid-template-columns: minmax(0, 1fr) 480px;
}
.cart-summary,
.confirm-panel {
  width: 480px !important;
  max-width: 480px !important;
  min-width: 480px !important;
  height: 340px !important;
  min-height: 340px !important;
  max-height: 340px !important;
  padding: 24px !important;
  border-radius: 12px !important;
  border-width: 1px !important;
  box-sizing: border-box !important;
}
</style>
</head>
<body>
  <div id="devSwitcher">
    <span class="label">Screens</span>
    <button type="button" class="tab-btn active" data-tab="qo-desktop">Quick Order</button>
    <button type="button" class="tab-btn" data-tab="qo-search">QO search</button>
    <button type="button" class="tab-btn" data-tab="catalog">Catalog</button>
    <button type="button" class="tab-btn" data-tab="templates">Saved orders</button>
    <button type="button" class="tab-btn" data-tab="orders">Orders</button>
    <button type="button" class="tab-btn" data-tab="cart">Cart</button>
    <button type="button" class="tab-btn" data-tab="confirmation">Confirmation</button>
    <button type="button" class="tab-btn" data-tab="invoices">Invoices &amp; Terms</button>
    <button type="button" class="tab-btn" data-tab="messages">Messages</button>
    <button type="button" class="tab-btn" data-tab="qo-mobile">Quick Order Mobile</button>
    <button type="button" class="tab-btn" data-tab="states">States</button>
  </div>

  <div id="app"></div>
  <div class="toast" data-toast hidden aria-live="polite">
    <div class="toast-copy">
      <div class="toast-title" data-toast-title>Added to cart</div>
      <div class="toast-body" data-toast-body></div>
    </div>
    <button type="button" class="toast-undo" data-toast-undo hidden>Undo</button>
  </div>

  <script src="ledger.js"></script>
  <script>
(function () {
  var L = window.JOOLA_LEDGER;
  if (!L) throw new Error("JOOLA_LEDGER missing");

  var money = L.money;
  var cartUi = {
    count: L.cartCount,
    total: 0,
    added: false,
  };
  var catalogView = "cards";
  var NAV = [
    { id: "qo-desktop", label: "Quick order", icon: "order" },
    { id: "catalog", label: "Catalog", icon: "catalog" },
    { id: "templates", label: "Saved orders", icon: "templates" },
    { id: "orders", label: "Orders", icon: "orders" },
    { id: "invoices", label: "Invoices", icon: "invoices" },
    { id: "messages", label: "Messages", icon: "messages" },
  ];

  function icon(name) {
    /* Lucide-style 24 viewBox, 1.5 stroke, 16px render */
    var paths = {
      order: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/>',
      catalog: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
      templates: '<path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/>',
      orders: '<path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><rect x="3" y="5" width="2" height="2" rx="0.4"/><rect x="3" y="11" width="2" height="2" rx="0.4"/><rect x="3" y="17" width="2" height="2" rx="0.4"/>',
      invoices: '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
      messages: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
      external: '<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
      close: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    };
    return (
      '<span class="icon-slot" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24">' +
      (paths[name] || "") +
      "</svg></span>"
    );
  }

  function avatarHtml() {
    var src = L.retailer.logo || L.retailer.avatar || "engage-logo.png";
    return (
      '<div class="retailer-avatar" data-retailer-avatar>' +
      '<img src="' +
      src +
      '" alt="' +
      L.retailer.name +
      '" width="28" height="28">' +
      "</div>"
    );
  }

  function stepIcon(kind) {
    /* Filled bars — equal weight minus/plus, centred in the 36px hit area */
    if (kind === "minus") {
      return (
        '<svg class="step-icon" viewBox="0 0 12 12" aria-hidden="true">' +
        '<rect x="2.25" y="5.25" width="7.5" height="1.5" rx="0.75"/>' +
        "</svg>"
      );
    }
    return (
      '<svg class="step-icon" viewBox="0 0 12 12" aria-hidden="true">' +
      '<rect x="2.25" y="5.25" width="7.5" height="1.5" rx="0.75"/>' +
      '<rect x="5.25" y="2.25" width="1.5" height="7.5" rx="0.75"/>' +
      "</svg>"
    );
  }

  function calendarIcon() {
    return (
      '<svg class="cal-icon" viewBox="0 0 14 14" aria-hidden="true">' +
      '<rect x="1.5" y="2.5" width="11" height="10" rx="1.5"/>' +
      '<path d="M1.5 5.5h11M4.5 1.5v2.5M9.5 1.5v2.5"/>' +
      "</svg>"
    );
  }

  function joolaMarkHtml(cls) {
    return (
      '<div class="joola-mark' + (cls ? " " + cls : "") + '" data-joola-mark>' +
      '<img src="joola-logo.svg" alt="JOOLA" width="36" height="12">' +
      "</div>"
    );
  }

  function shellOpen(activeTab, cartOverride) {
    var count = cartOverride ? cartOverride.count : cartUi.count;
    var total = cartOverride ? cartOverride.total : cartUi.total;
    var chipClass = "count-chip" + (count >= 10 ? " is-wide" : "");
    var items = NAV.map(function (n) {
      return (
        '<button type="button" class="nav-item' + (n.id === activeTab ? " active" : "") + '" data-tab="' + n.id + '">' +
        icon(n.icon) +
        "<span>" + n.label + "</span>" +
        "</button>"
      );
    }).join("");
    return (
      '<div class="app-shell" data-wholesale-chrome>' +
      '<aside class="sidebar" data-sidebar>' +
      '<div class="sidebar-brand">' +
      '<img src="joola-logo.svg" alt="JOOLA" width="120" height="38">' +
      '<span class="wholesale-chip" data-wholesale-chip>Wholesale</span>' +
      "</div>" +
      '<nav class="sidebar-nav">' + items + "</nav>" +
      '<div class="sidebar-footer">' +
      '<a class="sidebar-store" data-store-link href="' +
      (L.storeUrl || "https://joola.com") +
      '" target="_blank" rel="noopener">' +
      icon("external") +
      "<span>Back to joola.com store</span></a>" +
      "</div>" +
      "</aside>" +
      '<div class="main-column">' +
      '<header class="topbar" data-topbar>' +
      '<div class="topbar-right">' +
      '<button type="button" class="account-chip" data-account-chip>' +
      avatarHtml() +
      '<div class="account-meta"><div class="name">' + L.retailer.name + '</div><div class="role">' + L.retailer.buyer + "</div></div>" +
      "</button>" +
      '<button type="button" class="cart-pill" data-tab="cart" data-cart-pill aria-label="Cart, ' + money(total) + '">' +
      '<svg class="cart-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>' +
      '<span class="cart-amount-display" data-cart-total>' + money(total) + "</span>" +
      '<span class="' + chipClass + '" data-cart-count' + (count === 0 ? " hidden" : "") + ">" +
      (count === 0 ? "" : count) +
      "</span>" +
      "</button>" +
      "</div></header>"
    );
  }

  function moneyWhole(n) { return "$" + Math.round(n).toLocaleString("en-US"); }

  function creditMeterHtml(opts) {
    opts = opts || {};
    var showOrder = opts.includeOrder !== false;
    var usedEnd = showOrder ? L.credit.priorPct : L.credit.pct;
    var orderEnd = showOrder ? L.credit.priorPct + L.credit.orderPct : L.credit.pct;
    var leftLabel = L.terms + " credit";
    var priorAvail = L.credit.priorAvailable != null ? L.credit.priorAvailable : L.credit.available;
    var rightLabel = showOrder
      ? money(L.credit.afterOrder) + " left of " + moneyWhole(L.credit.limit)
      : money(L.credit.available) + " left of " + moneyWhole(L.credit.limit);
    var tip =
      "<div class=\"credit-tip\" data-credit-tip role=\"tooltip\">" +
      "<div><strong>Used</strong> " +
      money(showOrder ? L.credit.priorUsed : L.credit.used) +
      "</div>" +
      (showOrder
        ? "<div><strong>This order</strong> " + money(L.credit.thisOrder) + "</div>"
        : "") +
      "<div><strong>Left</strong> " +
      money(showOrder ? L.credit.afterOrder : L.credit.available) +
      "</div></div>";
    return (
      '<div class="credit-meter" data-credit-meter data-credit-after tabindex="0">' +
      '<div class="credit-meter-label">' +
      "<span>" + leftLabel + "</span>" +
      '<span class="avail" data-credit-available>' + rightLabel + "</span>" +
      "</div>" +
      tip +
      '<div class="credit-bar" data-credit-bar data-credit-fill style="' +
      "--credit-used-end:" + usedEnd + "%;--credit-order-end:" + orderEnd + "%;" +
      '" aria-label="' +
      leftLabel +
      ": " +
      rightLabel +
      '"></div></div>'
    );
  }

  /** Cart / invoices / messages show the open order in chrome; QO starts empty until Add all. */
  function filledCart() {
    return { count: L.cartCountAfterAdd, total: L.orderTotal };
  }

  /** Confirmation: order placed — chrome cart is empty. */
  function emptyCart() {
    return { count: 0, total: 0 };
  }

  function shellClose() {
    return "</div></div>";
  }

  function unitPriceHtml(product, qty) {
    var unit = L.priceAt(product, qty);
    var next = L.nextTier(product, qty);
    /** Buyer sees wholesale unit + next-break hint only — no MSRP strikethrough noise. */
    var hint = next
      ? '<div class="hint">Buy ' + next.min + '+ for <b>' + money(next.price) + '</b><span class="ea">ea</span></div>'
      : "";
    return (
      '<div class="price-block">' +
      '<div class="unit" data-unit-price="' + unit + '" data-display-price>' +
      money(unit) +
      '<span class="ea">ea</span></div>' +
      hint +
      "</div>"
    );
  }

  function qtyGroupHtml(line) {
    var p = L.products[line.productId];
    var presetVals = (p && p.presets ? p.presets : []).slice(0, 3);
    var presets = "";
    if (presetVals.length) {
      var bestMin = p.tiers[p.tiers.length - 1].min;
      presets =
        '<div class="qty-presets" data-qty-presets>' +
        presetVals
          .map(function (n) {
            var setAttr =
              line.productId === "perseus"
                ? ' data-set-perseus="' + n + '"'
                : ' data-set-qty="' + n + '"';
            return (
              '<button type="button" class="' +
              (n === line.qty ? "on" : "") +
              '"' +
              setAttr +
              ' title="' +
              (n === bestMin ? "Best unit price from " + n + "+" : "") +
              '">' +
              n +
              "</button>"
            );
          })
          .join("") +
        "</div>";
    }
    return (
      '<div class="qty-group' +
      (presetVals.length ? " has-presets" : "") +
      '" data-qty-group data-product="' +
      line.productId +
      '">' +
      '<div class="qty-stepper" data-qty-stepper>' +
      '<button type="button" data-action="dec" aria-label="Decrease">' +
      stepIcon("minus") +
      "</button>" +
      '<div class="qty" data-qty="' +
      line.qty +
      '">' +
      line.qty +
      "</div>" +
      '<button type="button" data-action="inc" aria-label="Increase">' +
      stepIcon("plus") +
      "</button>" +
      "</div>" +
      presets +
      "</div>"
    );
  }

  function orderTableHtml() {
    var rows = "";
    L.orderLines.forEach(function (line) {
      var p = L.products[line.productId];
      var amount = L.lineAmount(line);
      var fulfill = L.lineFulfillment[line.productId] || { warehouse: "CA", availability: "In stock" };
      var stockNote =
        fulfill.availability && !/^in stock$/i.test(fulfill.availability)
          ? '<div class="avail-tag">' + fulfill.availability + "</div>"
          : "";
      var rowClass =
        "order-row" +
        (p.presets && p.presets.length ? " has-presets" : "") +
        (stockNote ? " has-avail" : "");
      rows +=
        '<div class="' +
        rowClass +
        '" data-order-row data-sku="' +
        p.sku +
        '" data-buyer-price="' +
        p.buyerPrice +
        '" data-product="' +
        p.id +
        '">' +
        '<img class="thumb" src="' +
        p.image +
        '" alt="' +
        p.name +
        '" width="36" height="36" data-product-media>' +
        '<div><div class="prod-name">' +
        p.fullName +
        '</div><div class="prod-sku">SKU ' +
        p.sku +
        "</div>" +
        stockNote +
        "</div>" +
        unitPriceHtml(p, line.qty) +
        '<div class="qty-cell">' +
        qtyGroupHtml(line) +
        "</div>" +
        '<div class="line-total end" data-line-total="' +
        amount +
        '">' +
        money(amount) +
        "</div>" +
        '<div aria-hidden="true"></div>' +
        "</div>";
    });

    return (
      '<div class="order-table" data-order-table>' +
      '<div class="order-head" data-order-head>' +
      "<div></div><div>Product</div><div class=\"end\">Price</div><div class=\"qty-h end\">Quantity</div><div class=\"end\">Line total</div><div></div>" +
      "</div>" +
      rows +
      "</div>"
    );
  }

  function qoRailHtml() {
    /* One compact Reorder rail: recent orders + saved templates */
    var items = [];
    L.recentOrders.forEach(function (o) {
      items.push({
        id: o.id,
        name: o.label,
        left: o.when + ", " + o.lines + (o.lines === 1 ? " line" : " lines"),
        amt: money(o.total),
      });
    });
    L.templates.forEach(function (t) {
      items.push({
        id: "Saved",
        tplId: t.id,
        name: t.name,
        left: t.detail,
        amt: "",
      });
    });
    var body = items
      .map(function (it) {
        return (
          '<button type="button" class="rail-item" data-rail-add' + (it.tplId ? ' data-template="' + it.tplId + '" aria-haspopup="menu"' : "") + ">" +
          '<span class="rail-copy">' +
          (it.id ? '<span class="rail-id">' + it.id + "</span>" : "") +
          '<span class="name">' +
          it.name +
          '</span><span class="meta"><span class="meta-left">' +
          it.left +
          "</span>" +
          (it.amt ? '<span class="meta-amt">' + it.amt + "</span>" : "") +
          "</span></span>" +
          '<span class="rail-action">Add</span>' +
          "</button>"
        );
      })
      .join("");
    return (
      '<aside class="qo-rail" data-qo-rail>' +
      '<div class="rail-card"><h3 class="label-quiet">Reorder</h3>' +
      body +
      '<div class="tpl-pop" data-tpl-pop role="menu" hidden>' +
      '<button type="button" class="btn-primary tpl-choice" data-tpl-apply="add" role="menuitem">Add to order</button>' +
      '<button type="button" class="btn-outline tpl-choice" data-tpl-apply="replace" role="menuitem">Replace order</button>' +
      "</div>" +
      "</div>" +
      "</aside>"
    );
  }

  function itemCountLabel(n) {
    return n + (n === 1 ? " line" : " lines");
  }

  function footerHtml() {
    var n = L.orderLines.length;
    var cta = "Add " + itemCountLabel(n) + " to cart";
    return (
      '<div class="order-footer" data-order-footer>' +
      '<div class="footer-stack">' +
      '<div class="meta" data-line-count>' +
      itemCountLabel(n) +
      "</div>" +
      '<div class="total" id="qoFooterTotal" data-order-total>' +
      money(L.orderTotal) +
      "</div>" +
      "</div>" +
      '<button type="button" class="btn-primary" id="qoAddAllBtn" data-add-all>' +
      cta +
      "</button>" +
      "</div>"
    );
  }

  function searchHtml(opts) {
    opts = opts || {};
    var open = !!opts.open;
    var typed = L.searchQuery || "Perseus";
    var q = typed.toLowerCase();
    var matches = Object.keys(L.products)
      .map(function (id) {
        return L.products[id];
      })
      .filter(function (p) {
        return (
          p.name.toLowerCase().indexOf(q) !== -1 ||
          p.fullName.toLowerCase().indexOf(q) !== -1 ||
          String(p.sku).indexOf(q) !== -1
        );
      });
    var results =
      '<div class="search-results' +
      (open ? "" : " is-closed") +
      '" data-search-results' +
      (open ? "" : " hidden") +
      ">" +
      matches
        .map(function (p) {
          return (
            '<div class="search-result" data-search-result data-sku="' +
            p.sku +
            '" data-buyer-price="' +
            p.buyerPrice +
            '">' +
            '<img src="' +
            p.image +
            '" alt="' +
            p.name +
            '" width="28" height="28">' +
            '<div><div class="title">' +
            p.name +
            '</div><div class="meta"><span>SKU ' +
            p.sku +
            ' </span><span class="meta-price">' +
            money(p.buyerPrice) +
            "</span></div></div></div>"
          );
        })
        .join("") +
      "</div>";
    return (
      '<div class="search-row">' +
      '<div class="search-wrap">' +
      '<div class="search-field has-value" data-search-field data-search-value="' +
      typed +
      '">' +
      '<span class="placeholder">Search name or SKU</span>' +
      '<span class="value">' +
      typed +
      "</span>" +
      "</div>" +
      results +
      "</div>" +
      '<button type="button" class="btn-outline btn-upload" data-upload-csv>Upload CSV</button>' +
      "</div>"
    );
  }

  function screenQuickOrder() {
    return (
      '<section class="screen active" data-screen="qo-desktop">' +
      shellOpen("qo-desktop") +
      '<div class="page">' +
      "<h1>Quick order</h1>" +
      searchHtml({ open: false }) +
      '<div class="qo-layout">' +
      '<div class="qo-main">' +
      orderTableHtml() +
      "</div>" +
      qoRailHtml() +
      "</div>" +
      "</div>" +
      footerHtml() +
      shellClose() +
      "</section>"
    );
  }

  /** Dev screen: name search open for film / critic crops */
  function screenQuickOrderSearch() {
    return (
      '<section class="screen" data-screen="qo-search">' +
      shellOpen("qo-desktop") +
      '<div class="page">' +
      "<h1>Quick order</h1>" +
      searchHtml({ open: true }) +
      '<div class="qo-layout">' +
      '<div class="qo-main">' +
      orderTableHtml() +
      "</div>" +
      qoRailHtml() +
      "</div>" +
      "</div>" +
      footerHtml() +
      shellClose() +
      "</section>"
    );
  }

  function screenCatalog() {
    var rec = L.recommended
      .map(function (id) {
        var p = L.products[id];
        var meta = L.recommendedMeta[id] || { reason: "Recommended", detail: "" };
        return (
          '<div class="rec-card" data-rec-card data-sku="' +
          p.sku +
          '" data-buyer-price="' +
          p.buyerPrice +
          '">' +
          '<div class="media" data-product-media><img src="' +
          p.image +
          '" alt="' +
          p.name +
          '"></div>' +
          '<div class="card-body">' +
          '<div class="title">' +
          p.fullName +
          "</div>" +
          '<div class="price-row"><span class="price" data-display-price>' +
          money(p.buyerPrice) +
          '</span><span class="msrp">' +
          money(p.msrp) +
          "</span></div>" +
          '<div class="why">' +
          meta.reason +
          "</div>" +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    var allIds = L.recommended.concat(L.catalogExtra);
    var grid = allIds
      .map(function (id) {
        var p = L.products[id];
        return (
          '<div class="cat-card" data-catalog-card data-sku="' +
          p.sku +
          '" data-buyer-price="' +
          p.buyerPrice +
          '">' +
          '<div class="media" data-product-media><img src="' +
          p.image +
          '" alt="' +
          p.name +
          '"></div>' +
          '<div class="card-body">' +
          '<div class="title">' +
          p.fullName +
          "</div>" +
          '<div class="price-row"><span class="price" data-display-price>' +
          money(p.buyerPrice) +
          '</span><span class="msrp">' +
          money(p.msrp) +
          "</span></div>" +
          '<div class="moq">Min. order ' +
          p.moq +
          "</div>" +
          "</div>" +
          "</div>"
        );
      })
      .join("");

    return (
      '<section class="screen" data-screen="catalog">' +
      shellOpen("catalog") +
      '<div class="page">' +
      "<h1>Catalog</h1>" +
      '<p class="lede">Products available to ' +
      L.retailer.name +
      ".</p>" +

  function screenCart() {
    var lines = L.orderLines
      .map(function (line) {
        var p = L.products[line.productId];
        var amount = L.lineAmount(line);
        var fulfill = L.lineFulfillment[line.productId] || { warehouse: "CA", availability: "In stock" };
        var hasAvail =
          fulfill.availability && !/^in stock$/i.test(fulfill.availability);
        var avail = hasAvail
          ? '<div class="avail-tag">' + fulfill.availability + "</div>"
          : "";
        return (
          '<div class="cart-line' +
          (hasAvail ? " has-avail" : "") +
          '" data-cart-line data-sku="' +
          p.sku +
          '" data-buyer-price="' +
          p.buyerPrice +
          '">' +
          '<img src="' +
          p.image +
          '" alt="' +
          p.name +
          '" width="36" height="36">' +
          '<div class="cart-prod"><div class="prod-name">' +
          p.fullName +
          '</div><div class="prod-sku">SKU ' +
          p.sku +
          "</div>" +
          avail +
          "</div>" +
          '<div class="cart-money">' +
          '<div class="cart-unit">' +
          line.qty +
          " × " +
          money(L.priceAt(p, line.qty)) +
          "</div>" +
          '<div class="line-total" data-line-total="' +
          amount +
          '">' +
          money(amount) +
          "</div>" +
          "</div>" +
          '<button type="button" class="line-remove" data-line-remove aria-label="Remove ' +
          p.name +
          '">' +
          '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>' +
          "</button>" +
          "</div>"
        );
      })
      .join("");
    var selectedShip =
      L.shipTos.find(function (a) {
        return a.id === L.shipToId;
      }) || L.shipTos[0];
    var recentAvg = L.recentAvg || 0;
    var sizeRatio = recentAvg > 0 ? L.cartTotal / recentAvg : 0;
    var largerThanUsual = recentAvg > 0 && sizeRatio > 3;
    var overCredit = L.credit.priorUsed + L.cartTotal > L.credit.limit + 0.009;
    var notices = "";
    if (overCredit) {
      notices +=
        '<div class="cart-notice is-warn" data-credit-hold>This order exceeds remaining Net 30 credit. Your rep will need to approve before it ships.</div>';
    } else if (largerThanUsual) {
      var mult = Math.round(sizeRatio);
      if (mult < 4) mult = 4;
      notices +=
        '<div class="cart-notice" data-size-note>About ' +
        mult +
        "× your usual order. Check quantities.</div>";
    }
    return (
      '<section class="screen" data-screen="cart">' +
      shellOpen("cart", filledCart()) +
      '<div class="page">' +
      "<h1>Cart</h1>" +
      '<div class="cart-layout" data-cart-layout>' +
      '<div class="cart-main">' +
      '<div class="cart-lines">' + lines + "</div>" +
      '<div class="cart-checkout" data-cart-checkout>' +
      '<div class="cart-field" data-field="po">' +
      '<label for="cart-po">Your PO # <span style="font-weight:400;color:var(--faint)">(optional)</span></label>' +
      '<input id="cart-po" type="text" placeholder="e.g. ENG-9812" value="' +
      (L.customerPo || "") +
      '" autocomplete="off" data-po-input>' +
      '<div class="po-warn" data-po-warn>This PO matches an open invoice. Confirm it is not a duplicate.</div>' +
      "</div>" +
      shipCardHtml(selectedShip) +
      '<div class="need-by" data-field="need-by" data-need-by>' +
      '<label class="need-by-row" for="need-by-check">' +
      '<input type="checkbox" id="need-by-check" data-need-by-check>' +
      "<span>Need it by</span>" +
      "</label>" +
      '<div class="date-control" id="need-by-date" data-need-by-date hidden>' +
      calendarIcon() +
      '<span class="date-value">' +
      L.shipDate +
      "</span>" +
      "</div>" +
      '<div class="hint">Your rep confirms timing.</div>' +
      "</div>" +
      '<div class="cart-returns" data-returns-link>Need a replacement or warranty? <a href="#returns">Request a return</a></div>' +
      "</div></div>" +
      '<aside class="cart-summary" data-cart-summary>' +
      '<div class="sum-row"><span>Subtotal</span><span data-order-total data-cart-total>' +
      money(L.cartTotal) +
      "</span></div>" +
      '<div class="sum-row"><span>Shipping</span><span>Calculated when it ships</span></div>' +
      '<div class="sum-row"><span>Tax</span><span>Calculated when it ships</span></div>' +
      '<div class="sum-total"><span>Total</span><span class="big" data-order-total>' +
      money(L.cartTotal) +
      "</span></div>" +
      creditMeterHtml({ includeOrder: true }) +
      notices +
      '<button type="button" class="btn-primary" data-place-order data-tab="confirmation">Place order</button>' +
      "</aside></div></div>" +
      shellClose() +
      "</section>"
    );
  }

    if (status === "Processing" || status === "Due") return "Pending";
    return status;
  }

    var past = L.recentOrders.map(function (o) {
      var inv = L.invoices.filter(function (i) { return i.order === o.id; })[0];

        '<div>' + o.id + '</div>' +

  function syncConfirmationFromCart() {
    var cartRoot = document.querySelector('[data-screen="cart"]');
    var conf = document.querySelector('[data-screen="confirmation"]');
    if (!cartRoot || !conf) return;
    var rows = conf.querySelector("[data-confirm-rows]");
    if (!rows) return;
    var poInput = cartRoot.querySelector("[data-po-input]");
    var needCheck = cartRoot.querySelector("[data-need-by-check]");
    var po = ((poInput && poInput.value) || "").trim();
    var poRow = conf.querySelector("[data-confirm-po]");
    if (po) {
      if (!poRow) {
        poRow = document.createElement("div");
        poRow.className = "row";
        poRow.setAttribute("data-confirm-po", "");
        poRow.innerHTML =
          '<span class="k">Your PO</span><span class="v" data-customer-po></span>';
        var orderRow = rows.querySelector("[data-order-id]");
        var insertAfter = orderRow && orderRow.closest(".row");
        if (insertAfter && insertAfter.nextSibling) {
          rows.insertBefore(poRow, insertAfter.nextSibling);
        } else {
          rows.appendChild(poRow);
        }
      }
      var poVal = poRow.querySelector("[data-customer-po]");
      if (poVal) poVal.textContent = po;
    } else if (poRow) {
      poRow.remove();
    }
    var needRow = conf.querySelector("[data-confirm-needby]");
    if (needCheck && needCheck.checked) {
      if (!needRow) {
        needRow = document.createElement("div");
        needRow.className = "row";
        needRow.setAttribute("data-confirm-needby", "");
        needRow.innerHTML =
          '<span class="k">Need by</span><span class="v" data-needby-value>' +
          L.shipDate +
          "</span>";
        var shipRow = null;
        rows.querySelectorAll(".row").forEach(function (r) {
          if (/Ship to/i.test((r.querySelector(".k") || {}).textContent || "")) shipRow = r;
        });
        if (shipRow && shipRow.nextSibling) rows.insertBefore(needRow, shipRow.nextSibling);
        else rows.appendChild(needRow);
      }
    } else if (needRow) {
      needRow.remove();
    }
  }

  function syncToastHidden() {
    var toast = document.querySelector("[data-toast]");
    if (!toast) return;
    if (!toast.classList.contains("show")) toast.setAttribute("hidden", "");
  }

  function hideToast() {
    var toast = document.querySelector("[data-toast]");
    if (!toast) return;
    toast.classList.remove("show");
    toast.setAttribute("hidden", "");
    var undo = toast.querySelector("[data-toast-undo]");
    if (undo) {
      undo.setAttribute("hidden", "");
      undo.onclick = null;
    }
    showToast._undo = null;
  }

  function showToast(body, opts) {
    opts = opts || {};
    var toast = document.querySelector("[data-toast]");
    if (!toast) return;
    var titleEl = toast.querySelector("[data-toast-title]");
    var bodyEl = toast.querySelector("[data-toast-body]");
    var undo = toast.querySelector("[data-toast-undo]");
    if (titleEl) titleEl.textContent = opts.title || "Added to cart";
    if (bodyEl) bodyEl.textContent = body || "";
    if (undo) {
      if (opts.onUndo) {
        undo.removeAttribute("hidden");
        undo.onclick = function () {
          clearTimeout(showToast._t);
          opts.onUndo();
          hideToast();
        };
        showToast._undo = opts.onUndo;
      } else {
        undo.setAttribute("hidden", "");
        undo.onclick = null;
        showToast._undo = null;
      }
    }
    toast.removeAttribute("hidden");
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(hideToast, opts.ms || 3200);
  }

  function bumpCartPills() {
    document.querySelectorAll("[data-cart-pill]").forEach(function (pill) {
      pill.classList.remove("bump");
      void pill.offsetWidth;
      pill.classList.add("bump");
    });

  function syncCartCountChip(el, count, animateIn) {
    if (!el) return;
    if (count === 0) {
      el.setAttribute("hidden", "");
      el.textContent = "";
      el.classList.remove("is-wide", "chip-in");
    } else {
      var wasHidden = el.hasAttribute("hidden");
      el.removeAttribute("hidden");
      el.textContent = String(count);
      el.classList.toggle("is-wide", count >= 10);
      if (animateIn && wasHidden) {
        el.classList.remove("chip-in");
        void el.offsetWidth;
        el.classList.add("chip-in");
      }
    }
  }

  /** p18: measure → set explicit width → ease to new content width (hugs $0.00 / filled totals). */
  function animateCartPillWidths() {
    document.querySelectorAll("[data-cart-pill]").forEach(function (pill) {
      var from = pill.getBoundingClientRect().width;
      pill.style.transition = "none";
      pill.style.width = "max-content";
      var to = pill.getBoundingClientRect().width;
      pill.style.width = from.toFixed(2) + "px";
      void pill.offsetWidth;
      pill.style.transition = "width 0.3s ease-out";
      pill.style.width = to.toFixed(2) + "px";
      var done = function () {
        pill.style.width = "max-content";
        pill.removeEventListener("transitionend", done);
      };
      pill.addEventListener("transitionend", done);
    });
  }

  function applyAddAll() {
    cartUi.count = L.cartCountAfterAdd;
    cartUi.total = L.orderTotal;
    cartUi.added = true;
    L.cartCount = cartUi.count;
    document.querySelectorAll("[data-cart-count]").forEach(function (el) {
      syncCartCountChip(el, cartUi.count, true);

  function flashJustAddedRow(row) {

    row.classList.add("is-just-added");

    row._justAddedT = setTimeout(function () {
      row.classList.remove("is-just-added");

  /** FLIP morph: cart summary box → confirmation panel (~0.45s ease-in-out). */
  function morphPlaceOrder() {
    var cartRoot = document.querySelector('[data-screen="cart"].active') || document.querySelector('[data-screen="cart"]');
    var summary = cartRoot && cartRoot.querySelector("[data-cart-summary]");
    if (!summary) {
      show("confirmation");
      return;
    }
    var from = summary.getBoundingClientRect();
    summary.classList.add("is-morph-exit");
    show("confirmation");
    var panel = document.querySelector('[data-screen="confirmation"].active [data-confirm-panel]');
    if (!panel) return;
    var to = panel.getBoundingClientRect();
    var sx = from.width / Math.max(1, to.width);
    var sy = from.height / Math.max(1, to.height);
    var dx = from.left - to.left;
    var dy = from.top - to.top;
    panel.classList.add("is-morphing");
    panel.style.transition = "none";
    panel.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
    var inner = panel.querySelector(".confirm-title-row, .confirm-lede, .confirm-rows, .confirm-actions");
    var parts = panel.querySelectorAll(".confirm-title-row, .confirm-lede, .confirm-rows, .confirm-actions");
    parts.forEach(function (p) {
      p.style.opacity = "0";
      p.style.transition = "opacity 0.28s ease-in-out 0.12s";
    });
    void panel.offsetWidth;
    requestAnimationFrame(function () {
      panel.style.transition = "transform 0.45s ease-in-out";
      panel.style.transform = "none";
      parts.forEach(function (p) { p.style.opacity = "1"; });
    });
    setTimeout(function () {
      panel.classList.remove("is-morphing");
      panel.style.transition = "";
      panel.style.transform = "";
      parts.forEach(function (p) {
        p.style.opacity = "";
        p.style.transition = "";
      });
      summary.classList.remove("is-morph-exit");
    }, 480);
  }

  function positionTplPop(pop, item) {
    var r = item.getBoundingClientRect();
    pop.style.position = "fixed";
    pop.style.left = Math.round(r.left + 12) + "px";
    pop.style.width = Math.round(Math.max(160, r.width - 24)) + "px";
    pop.style.right = "auto";
    pop.style.top = Math.round(r.bottom + 4) + "px";
  }

  function bind() {
    document.querySelectorAll("[data-tab]").forEach(function (el) {
      el.addEventListener("click", function (ev) {
        if (el.hasAttribute("data-place-order")) {
          ev.preventDefault();
          ev.stopPropagation();
          morphPlaceOrder();
          return;
        }
        var tab = el.getAttribute("data-tab");
        if (tab) show(tab);
      });
    });

    document.querySelectorAll("[data-search-result]").forEach(function (res) {
      res.addEventListener("click", function () {
        var sku = res.getAttribute("data-sku");
        var productId = null;
        Object.keys(L.products).forEach(function (id) {
          if (L.products[id].sku === sku) productId = id;
        });
        if (!productId) return;
        var wasNew = qoLines.indexOf(productId) === -1;
        if (wasNew) qoLines.push(productId);
        syncQo();
        var results = res.closest("[data-search-results]");
        if (results) {
          results.hidden = true;
          results.classList.add("is-closed");
        }
        var row = document.querySelector('[data-order-row][data-product="' + productId + '"]');
        // p19: no blue just-added fill — row appears without a tint flash
        void row;
      });
    });

    document.querySelectorAll("[data-set-perseus]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var n = parseInt(btn.getAttribute("data-set-perseus"), 10);
        if (n) window.__setPerseusQty(n);
      });
    });

    document.querySelectorAll("[data-qty-group] [data-action]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var group = btn.closest("[data-qty-group]");
        if (!group || group.getAttribute("data-product") !== "perseus") return;
        var action = btn.getAttribute("data-action");
        var next = L.perseusQty + (action === "inc" ? 1 : -1);
        if (next < 1) next = 1;
        window.__setPerseusQty(next);
      });
    });

    document.querySelectorAll("[data-template]").forEach(function (item) {
      /* mousedown focus was able to scroll the row by the outside focus ring */
      item.addEventListener("mousedown", function (ev) { ev.preventDefault(); });
      item.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var card = item.closest(".rail-card");
        var pop = card && card.querySelector("[data-tpl-pop]");
        if (!pop) return;
        var open = !pop.hidden && pop.getAttribute("data-for") === item.getAttribute("data-template");
        closeTplPop();
        if (open) return;
        pop.setAttribute("data-for", item.getAttribute("data-template"));
        positionTplPop(pop, item);
        pop.hidden = false;
        item.classList.add("is-open");
      });
    });
    window.addEventListener("resize", function () {
      var openItem = document.querySelector("[data-template].is-open");
      var pop = document.querySelector("[data-tpl-pop]:not([hidden])");
      if (openItem && pop) positionTplPop(pop, openItem);
    });
    document.querySelectorAll("[data-tpl-apply]").forEach(function (b) {
      b.addEventListener("click", function (ev) {
        ev.stopPropagation();
        var pop = b.closest("[data-tpl-pop]");
        applyTemplate(pop.getAttribute("data-for"), b.getAttribute("data-tpl-apply"));
      });
    });
    document.addEventListener("click", closeTplPop);

    document.querySelectorAll("[data-add-all]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (btn.disabled) return;
        applyAddAll();
      });
    });

    document.querySelectorAll("[data-view-toggle] [data-view]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        catalogView = btn.getAttribute("data-view") || "cards";
        var grid = document.querySelector('[data-screen="catalog"] [data-catalog-grid]');
        var toggle = document.querySelector('[data-screen="catalog"] [data-view-toggle]');
        if (grid) grid.classList.toggle("is-list", catalogView === "list");
        if (toggle) {
          toggle.querySelectorAll("[data-view]").forEach(function (b) {
            b.classList.toggle("on", b.getAttribute("data-view") === catalogView);
          });
        }
      });
    });

    document.querySelectorAll("[data-need-by-check]").forEach(function (check) {
      check.addEventListener("change", function () {
        var wrap = check.closest("[data-need-by]");
        var date = wrap && wrap.querySelector("[data-need-by-date]");
        if (!date) return;
        if (check.checked) date.removeAttribute("hidden");
        else date.setAttribute("hidden", "");
      });
    });

    document.querySelectorAll("[data-line-remove]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var line = btn.closest("[data-cart-line]");
        if (!line || line.classList.contains("is-removed")) return;
        var nameEl = line.querySelector(".prod-name");
        var name = (nameEl && nameEl.textContent) || "Line";
        line.classList.add("is-removed");
        showToast(name + " removed", {
          title: "Removed from cart",
          ms: 2800,
          onUndo: function () {
            line.classList.remove("is-removed");
          },
        });
      });
    });

    document.querySelectorAll("[data-po-input]").forEach(function (input) {
      var warn = input.parentElement && input.parentElement.querySelector("[data-po-warn]");
      var openPos = L.invoices
        .filter(function (inv) {
          return inv.open;
        })
        .map(function (inv) {
          return String(inv.order || "").toLowerCase();
        });
      function syncPoWarn() {
        if (!warn) return;
        var v = (input.value || "").trim().toLowerCase();
        var dup = v && openPos.some(function (po) {
          return po && po === v;
        });
        warn.classList.toggle("show", !!dup);
      }
      input.addEventListener("input", syncPoWarn);
      syncPoWarn();
    });

    document.querySelectorAll("[data-ship-card]").forEach(function (card) {
      card.addEventListener("click", function () {
        var field = card.closest('[data-field="ship-to"]');
        var menu = field && field.querySelector("[data-ship-menu]");
        if (!menu) return;
        var open = menu.hasAttribute("hidden");
        if (open) {
          menu.removeAttribute("hidden");
          card.classList.add("is-open");
          card.setAttribute("aria-expanded", "true");
        } else {
          menu.setAttribute("hidden", "");
          card.classList.remove("is-open");
          card.setAttribute("aria-expanded", "false");
        }
      });
    });
    document.querySelectorAll("[data-ship-option]").forEach(function (opt) {
      opt.addEventListener("click", function () {
        var id = opt.getAttribute("data-ship-option");
        if (!id) return;
        L.shipToId = id;
        render();
        show("cart");
      });
    });
  }

  /* Quick order lines the buyer has built (search adds Perseus; templates add or replace). */
  var qoLines = ["perseus"];
  function qoTotals() {
    var lines = L.orderLines.filter(function (l) { return qoLines.indexOf(l.productId) !== -1; });
    var total = Math.round(lines.reduce(function (s, l) { return s + L.lineAmount(l); }, 0) * 100) / 100;
    return { n: lines.length, total: total };
  }
  function syncQo() {
    document.querySelectorAll("[data-order-row]").forEach(function (row) {
      row.hidden = qoLines.indexOf(row.getAttribute("data-product")) === -1;
    });
    var t = qoTotals();
    document.querySelectorAll("[data-order-footer]").forEach(function (f) {
      var meta = f.querySelector("[data-line-count]");
      var tot = f.querySelector("[data-order-total]");
      var btn = f.querySelector("[data-add-all]");
      if (meta) meta.textContent = itemCountLabel(t.n);
      if (tot) tot.textContent = money(t.total);
      if (btn && !cartUi.added) btn.textContent = "Add " + itemCountLabel(t.n) + " to cart";
    });
  }
  function closeTplPop() {
    document.querySelectorAll("[data-tpl-pop]").forEach(function (p) { p.hidden = true; });
    document.querySelectorAll("[data-template].is-open").forEach(function (b) { b.classList.remove("is-open"); });
  }
  function applyTemplate(tplId, mode) {
    var tpl = L.templates.find(function (t) { return t.id === tplId; });
    if (!tpl) return;
    var ids = tpl.lines.map(function (l) { return l.productId; });
    if (mode === "replace") qoLines = ids.slice();
    else ids.forEach(function (id) { if (qoLines.indexOf(id) === -1) qoLines.push(id); });
    closeTplPop();
    syncQo();
    var t = qoTotals();
    showToast(tpl.name + (mode === "replace" ? " replaced the order, " : " added, ") + itemCountLabel(t.n) + ", " + money(t.total));
  }
  window.__applyTemplate = applyTemplate;

  window.__setPerseusQty = function (qty) {
    var line = L.orderLines.find(function (l) {
      return l.productId === "perseus";
    });
    if (!line) return;
    line.qty = qty;
    L.perseusQty = qty;
    L.perseusUnit = L.priceAt(L.products.perseus, qty);
    L.perseusOrderTotal = Math.round(L.perseusUnit * qty * 100) / 100;
    L.orderTotal =
      Math.round(
        L.orderLines.reduce(function (s, l) {
          return s + L.lineAmount(l);
        }, 0) * 100
      ) / 100;
    L.cartTotal = L.orderTotal;
    if (cartUi.added) cartUi.total = L.orderTotal;
    L.invoices[0].amount = L.orderTotal;
    L.credit.used =
      Math.round(
        L.invoices
          .filter(function (inv) {
            return inv.open;
          })
          .reduce(function (s, inv) {
            return s + inv.amount;
          }, 0) * 100
      ) / 100;
    L.credit.available = Math.round((L.credit.limit - L.credit.used) * 100) / 100;
    L.credit.afterOrder = L.credit.available;
    L.credit.thisOrder = L.orderTotal;
    L.credit.priorUsed = Math.round((L.credit.used - L.orderTotal) * 100) / 100;
    L.credit.pct = Math.round((L.credit.used / L.credit.limit) * 1000) / 10;
    L.credit.priorPct = Math.round((L.credit.priorUsed / L.credit.limit) * 1000) / 10;
    L.credit.orderPct = Math.round((L.orderTotal / L.credit.limit) * 1000) / 10;
    L.messages.sam =
      "120 units of Perseus Pro V ship " +
      L.shipDate +
      ". Invoice INV-1042 for " +
      money(L.orderTotal) +
      " covers the full restock on Net 30.";
    L.figures.perseusUnit = L.perseusUnit;
    L.figures.perseusQty = qty;
    L.figures.perseusOrderTotal = L.perseusOrderTotal;
    L.figures.orderTotal = L.orderTotal;
    L.figures.cartTotal = L.cartTotal;
    L.figures.creditUsed = L.credit.used;
    L.figures.creditAvailable = L.credit.available;
    L.figures.invoiceAmounts = L.invoices.map(function (inv) {
      return inv.amount;
    });
    L.figures.lineAmounts = L.orderLines.map(L.lineAmount);
    L.figures.unitPrices = L.orderLines.map(function (l) {
      return L.priceAt(L.products[l.productId], l.qty);
    });
    render();
  };

  document.querySelectorAll("#devSwitcher .tab-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      show(btn.getAttribute("data-tab"));
    });
  });

  render();
})();
  </script>
  <script>
  /* Templates: real expand / collapse */
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-tpl-toggle]");
    if (!b) return;
    var card = b.closest("[data-tpl-card]");
    var open = !card.classList.contains("is-open");
    card.classList.toggle("is-open", open);
    b.setAttribute("aria-expanded", String(open));
  });
  /* Template: edit quantities */
  document.addEventListener("click", function (e) {
    var t = e.target.closest && e.target;
    if (!t) return;
    var ed = t.closest("[data-tpl-edit]");
    if (ed) {
      var card = ed.closest("[data-tpl-card]");
      var on = !card.classList.contains("is-editing");
      card.classList.toggle("is-editing", on);
      ed.textContent = on ? "Done" : "Edit quantities";
      return;
    }
    var q = t.closest("[data-tq]");
    if (q) {
      var L = window.JOOLA_LEDGER, line = q.closest("[data-tpl-line]");
      var p = L.products[line.dataset.product];
      var step = (p.presets && p.presets[0]) || 1;
      var n = Math.max(p.moq || 1, Number(line.dataset.qty) + Number(q.dataset.tq) * step);
      line.dataset.qty = n;
      var unit = L.priceAt(p, n), amt = Math.round(unit * n * 100) / 100;
      line.querySelector(".n").textContent = n;
      line.querySelector(".tpl-qty-read").textContent = n + " \u00d7 " + L.money(unit);
      line.querySelector(".tpl-amt").textContent = L.money(amt);
      var card2 = q.closest("[data-tpl-card]"), tot = 0;
      card2.querySelectorAll("[data-tpl-line]").forEach(function (l) {
        var pp = L.products[l.dataset.product], qq = Number(l.dataset.qty);
        tot += Math.round(L.priceAt(pp, qq) * qq * 100) / 100;
      });
      card2.querySelector("[data-tpl-total]").textContent = L.money(Math.round(tot * 100) / 100);
      var u = 0; card2.querySelectorAll("[data-tpl-line]").forEach(function (l) { u += Number(l.dataset.qty); });
      card2.querySelector("[data-tpl-units]").textContent = u;
      return;
    }
    var add = t.closest("[data-tpl-add]");
    if (add) { add.textContent = "Added to cart"; add.disabled = true; return; }
    if (t.closest("[data-open-invoice]")) { openInv(true); return; }
    if (t.closest("[data-close-invoice]")) { openInv(false); return; }
    if (t.closest("[data-compose-send]")) { sendMsg(); }
  });
  function openInv(on) {
    var m = document.querySelector("[data-inv-modal]");
    if (!m) return;
    m.hidden = !on;
    if (on) m.querySelector(".im-close").focus();
    else { var b = document.querySelector("[data-open-invoice]"); b && b.focus(); }
  }
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") openInv(false);
    if (e.key === "Enter" && e.target.matches && e.target.matches("[data-compose-input]")) { e.preventDefault(); sendMsg(); }
  });
  function sendMsg() {
    var inp = document.querySelector("[data-compose-input]");
    var v = inp && inp.value.trim();
    if (!v) return;
    var L = window.JOOLA_LEDGER, body = document.querySelector('[data-screen="messages"] .thread-body');
    var d = document.createElement("div");
    d.className = "msg me is-new";
    d.innerHTML = '<div class="msg-meta">' + L.retailer.buyer + '<span class="t">Now</span></div><div class="bubble anna"></div>';
    d.querySelector(".bubble").textContent = v;
    body.appendChild(d);
    inp.value = "";
    d.scrollIntoView({ block: "nearest" });
  }
  </script>
</body>
